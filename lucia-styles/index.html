<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTA 6 — Catalogue des styles de Lucia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .preview-img {
      width: 100%;
      aspect-ratio: 17 / 19;
      object-fit: cover;
      cursor: zoom-in;
      background: #111;
    }
    .card-style {
      transition: transform .15s ease, border-color .15s ease;
    }
    .card-style:hover {
      transform: translateY(-2px);
      border-color: var(--bs-primary) !important;
    }
    .angle-dot {
      width: 34px;
      height: 38px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.65;
      border: 2px solid transparent;
      border-radius: 4px;
    }
    .angle-dot.active, .angle-dot:hover {
      opacity: 1;
      border-color: var(--bs-primary);
    }
    .zoom-thumb {
      width: 72px;
      height: 80px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.6;
      border: 2px solid transparent;
      border-radius: 6px;
    }
    .zoom-thumb.active, .zoom-thumb:hover {
      opacity: 1;
      border-color: var(--bs-primary);
    }
  </style>
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg bg-body border-bottom sticky-top">
    <div class="container-fluid px-4">
      <span class="navbar-brand fw-bold">GTA 6 — Lucia Styles Catalog</span>
      <div class="d-flex flex-wrap gap-2 small" id="statsBadges"></div>
    </div>
  </nav>

  <main class="container-fluid px-4 py-4">
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-4">
            <input type="search" id="searchInput" class="form-control form-control-sm" placeholder="Rechercher une coupe, couleur, makeup ou boutique..." />
          </div>
          <div class="col-6 col-md-2">
            <select id="categoryFilter" class="form-select form-select-sm">
              <option value="">Toutes catégories</option>
              <option value="HAIRSTYLE">Hairstyles</option>
              <option value="CREATIVE STYLES">Creative Styles</option>
              <option value="HAIR COLOR">Hair Colors</option>
              <option value="MAKEUP">Makeup</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select id="shopFilter" class="form-select form-select-sm">
              <option value="">Toutes les boutiques</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select id="tabFilter" class="form-select form-select-sm">
              <option value="">Tous onglets</option>
              <option value="SIGNATURE">Signature</option>
              <option value="STANDARD">Standard</option>
              <option value="SPECIAL">Special</option>
            </select>
          </div>
          <div class="col-6 col-md-1">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="exclusiveOnly" />
              <label class="form-check-label small" for="exclusiveOnly">Excl.</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#gridPane" type="button">Galerie (<span id="visibleCount">0</span>)</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shopsPane" type="button">Par Boutique</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="gridPane">
        <div class="row g-3" id="cardsGrid"></div>
      </div>
      <div class="tab-pane fade" id="shopsPane">
        <div class="row g-3" id="shopsSummary"></div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="zoomModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title" id="zoomTitle"></h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center p-2 bg-black">
          <img id="zoomImg" src="" class="img-fluid rounded" alt="" />
          <div class="d-flex justify-content-center gap-2 mt-2 flex-wrap" id="zoomThumbs"></div>
        </div>
        <div class="modal-footer py-2 justify-content-between small" id="zoomMeta"></div>
      </div>
    </div>
  </div>

    const shops = [...new Set(ITEMS.map(x => x.shop))].sort();

    document.getElementById("statsBadges").innerHTML = `

      <span class="badge text-bg-dark border">${shops.length} Boutiques</span>
    `;
    shops.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = `${s} (${ITEMS.filter(x => x.shop === s).length})`;
      shopFilter.appendChild(opt);
    });

    const zoomModal = new bootstrap.Modal(document.getElementById("zoomModal"));
    let activeZoomItem = null;
    let activeZoomIdx = 0;

    function setZoomImage(idx) {
      if (!activeZoomItem) return;
      const list = activeZoomItem.previews || [activeZoomItem.preview];
      activeZoomIdx = (idx + list.length) % list.length;
      document.getElementById("zoomImg").src = list[activeZoomIdx];
      document.querySelectorAll("#zoomThumbs img").forEach((img, i) => {
        img.classList.toggle("active", i === activeZoomIdx);
      });
    }

    function openZoom(item, startIdx = 0) {
      activeZoomItem = item;
      const list = item.previews || [item.preview];
      document.getElementById("zoomTitle").textContent = `${item.name} — ${item.shop}`;
      const thumbsEl = document.getElementById("zoomThumbs");
      thumbsEl.innerHTML = list.map((src, i) => `
        <img src="${src}" class="zoom-thumb ${i === startIdx ? 'active' : ''}" title="${i === 0 ? 'Principale' : 'Vue ' + (i + 1)}" data-idx="${i}" />
      `).join("");
      thumbsEl.querySelectorAll("img").forEach(img => {
        img.addEventListener("click", () => setZoomImage(Number(img.dataset.idx)));
      });
      document.getElementById("zoomMeta").innerHTML = `
        <span>${item.category} ${item.tab ? "• " + item.tab : ""} ${item.index ? "• " + item.index : ""} • ${list.length} vue(s)</span>
        <span class="fw-bold text-success">${item.price || "—"}</span>
      `;
      setZoomImage(startIdx);
      zoomModal.show();
    }

    document.addEventListener("keydown", (e) => {
      if (!document.getElementById("zoomModal").classList.contains("show")) return;
      if (e.key === "ArrowRight") setZoomImage(activeZoomIdx + 1);
      if (e.key === "ArrowLeft") setZoomImage(activeZoomIdx - 1);
    });

            ${stripHtml}
            <div class="card-body p-2 d-flex flex-column gap-1">
              <div class="d-flex justify-content-between align-items-center gap-1">
                <span class="badge ${catBadgeClass[item.category] || 'text-bg-secondary'}">${item.category}</span>
                ${item.price ? `<span class="badge text-bg-success">${item.price}</span>` : ""}
              </div>
              <div class="fw-semibold small text-truncate" title="${item.name}">${item.name}</div>
              <div class="text-body-secondary small text-truncate" title="${item.shop}">${item.shop}</div>
              <div class="d-flex flex-wrap gap-1 mt-auto pt-1">
                ${item.tab ? `<span class="badge text-bg-dark border">${item.tab}</span>` : ""}
                ${item.exclusive ? `<span class="badge text-bg-info">EXCLUSIVE</span>` : ""}
                ${item.note ? `<span class="badge text-bg-secondary text-truncate mw-100" title="${item.note}">${item.note}</span>` : ""}
              </div>
            </div>
          </div>
        `;
        const mainImg = col.querySelector(".preview-img");
        let currentIdx = 0;
        mainImg.addEventListener("click", () => openZoom(item, currentIdx));
        col.querySelectorAll(".angle-dot").forEach(dot => {
          dot.addEventListener("click", () => {
            currentIdx = Number(dot.dataset.idx);
            mainImg.src = list[currentIdx];
            col.querySelectorAll(".angle-dot").forEach((d, i) => d.classList.toggle("active", i === currentIdx));
          });
        });
        cardsGrid.appendChild(col);
      }
    }

    const shopsSummary = document.getElementById("shopsSummary");
    for (const s of shops) {
      const sItems = ITEMS.filter(x => x.shop === s);
      const col = document.createElement("div");
      col.className = "col-12 col-lg-6";
      const rows = sItems.map(x => `
        <tr>
          <td><span class="badge ${catBadgeClass[x.category] || 'text-bg-secondary'}">${x.category}</span></td>
          <td class="fw-medium">${x.name}</td>
          <td>${x.tab || "—"}</td>
          <td class="text-success fw-semibold">${x.price || "—"}</td>
        </tr>
      `).join("");
      col.innerHTML = `
        <div class="card shadow-sm h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold">${s}</span>
            <span class="badge text-bg-secondary">${sItems.length} styles</span>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 small">
              <thead><tr><th>Catégorie</th><th>Nom</th><th>Onglet</th><th>Prix</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
      shopsSummary.appendChild(col);
    }

    [searchInput, categoryFilter, shopFilter, tabFilter, exclusiveOnly].forEach(el => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });
    render();
  </script>
</body>
</html>
