<!doctype html>
<!--
  Rig comparison page

  Loads any model from media/ (GLB or FBX) and dumps its rig stats so you
  can compare against the Lara reference (lara_croft__2026_rigged.glb).

  Serve at http://localhost:8080/rigs_compare.html
  (python3 -m http.server 8080 — NOT Vite, which reloads main app on edits).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rig comparison</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background: #1a1a1f; color: #e0e0e8; overflow: hidden; }
    #app { display: flex; height: 100vh; }
    #view { flex: 1; position: relative; min-width: 0; }
    #panel { width: 480px; overflow-y: auto; background: #22232a; padding: 12px 16px; border-left: 1px solid #333; font-size: 12.5px; }
    h2 { margin: 8px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #88e; border-bottom: 1px solid #444; padding-bottom: 4px; }
    h3 { margin: 10px 0 4px; font-size: 12px; color: #cce; }
    select, input { background: #181820; color: #eee; border: 1px solid #444; padding: 2px 5px; font-size: 12px; }
    select { width: 100%; }
    pre { background: #181820; padding: 6px 8px; margin: 4px 0; border-radius: 3px; font-size: 10.5px; line-height: 1.4; overflow-x: auto; color: #cdd; }
    .row { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
    .row label { flex: 0 0 110px; font-size: 11px; color: #aab; }
    .stat { display: grid; grid-template-columns: 160px 1fr 1fr; gap: 4px; font-family: monospace; font-size: 11px; padding: 1px 0; align-items: baseline; }
    .stat .k { color: #889; }
    .stat .v { color: #fea; }
    .stat .ref { color: #88f; }
    .stat .v.diff { color: #fa6; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-right: 4px; }
    .badge.mixamo { background: #553; color: #ffd; }
    .badge.lara   { background: #535; color: #fdf; }
    .badge.fbx    { background: #355; color: #cff; }
    .badge.unknown{ background: #444; color: #aaa; }
    .badge.daz    { background: #525; color: #fdf; }
    button { background: #335; color: #fff; border: 1px solid #66a; padding: 4px 10px; font-size: 11px; cursor: pointer; border-radius: 3px; }
    button:hover { background: #447; }
    #hud { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.55); padding: 6px 10px; font-family: monospace; font-size: 11px; border-radius: 3px; pointer-events: none; line-height: 1.45; }
    #treeBox { max-height: 320px; overflow-y: auto; }
    .tree { font-family: monospace; font-size: 10.5px; line-height: 1.3; color: #abb; }
    .tree .match { color: #fea; }
    .tree .miss  { color: #888; }
    .matrix { font-family: monospace; font-size: 10.5px; color: #cdd; }
  </style>
</head>
<body>
  <div id="app">
    <div id="view"><div id="hud">select a model</div></div>
    <div id="panel"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three":           "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/":   "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE        from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { FBXLoader }     from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

    // ── File list (matches what was copied into media/) ──────────────────────
    const REFERENCE = 'lara_croft__2026_rigged.glb';
    const MODELS = [
      REFERENCE,
      'lara_mixamo.glb',
      'bald_barbie_rigged.glb',
      'patrycja.glb',
      'rebeca 2.glb',
      'selena.glb',
      'Ch36_nonPBR.fbx',
      'clover_dancing_twerk.glb',
      'cyberpunk_girl.glb',
      'dancing_twerk.glb',
      'DinatihCh06_nonPBR.fbx',
      'female_basic_body_model.glb',
      'female_r_edecan.glb',

      'girl_with_clothes._worker_set.glb',
      'harley_quinn_.fbx_to_daz_studio.glb',
      'harley_quinn_hip_hop_dancing.glb',
      'hight_quality_realistic_girl_character.glb',
      'jill_valentine.glb',
      'lara_croft.glb',
      'lara_croft_4259.glb',
      'lara_croft_black_tank_top.glb',
      'lara_croft_dress_345.glb',
      'lara_croft_gold_shades_2739_rigged.glb',
      'lara_croft_swim_gear.glb',
      'lara_croft_throwback.glb',
      'low_lady_deadpool.glb',
      'low_lady_in_red_dress.glb',
      'low_woman_in_red.glb',
      'mariyapro_beutiy_girl_restricted..glb',
      'police.glb',
      'red_robot.glb',
      'red_x_bot_idle.glb',
      'resident_evil_creature_13.glb',
      'roblox_squid_game_guard.glb',
      'robocop.glb',
      'shantae__red.glb',
      'tera_homunculus.glb',
      'terminator_t-800_endo-skeleton_damaged.glb',
      'tesla_bot.glb',
      'tifa_embedded.fbx',
      'tiffa_rigged.glb',
      'valery_tpose_blender_rigged_woman.glb',
      'vrchat_ruiko.glb',
      'y_bot_from_mixamo.glb',
      'zombie.glb',
    ];

    // Common "landmark" bones we look for across rigs. Each entry = list of
    // case-insensitive patterns; first hit wins.
    const LANDMARKS = {
      hips:        [/^hips?$/i, /pelvis/i, /^mixamorig:?hips?$/i, /^root[ _]?hips?/i],
      spine:       [/^spine$/i, /^spine[12]?$/i, /^mixamorig:?spine/i, /^spine[ _]?lower/i],
      head:        [/^head$/i, /^mixamorig:?head$/i, /^head[ _]?neck[ _]?upper/i],
      neck:        [/^neck$/i, /^mixamorig:?neck$/i, /^head[ _]?neck[ _]?lower/i],
      lShoulder:   [/^left[ _]?shoulder$/i, /^mixamorig:?leftshoulder$/i, /^arm[ _]?left[ _]?shoulder/i],
      rShoulder:   [/^right[ _]?shoulder$/i, /^mixamorig:?rightshoulder$/i, /^arm[ _]?right[ _]?shoulder/i],
      lUpperArm:   [/^left[ _]?(arm|upperarm)$/i, /^mixamorig:?leftarm$/i, /arm[ _]?left[ _]?(elbow|upper)/i],
      rUpperArm:   [/^right[ _]?(arm|upperarm)$/i, /^mixamorig:?rightarm$/i, /arm[ _]?right[ _]?(elbow|upper)/i],
      lForeArm:    [/^left[ _]?(forearm|lowerarm)$/i, /^mixamorig:?leftforearm$/i, /arm[ _]?left[ _]?elbow/i],
      rForeArm:    [/^right[ _]?(forearm|lowerarm)$/i, /^mixamorig:?rightforearm$/i, /arm[ _]?right[ _]?elbow/i],
      lHand:       [/^left[ _]?hand$/i, /^mixamorig:?lefthand$/i, /arm[ _]?left[ _]?wrist/i],
      rHand:       [/^right[ _]?hand$/i, /^mixamorig:?righthand$/i, /arm[ _]?right[ _]?wrist/i],
      lThigh:      [/^left[ _]?(upleg|thigh)$/i, /^mixamorig:?leftupleg$/i, /leg[ _]?left[ _]?thigh/i],
      rThigh:      [/^right[ _]?(upleg|thigh)$/i, /^mixamorig:?rightupleg$/i, /leg[ _]?right[ _]?thigh/i],
      lShin:       [/^left[ _]?(leg|shin|knee)$/i, /^mixamorig:?leftleg$/i, /leg[ _]?left[ _]?knee/i],
      rShin:       [/^right[ _]?(leg|shin|knee)$/i, /^mixamorig:?rightleg$/i, /leg[ _]?right[ _]?knee/i],
      lFoot:       [/^left[ _]?(foot|ankle)$/i, /^mixamorig:?leftfoot$/i, /leg[ _]?left[ _]?ankle/i],
      rFoot:       [/^right[ _]?(foot|ankle)$/i, /^mixamorig:?rightfoot$/i, /leg[ _]?right[ _]?ankle/i],
    };

    function detectConvention(boneNames) {
      const has = (re) => boneNames.some(n => re.test(n));
      if (has(/^mixamorig:/i) || has(/^mixamorig[A-Z]/)) return 'mixamo';
      if (has(/^head[ _]?neck[ _]?upper/i) || has(/^head[ _]?hair[ _]?ponytail/i)) return 'lara';
      if (has(/_\d{2,}$/)) return 'lara';  // numeric suffix style
      if (has(/^hip$/i) && has(/^pelvis$/i)) return 'daz';
      if (has(/^(Hips|Spine|Head|LeftArm|RightArm)$/)) return 'fbx';
      return 'unknown';
    }

    function findLandmarks(boneNames) {
      const result = {};
      for (const [k, patterns] of Object.entries(LANDMARKS)) {
        let match = null;
        for (const re of patterns) {
          match = boneNames.find(n => re.test(n));
          if (match) break;
        }
        result[k] = match;
      }
      return result;
    }

    function analyzeRig(root) {
      const bones = [];
      const meshes = [];
      let nVerts = 0, nTris = 0;
      root.traverse(c => {
        if (c.isBone) bones.push(c);
        if (c.isMesh) {
          meshes.push(c);
          const g = c.geometry;
          if (g && g.attributes && g.attributes.position) {
            nVerts += g.attributes.position.count;
            if (g.index) nTris += g.index.count / 3;
            else nTris += g.attributes.position.count / 3;
          }
        }
      });
      const boneNames = bones.map(b => b.name);
      const convention = detectConvention(boneNames);
      const landmarks  = findLandmarks(boneNames);

      // Hierarchy depth
      let maxDepth = 0;
      bones.forEach(b => {
        let d = 0;
        let p = b.parent;
        while (p && p.isBone) { d++; p = p.parent; }
        if (d > maxDepth) maxDepth = d;
      });

      // BBox + center
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());

      // Skinned meshes only
      const skinned = meshes.filter(m => m.isSkinnedMesh);

      return {
        boneCount: bones.length,
        bones,
        boneNames,
        convention,
        landmarks,
        maxDepth,
        meshCount: meshes.length,
        skinnedCount: skinned.length,
        meshes,
        verts: nVerts,
        tris: Math.floor(nTris),
        bbox: { x: size.x, y: size.y, z: size.z },
        materials: collectMaterials(meshes),
      };
    }

    function meshStats(m) {
      const g = m.geometry;
      const v = (g && g.attributes && g.attributes.position) ? g.attributes.position.count : 0;
      const t = g && g.index ? Math.floor(g.index.count / 3) : (v ? Math.floor(v / 3) : 0);
      const matNames = [].concat(m.material || [])
        .filter(Boolean).map(mat => mat.name || '(unnamed)').join(', ');
      return { v, t, matNames, skinned: !!m.isSkinnedMesh };
    }

    function collectMaterials(meshes) {
      const set = new Set();
      for (const m of meshes) {
        if (!m.material) continue;
        [].concat(m.material).forEach(mat => { if (mat) set.add(mat.name || '(unnamed)'); });
      }
      return Array.from(set);
    }

    // ── Scene ────────────────────────────────────────────────────────────────
    const viewEl = document.getElementById('view');
    const hud    = document.getElementById('hud');
    const panel  = document.getElementById('panel');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1f);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
    camera.position.set(200, 200, 300);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 90, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(200, 300, 200);
    scene.add(sun);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ color: 0x2a2a32, roughness: 0.95 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(800, 40, 0x444460, 0x33333a));
    scene.add(new THREE.AxesHelper(60));

    function resize() {
      const w = viewEl.clientWidth, h = viewEl.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Loaders ──────────────────────────────────────────────────────────────
    const gltfLoader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
    gltfLoader.setDRACOLoader(draco);
    const fbxLoader = new FBXLoader();

    function loadModel(filename) {
      return new Promise((resolve, reject) => {
        let path = 'public/media/glb/';
        if (ANIM_FILES.includes(filename) && filename !== '(none)') {
          path = 'public/media/glb-animations/';
        }
        
        const fullPath = path + filename;
        const onLoad = root => resolve({ root, animations: root.animations || [] });
        const onErr = err => reject(err);
        
        if (filename.toLowerCase().endsWith('.fbx')) {
          fbxLoader.load(fullPath, onLoad, undefined, onErr);
        } else {
          gltfLoader.load(fullPath, gltf => resolve({ root: gltf.scene, animations: gltf.animations || [] }), undefined, onErr);
        }
      });
    }

    // ── Reference (Lara) ─────────────────────────────────────────────────────
    // Loaded once, displayed permanently at X+150 offset for side-by-side
    // visual comparison. Hidden when current model === REFERENCE (would overlap).
    let referenceStats = null;
    let referenceAnims = [];
    let referenceRoot = null;
    let referenceSkel = null;
    let referenceBoneAxisHelpers = [];
    const REFERENCE_OFFSET_X = 150;
    async function loadReference() {
      try {
        const { root, animations } = await loadModel(REFERENCE);
        referenceAnims = animations;

        // Same normalize as current model: 170 cm tall, feet on ground.
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        if (size.y > 0) root.scale.setScalar(170 / size.y);
        box.setFromObject(root);
        root.position.set(REFERENCE_OFFSET_X, -box.min.y, 0);

        // analyzeRig AFTER scaling so bbox matches current-model units (cm).
        referenceStats = analyzeRig(root);

        scene.add(root);
        referenceRoot = root;
        referenceSkel = new THREE.SkeletonHelper(root);
        referenceSkel.material.linewidth = 1;
        scene.add(referenceSkel);

        // Bone-axis helpers on reference (mirror current-model behavior).
        for (const bone of referenceStats.bones) {
          const ax = new THREE.AxesHelper(0.10);
          ax.material.depthTest = false;
          ax.renderOrder = 999;
          bone.add(ax);
          referenceBoneAxisHelpers.push({ bone, helper: ax });
        }

        updateReferenceVisibility();
        renderPanel(null, null);
      } catch (e) {
        console.error('reference load failed', e);
      }
    }

    function updateReferenceVisibility() {
      if (!referenceRoot) return;
      // Always render reference at offset — even when current === REFERENCE
      // (otherwise toggle has no visible effect on initial Lara view).
      referenceRoot.visible = display.showReference;
      if (referenceSkel) referenceSkel.visible = display.showReference && display.skeleton;
      referenceBoneAxisHelpers.forEach(({ helper }) => {
        helper.visible = display.showReference && display.boneAxes;
      });
    }

    // ── Current model state ──────────────────────────────────────────────────
    let currentRoot = null;
    let skeletonHelper = null;
    let boneAxisHelpers = [];
    let currentIdx = 0;
    // Display toggles persist across model switches
    const display = { skeleton: true, boneAxes: false, wireframe: false, hideMesh: false, showReference: true };

    // ── Animation playback state ────────────────────────────────────────────
    const ANIM_FILES = [
      "(none)",
      "angry_gesture.glb",
      "ascending_stairs.glb",
      "asking_question.glb",
      "beckoning.glb",
      "catwalk_sequence_01.glb",
      "catwalk_sequence_02.glb",
      "catwalk_sequence_03.glb",
      "catwalk_sequence_04.glb",
      "catwalk_sequence_05.glb",
      "cheering_while_sitting.glb",
      "clapping.glb",
      "closing.glb",
      "crawl_backwards_in_prone.glb",
      "descending_stairs.glb",
      "dig_and_plant_seeds.glb",
      "disappointed.glb",
      "double_leg_takedown_-_attacker.glb",
      "drinking_fountain.glb",
      "finding.glb",
      "gaming.glb",
      "hanging_idle.glb",
      "having_a_meeting,_female.glb",
      "having_a_meeting,_male.glb",
      "jumping_jacks.glb",
      "laying_seizure.glb",
      "laying_severe_cough.glb",
      "left_turn.glb",
      "looking_through_files_low.glb",
      "martelo_do_chau_sem_mao.glb",
      "one_shoulder_lean.glb",
      "pick_fruit.glb",
      "plant_a_plant.glb",
      "plant_tree.glb",
      "pointing.glb",
      "pull_pilot_from_seat.glb",
      "pull_plant.glb",
      "pulled_from_seat.glb",
      "rapping.glb",
      "right_turn.glb",
      "rummaging.glb",
      "scared.glb",
      "searching_pockets.glb",
      "seated_idle.glb",
      "sitting_drinking.glb",
      "sitting_talking.glb",
      "skinning_test.glb",
      "stand_up.glb",
      "standing_arguing.glb",
      "surprised.glb",
      "swing_into_wall.glb",
      "t-pose.glb",
      "talking.glb",
      "talking_at_watercooler.glb",
      "talking_on_a_cell_phone.glb",
      "talking_on_phone.glb",
      "telling_a_secret.glb",
      "tonic_seizure.glb",
      "tripping.glb",
      "victory.glb",
      "walking.glb",
      "watering.glb",
      "wheelbarrow_walk_turn.glb",
      "wheelchair.glb",
      "writing.glb",
      "yelling.glb",
    ];
    const animState = {
      selected: '(none)',
      clip: null,           // loaded THREE.AnimationClip
      sourceScene: null,    // source GLB root (kept for retargetClip rest pose)
      sourceBoneNames: [],  // bone names present in source anim (for compat hint)
      mixer: null,
      action: null,
      paused: false,
      mappedTracks: 0,      // for hint display
      mode: 'direct',       // 'direct' (raw quats, works for matching-rest rigs) | 'retarget' (SkeletonUtils, broken on snapped rigs)
    };
    const animClock = new THREE.Clock();

    function findFirstSkinnedMesh(root) {
      let m = null;
      root.traverse(c => { if (!m && c.isSkinnedMesh) m = c; });
      return m;
    }

    async function loadAnimSource(filename) {
      if (filename === '(none)') {
        animState.clip = null;
        animState.sourceScene = null;
        animState.sourceBoneNames = [];
        stopCurrentAnim();
        return;
      }
      try {
        const { root, animations } = await loadModel(filename);
        if (!animations || animations.length === 0) {
          console.warn(`${filename} has no animations`);
          animState.clip = null;
          animState.sourceScene = null;
          animState.sourceBoneNames = [];
          stopCurrentAnim();
          return;
        }
        animState.clip = animations[0];
        animState.sourceScene = root;
        // Force matrices to update so retargetClip sees bind pose
        root.updateMatrixWorld(true);
        const boneSet = new Set();
        for (const t of animState.clip.tracks) {
          const m = t.name.match(/^(.+?)\./);
          if (m) boneSet.add(m[1]);
        }
        animState.sourceBoneNames = [...boneSet];
        console.log(`loaded anim ${filename}: ${animState.clip.name} dur=${animState.clip.duration.toFixed(2)} tracks=${animState.clip.tracks.length}`);
        applyAnimToCurrent();
      } catch (e) {
        console.error('anim load failed', e);
      }
    }

    function stopCurrentAnim() {
      if (animState.action) { animState.action.stop(); animState.action = null; }
      if (animState.mixer)  { animState.mixer.stopAllAction(); animState.mixer = null; }
    }

    function applyAnimToCurrent() {
      stopCurrentAnim();
      if (!animState.clip || !currentRoot || !animState.sourceScene) return;

      const tgtMesh = findFirstSkinnedMesh(currentRoot);
      const srcMesh = findFirstSkinnedMesh(animState.sourceScene);
      if (!tgtMesh || !srcMesh) {
        console.warn(`no skinned mesh — target:${!!tgtMesh} source:${!!srcMesh}`);
        return;
      }

      // Source at native scale (1). Both rigs share native units (m).
      // Target rootScale = 170/native_h ≈ 100 (m→cm). Source hip local 0.95 m
      // → target local 0.95 → target world 95 cm. No hip scaling needed.
      animState.sourceScene.scale.setScalar(1);
      animState.sourceScene.updateMatrixWorld(true);
      const hipScale = 1.0;

      // Bone name remap: target name → source name (via normalized key)
      const norm = s => s.replace(/_\d+$/, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const srcByKey = new Map();
      for (const b of srcMesh.skeleton.bones) srcByKey.set(norm(b.name), b.name);

      const names = {};
      let mapped = 0;
      for (const b of tgtMesh.skeleton.bones) {
        const sn = srcByKey.get(norm(b.name));
        if (sn) { names[b.name] = sn; mapped++; }
      }
      animState.mappedTracks = mapped;
      console.log(`retarget map: ${mapped}/${tgtMesh.skeleton.bones.length} target bones mapped to source`);

      if (mapped === 0) {
        const srcSample = srcMesh.skeleton.bones.slice(0, 8).map(b => b.name);
        const tgtSample = tgtMesh.skeleton.bones.slice(0, 8).map(b => b.name);
        console.warn('  src bones: ' + srcSample.join(' | '));
        console.warn('  tgt bones: ' + tgtSample.join(' | '));
        return;
      }

      // Two modes:
      //   - retarget: SkeletonUtils.retargetClip samples per-frame source world pose
      //               and converts to target local — corrects bone roll / rest mismatch.
      //   - direct:   raw quaternion assignment via renamed tracks. Works only if
      //               source + target rest poses align closely. Hip pos scaled by k.

      let usedClip = null;

      if (animState.mode === 'retarget') {
        try {
          if (typeof SkeletonUtils.retargetClip !== 'function') {
            throw new Error('SkeletonUtils.retargetClip not available');
          }
          usedClip = SkeletonUtils.retargetClip(tgtMesh, srcMesh, animState.clip, {
            names,
            useFirstFramePosition: false,
            fps: 30,
          });
          usedClip.name = animState.clip.name + ' [retarget]';
          // Strip scale tracks (FBX→GLB pipelines often inject 0.01 scale) and
          // non-hip position tracks (they cause limb detachment under rest mismatch).
          const before = usedClip.tracks.length;
          usedClip.tracks = usedClip.tracks.filter(t => {
            const [bn, prop] = t.name.split('.');
            if (prop === 'scale') return false;
            if (prop === 'position' && norm(bn) !== 'mixamorighips') return false;
            return true;
          });
          console.log(`retargetClip OK — tracks=${usedClip.tracks.length} (stripped ${before - usedClip.tracks.length})`);
        } catch (e) {
          console.error('retargetClip failed:', e);
        }
      }

      if (!usedClip) {
        // Direct path — rewrite names, strip ALL position + scale tracks. Bind
        // pose's bone positions are preserved; only rotations animate.
        const tgtByKey = new Map();
        for (const b of tgtMesh.skeleton.bones) tgtByKey.set(norm(b.name), b.name);
        const clone = animState.clip.clone();
        const newTracks = [];
        for (const t of clone.tracks) {
          const [boneName, prop] = t.name.split('.');
          const target = tgtByKey.get(norm(boneName));
          if (!target) continue;
          if (prop !== 'quaternion') continue;
          t.name = target + '.' + prop;
          newTracks.push(t);
        }
        usedClip = new THREE.AnimationClip(animState.clip.name + ' [direct]', animState.clip.duration, newTracks);
        console.log(`direct mode — tracks=${usedClip.tracks.length} (quaternion-only, bind pose preserved)`);
      }

      animState.mixer = new THREE.AnimationMixer(currentRoot);
      animState.action = animState.mixer.clipAction(usedClip);
      animState.action.setLoop(THREE.LoopRepeat, Infinity);
      animState.action.play();
      animState.paused = false;

      // Diagnostic: verify track names resolve to actual bones via getObjectByName
      let resolved = 0, missing = [];
      for (const t of usedClip.tracks) {
        const nodeName = t.name.split('.')[0];
        const node = currentRoot.getObjectByName(nodeName);
        if (node) resolved++;
        else if (missing.length < 4) missing.push(nodeName);
      }
      console.log(`bindings: ${resolved}/${usedClip.tracks.length} tracks resolved`);
      if (missing.length) console.warn('  missing nodes (first 4):', missing.join(' | '));

      // Diagnostic: hip track value + actual world position after first update
      const hipTrack = usedClip.tracks.find(t => /Hips\.position$/.test(t.name));
      if (hipTrack) {
        console.log(`hip track first frame: (${hipTrack.values[0].toFixed(3)}, ${hipTrack.values[1].toFixed(3)}, ${hipTrack.values[2].toFixed(3)})`);
      } else {
        console.log('no hip position track in clip');
      }
      // tick once and log hip bone world pos
      animState.mixer.update(0.001);
      currentRoot.updateMatrixWorld(true);
      const hipBone = currentRoot.getObjectByName('mixamorigHips');
      if (hipBone) {
        const wp = new THREE.Vector3();
        hipBone.getWorldPosition(wp);
        console.log(`hip bone world pos after 1 tick: (${wp.x.toFixed(2)}, ${wp.y.toFixed(2)}, ${wp.z.toFixed(2)})  local=(${hipBone.position.x.toFixed(3)}, ${hipBone.position.y.toFixed(3)}, ${hipBone.position.z.toFixed(3)})`);
      }
      console.log(`currentRoot scale: ${currentRoot.scale.x.toFixed(3)}`);
    }

    function disposeCurrent() {
      stopCurrentAnim();
      if (currentRoot) {
        scene.remove(currentRoot);
        currentRoot.traverse(c => {
          if (c.geometry) c.geometry.dispose();
          if (c.material) [].concat(c.material).forEach(m => m && m.dispose && m.dispose());
        });
        currentRoot = null;
      }
      if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; }
      boneAxisHelpers.forEach(({ bone, helper }) => bone.remove(helper));
      boneAxisHelpers = [];
    }

    function applyDisplay() {
      if (skeletonHelper) skeletonHelper.visible = display.skeleton;
      boneAxisHelpers.forEach(({ helper }) => helper.visible = display.boneAxes);
      updateReferenceVisibility();
      if (currentRoot) {
        currentRoot.traverse(c => {
          if (c.isMesh) {
            c.visible = !display.hideMesh;
            [].concat(c.material).forEach(m => { if (m) m.wireframe = display.wireframe; });
          }
        });
      }
    }

    function stepModel(delta) {
      currentIdx = (currentIdx + delta + MODELS.length) % MODELS.length;
      selectModel(MODELS[currentIdx]);
    }

    // Arrow keys (and J/K) navigate. Skips dropdown — works anywhere on page
    // except when an input/select is focused.
    window.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'j') {
        e.preventDefault(); stepModel(+1);
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'k') {
        e.preventDefault(); stepModel(-1);
      }
    });

    async function selectModel(filename) {
      const idx = MODELS.indexOf(filename);
      if (idx >= 0) currentIdx = idx;
      hud.textContent = `loading ${filename}…`;
      disposeCurrent();
      try {
        const { root, animations } = await loadModel(filename);
        // Scale to ~1.734 m tall and center on ground.
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const target = 1.734;
        if (size.y > 0) root.scale.setScalar(target / size.y);
        box.setFromObject(root);
        root.position.set(0, -box.min.y, 0);

        scene.add(root);
        skeletonHelper = new THREE.SkeletonHelper(root);
        skeletonHelper.material.linewidth = 2;
        skeletonHelper.material.depthTest = false;
        
        // Color based on filename
        if (filename.includes('character.glb')) {
          skeletonHelper.material.color.set(0xff3333); // Bright, lighter red for Character
        } else if (filename.includes('y_bot')) {
          skeletonHelper.material.color.set(0x00ffff); // Cyan for Y-Bot
        } else if (filename.includes('lara_mixamo')) {
          skeletonHelper.material.color.set(0xff00ff); // Magenta for Perfect Rig
        } else {
          skeletonHelper.material.color.set(0x0066ff); // Electric Blue for Others
        }
        
        scene.add(skeletonHelper);

        currentRoot = root;
        const stats = analyzeRig(root);

        // Attach bone-axis helpers (hidden by default; toggle shows them).
        // Use fixed local size — bone helpers inherit chain scale from root
        // (often 100x for 1m→100cm rigs), so any bbox-based world-size yields
        // giant rays. Match lara_debug.html's 0.10 local-unit sizing.
        for (const bone of stats.bones) {
          const ax = new THREE.AxesHelper(0.10);
          ax.material.depthTest = false;
          ax.renderOrder = 999;
          bone.add(ax);
          boneAxisHelpers.push({ bone, helper: ax });
        }

        applyDisplay();
        renderPanel(filename, { stats, animations });
        hud.textContent = `${filename}\n${stats.boneCount} bones · ${stats.skinnedCount} skinned meshes · ${animations.length} anims`;

        // Drop anim on model switch — different rig, re-pick anim manually
        stopCurrentAnim();
      } catch (e) {
        hud.textContent = `LOAD ERROR\n${filename}\n${e.message || e}`;
        renderPanel(filename, null);
        console.error(e);
      }
    }

    // ── Panel rendering ──────────────────────────────────────────────────────
    function renderPanel(filename, data) {
      panel.innerHTML = '';

      const sel = document.createElement('select');
      MODELS.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = m + (m === REFERENCE ? '  ★ reference' : '');
        if (m === filename) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => { selectModel(sel.value); sel.blur(); };
      const pickWrap = document.createElement('div');
      pickWrap.innerHTML = '<h2>Pick model (↑/↓ or J/K keys to step)</h2>';
      pickWrap.appendChild(sel);

      const navRow = document.createElement('div'); navRow.style.display = 'flex'; navRow.style.gap = '4px'; navRow.style.marginTop = '4px'; navRow.style.alignItems = 'center';
      const prevBtn = document.createElement('button'); prevBtn.textContent = '◀ Prev';
      prevBtn.onclick = () => { stepModel(-1); prevBtn.blur(); };
      const nextBtn = document.createElement('button'); nextBtn.textContent = 'Next ▶';
      nextBtn.onclick = () => { stepModel(+1); nextBtn.blur(); };
      const counter = document.createElement('span');
      counter.style.fontFamily = 'monospace'; counter.style.fontSize = '11px'; counter.style.color = '#aab';
      counter.textContent = `${currentIdx + 1} / ${MODELS.length}`;
      navRow.appendChild(prevBtn); navRow.appendChild(nextBtn); navRow.appendChild(counter);
      pickWrap.appendChild(navRow);

      // Copyable filename — plain text, not input (input steals focus, breaks
      // J/K shortcuts). `user-select: all` = single click selects whole string.
      const fnTxt = document.createElement('div');
      fnTxt.textContent = filename;
      fnTxt.style.fontFamily = 'monospace';
      fnTxt.style.fontSize = '11px';
      fnTxt.style.marginTop = '4px';
      fnTxt.style.color = '#cfc';
      fnTxt.style.userSelect = 'all';
      fnTxt.style.webkitUserSelect = 'all';
      fnTxt.style.cursor = 'text';
      fnTxt.title = 'Click selects all · Ctrl+C copies';
      pickWrap.appendChild(fnTxt);

      panel.appendChild(pickWrap);

      // Display toggles
      const dispWrap = document.createElement('div');
      dispWrap.innerHTML = '<h2>Display</h2>';
      const toggles = document.createElement('div');
      toggles.style.display = 'flex'; toggles.style.gap = '4px'; toggles.style.flexWrap = 'wrap';
      function tBtn(label, key) {
        const b = document.createElement('button');
        b.className = 'toggle'; b.textContent = label;
        b.style.background = display[key] ? '#585' : '#335';
        b.style.borderColor = display[key] ? '#ada' : '#66a';
        b.onclick = () => {
          display[key] = !display[key];
          b.style.background = display[key] ? '#585' : '#335';
          b.style.borderColor = display[key] ? '#ada' : '#66a';
          applyDisplay();
          b.blur();
        };
        return b;
      }
      toggles.appendChild(tBtn('Skeleton',  'skeleton'));
      toggles.appendChild(tBtn('Bone axes', 'boneAxes'));
      toggles.appendChild(tBtn('Wireframe', 'wireframe'));
      toggles.appendChild(tBtn('Hide mesh', 'hideMesh'));
      toggles.appendChild(tBtn('Show ref',  'showReference'));
      dispWrap.appendChild(toggles);
      panel.appendChild(dispWrap);

      // Animation source picker
      const animWrap = document.createElement('div');
      animWrap.innerHTML = '<h2>Mixamo animation (test retarget)</h2>';
      const animSel = document.createElement('select');
      ANIM_FILES.forEach(f => {
        const o = document.createElement('option');
        o.value = f; o.textContent = f;
        if (f === animState.selected) o.selected = true;
        animSel.appendChild(o);
      });
      animSel.onchange = () => {
        animState.selected = animSel.value;
        loadAnimSource(animSel.value);
        animSel.blur();
        renderPanel(filename, data);
      };
      animWrap.appendChild(animSel);

      // Mode toggle: retarget (rest-pose aware) vs direct (raw quats)
      const modeRow = document.createElement('div');
      modeRow.style.display = 'flex'; modeRow.style.gap = '4px'; modeRow.style.marginTop = '4px';
      modeRow.style.fontFamily = 'monospace'; modeRow.style.fontSize = '11px';
      const modeLabel = document.createElement('span');
      modeLabel.textContent = 'mode:'; modeLabel.style.color = '#9ab'; modeLabel.style.alignSelf = 'center';
      const modeRetargetBtn = document.createElement('button');
      modeRetargetBtn.textContent = 'retarget';
      modeRetargetBtn.style.background = animState.mode === 'retarget' ? '#585' : '#335';
      const modeDirectBtn = document.createElement('button');
      modeDirectBtn.textContent = 'direct';
      modeDirectBtn.style.background = animState.mode === 'direct' ? '#585' : '#335';
      const setMode = m => () => {
        animState.mode = m;
        applyAnimToCurrent();
        renderPanel(filename, data);
      };
      modeRetargetBtn.onclick = setMode('retarget');
      modeDirectBtn.onclick = setMode('direct');
      modeRow.appendChild(modeLabel);
      modeRow.appendChild(modeRetargetBtn);
      modeRow.appendChild(modeDirectBtn);
      animWrap.appendChild(modeRow);

      const animBtnRow = document.createElement('div');
      animBtnRow.style.display = 'flex'; animBtnRow.style.gap = '4px'; animBtnRow.style.marginTop = '4px';

      const playBtn = document.createElement('button');
      playBtn.textContent = animState.paused ? '▶ Play' : '⏸ Pause';
      playBtn.onclick = () => {
        if (!animState.action) return;
        animState.paused = !animState.paused;
        animState.action.paused = animState.paused;
        playBtn.textContent = animState.paused ? '▶ Play' : '⏸ Pause';
        playBtn.blur();
      };
      const restartBtn = document.createElement('button');
      restartBtn.textContent = '⟲ Restart';
      restartBtn.onclick = () => { if (animState.action) { animState.action.reset(); animState.action.play(); animState.paused = false; } restartBtn.blur(); };

      animBtnRow.appendChild(playBtn);
      animBtnRow.appendChild(restartBtn);
      animWrap.appendChild(animBtnRow);

      // Compatibility hint
      if (animState.clip) {
        const hint = document.createElement('div');
        hint.style.fontFamily = 'monospace'; hint.style.fontSize = '10.5px'; hint.style.marginTop = '4px';
        const tgtMesh = currentRoot ? findFirstSkinnedMesh(currentRoot) : null;
        const totalBones = tgtMesh ? tgtMesh.skeleton.bones.length : 0;
        const mapped = animState.mappedTracks || 0;
        const pct = totalBones ? Math.round((mapped / totalBones) * 100) : 0;
        hint.style.color = pct === 0 ? '#f88' : pct < 50 ? '#fa6' : '#9f9';
        hint.textContent = `bones mapped: ${mapped}/${totalBones} (${pct}%)  clip="${animState.clip.name}" dur=${animState.clip.duration.toFixed(2)}s`;
        animWrap.appendChild(hint);
      }
      panel.appendChild(animWrap);

      if (!data) {
        const note = document.createElement('div'); note.style.color = '#888'; note.style.marginTop = '8px';
        note.textContent = filename ? '(load error — see console)' : '(reference loaded; pick a model above)';
        panel.appendChild(note);
        return;
      }

      const { stats, animations } = data;
      const ref = referenceStats;

      // Convention + landmarks
      const conv = document.createElement('div'); conv.innerHTML = '<h2>Rig convention</h2>';
      const cBadge = document.createElement('span'); cBadge.className = `badge ${stats.convention}`; cBadge.textContent = stats.convention;
      conv.appendChild(cBadge);
      if (ref) {
        const rBadge = document.createElement('span'); rBadge.className = `badge ${ref.convention}`; rBadge.textContent = `ref: ${ref.convention}`;
        conv.appendChild(rBadge);
      }
      panel.appendChild(conv);

      // Stats grid
      const sect = document.createElement('div'); sect.innerHTML = '<h2>Stats vs reference</h2>';
      panel.appendChild(sect);
      const grid = document.createElement('div');
      function statRow(label, val, refVal, fmt = v => v) {
        const r = document.createElement('div'); r.className = 'stat';
        const diff = ref && refVal != null && val !== refVal;
        r.innerHTML = `<span class="k">${label}</span><span class="v${diff ? ' diff' : ''}">${fmt(val)}</span><span class="ref">${ref ? fmt(refVal) : '—'}</span>`;
        grid.appendChild(r);
      }
      // header
      const hdr = document.createElement('div'); hdr.className = 'stat';
      hdr.innerHTML = '<span class="k">metric</span><span class="v">current</span><span class="ref">reference</span>';
      grid.appendChild(hdr);
      statRow('bones',          stats.boneCount,  ref?.boneCount);
      statRow('max depth',      stats.maxDepth,   ref?.maxDepth);
      statRow('meshes',         stats.meshCount,  ref?.meshCount);
      statRow('skinned meshes', stats.skinnedCount, ref?.skinnedCount);
      statRow('verts',          stats.verts,      ref?.verts);
      statRow('tris',           stats.tris,       ref?.tris);
      statRow('bbox X',         stats.bbox.x.toFixed(1), ref?.bbox.x.toFixed(1));
      statRow('bbox Y',         stats.bbox.y.toFixed(1), ref?.bbox.y.toFixed(1));
      statRow('bbox Z',         stats.bbox.z.toFixed(1), ref?.bbox.z.toFixed(1));
      statRow('materials',      stats.materials.length, ref?.materials.length);
      panel.appendChild(grid);

      // Landmarks
      const lmHdr = document.createElement('div'); lmHdr.innerHTML = '<h2>Landmark mapping</h2>';
      panel.appendChild(lmHdr);
      const lmHdrLine = document.createElement('div'); lmHdrLine.className = 'stat';
      lmHdrLine.innerHTML = '<span class="k">landmark</span><span class="v">current</span><span class="ref">reference</span>';
      panel.appendChild(lmHdrLine);
      for (const key of Object.keys(LANDMARKS)) {
        const r = document.createElement('div'); r.className = 'stat';
        const cur = stats.landmarks[key];
        const refName = ref ? ref.landmarks[key] : null;
        const missing = !cur;
        r.innerHTML = `<span class="k">${key}</span><span class="v ${missing ? 'diff' : ''}">${cur || '—'}</span><span class="ref">${refName || '—'}</span>`;
        panel.appendChild(r);
      }

      // Animations
      const animHdr = document.createElement('div'); animHdr.innerHTML = '<h2>Animations</h2>';
      panel.appendChild(animHdr);
      if (animations.length === 0) {
        const p = document.createElement('div'); p.style.color = '#888'; p.style.fontSize = '11px';
        p.textContent = '(none baked in file)';
        panel.appendChild(p);
      } else {
        const pre = document.createElement('pre');
        pre.textContent = animations.map(a => `${a.name}  dur=${a.duration.toFixed(2)}s  tracks=${a.tracks.length}`).join('\n');
        panel.appendChild(pre);
      }

      // Bone tree
      const treeHdr = document.createElement('div'); treeHdr.innerHTML = '<h2>Bone hierarchy</h2>';
      panel.appendChild(treeHdr);
      const treeBox = document.createElement('div'); treeBox.id = 'treeBox';
      const tree = document.createElement('div'); tree.className = 'tree';
      // pick root bones (no bone parent)
      const roots = stats.bones.filter(b => !b.parent || !b.parent.isBone);
      const refLandmarkSet = new Set(ref ? Object.values(ref.landmarks).filter(Boolean) : []);
      const currentLandmarkSet = new Set(Object.values(stats.landmarks).filter(Boolean));
      function renderTree(bone, depth) {
        const indent = '  '.repeat(depth);
        const isLM = currentLandmarkSet.has(bone.name);
        const line = document.createElement('div');
        line.className = isLM ? 'match' : '';
        line.textContent = indent + bone.name + (isLM ? '  ◆' : '');
        tree.appendChild(line);
        for (const c of bone.children) if (c.isBone) renderTree(c, depth + 1);
      }
      for (const r of roots) renderTree(r, 0);
      treeBox.appendChild(tree);
      panel.appendChild(treeBox);

      // Mesh list with per-mesh visibility toggle
      const meshHdr = document.createElement('div');
      meshHdr.innerHTML = `<h2>Meshes (${stats.meshes.length})</h2>`;
      panel.appendChild(meshHdr);
      if (stats.meshes.length === 0) {
        const p = document.createElement('div'); p.style.color = '#888'; p.style.fontSize = '11px';
        p.textContent = '(no meshes)';
        panel.appendChild(p);
      } else {
        // Show/hide all
        const allRow = document.createElement('div');
        allRow.style.display = 'flex'; allRow.style.gap = '4px'; allRow.style.marginBottom = '4px';
        const allOn = document.createElement('button'); allOn.textContent = '👁 Show all';
        allOn.onclick = () => { stats.meshes.forEach(m => m.visible = true); rebuildMeshList(); allOn.blur(); };
        const allOff = document.createElement('button'); allOff.textContent = '🚫 Hide all';
        allOff.onclick = () => { stats.meshes.forEach(m => m.visible = false); rebuildMeshList(); allOff.blur(); };
        allRow.appendChild(allOn); allRow.appendChild(allOff);
        panel.appendChild(allRow);

        const listBox = document.createElement('div');
        listBox.style.maxHeight = '380px'; listBox.style.overflowY = 'auto';
        panel.appendChild(listBox);

        function rebuildMeshList() {
          listBox.innerHTML = '';
          stats.meshes.forEach((m, i) => {
            const ms = meshStats(m);
            const row = document.createElement('div');
            row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '6px';
            row.style.padding = '3px 4px'; row.style.fontSize = '10.5px';
            row.style.fontFamily = 'monospace'; row.style.borderBottom = '1px solid #2a2a30';
            row.style.background = m.visible ? '#1c2018' : '#2a1a1a';

            const btn = document.createElement('button');
            btn.textContent = m.visible ? '👁' : '🚫';
            btn.style.padding = '1px 6px'; btn.style.minWidth = '28px';
            btn.style.background = m.visible ? '#363' : '#633';
            btn.style.borderColor = m.visible ? '#5a5' : '#a55';
            btn.onclick = () => { m.visible = !m.visible; rebuildMeshList(); btn.blur(); };

            const name = document.createElement('span');
            name.textContent = m.name || `(unnamed_${i})`;
            name.style.flex = '1'; name.style.color = m.visible ? '#fea' : '#988';
            name.style.overflow = 'hidden'; name.style.textOverflow = 'ellipsis'; name.style.whiteSpace = 'nowrap';

            const info = document.createElement('span');
            info.style.color = '#779'; info.style.fontSize = '9.5px';
            info.textContent = `${ms.skinned ? '⛓' : ' '} v${ms.v} t${ms.t}`;
            info.title = `mat: ${ms.matNames || '—'}`;

            row.appendChild(btn); row.appendChild(name); row.appendChild(info);
            listBox.appendChild(row);
          });
        }
        rebuildMeshList();
      }
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    loadReference();
    selectModel('lara_mixamo.glb').then(() => {
      animState.selected = 'harley_quinn_hip_hop_dancing.glb';
      loadAnimSource('harley_quinn_hip_hop_dancing.glb');
    });

    // ── Render loop ──────────────────────────────────────────────────────────
    (function tick() {
      const dt = animClock.getDelta();
      if (animState.mixer) animState.mixer.update(dt);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
