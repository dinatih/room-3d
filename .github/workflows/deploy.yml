name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_STUDIO_LAT: ${{ secrets.VITE_STUDIO_LAT }}
          VITE_STUDIO_LNG: ${{ secrets.VITE_STUDIO_LNG }}
          VITE_STUDIO_ALT: ${{ secrets.VITE_STUDIO_ALT }}
          VITE_STUDIO_AZ: ${{ secrets.VITE_STUDIO_AZ }}

      - name: Copy media into dist
        run: cp -r media dist/media

      - name: Add CNAME and nojekyll
        run: |
          cp CNAME dist/CNAME
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          cname: dinatih.org
