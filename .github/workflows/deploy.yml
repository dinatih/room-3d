name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_COMMIT_HASH: ${{ github.sha }}

      - name: Add CNAME and nojekyll
        run: |
          cp CNAME dist/CNAME
          touch dist/.nojekyll

      - name: Preserve visualizer from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git archive origin/gh-pages visualizer >/dev/null 2>&1; then
            git archive origin/gh-pages visualizer | tar -x -C dist/
          fi

      - name: Prune non-production assets
        run: |
          find dist -type f \( -name "*.blend*" -o -name "*.obj" \) -delete
          rm -f dist/environment/AdobeStock_585513182.jpg

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: false
          cname: dinatih.org
