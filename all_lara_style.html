<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>All Lara Croft Styles - Comparison View</title>
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
  <style>
    .font-loader { font-family: 'Graduate'; position: absolute; visibility: hidden; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #151518; color: #e0e0e8; }
    #view { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 10px; left: 10px; 
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 13px; line-height: 1.5;
      pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      max-width: 450px;
    }
    .red { color: #ff4444; font-weight: bold; }
    #mesh-control {
      position: absolute; top: 10px; right: 10px; 
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 11px; max-height: 90vh;
      overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; width: 220px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    #mesh-control h4 { margin: 0 0 10px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 5px; font-size: 13px; }
    .mesh-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; cursor: pointer; }
    .mesh-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .mesh-item input { cursor: pointer; }

    #anim-control {
      position: absolute; top: 180px; left: 10px; 
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 12px; max-height: calc(100vh - 210px);
       overflow-y: auto; overflow-x: hidden; border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; width: 230px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
    }
    #anim-control h4 { margin: 0 0 12px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; font-size: 14px; }
    .anim-item { 
      display: block; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; border-radius: 6px; 
      border: 1px solid rgba(255,255,255,0.03); background: rgba(255,255,255,0.01); 
      transition: background 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  padding-left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .anim-item:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); padding-left: 16px; }
    .anim-item.active { 
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.25) 0%, rgba(255, 68, 68, 0.1) 100%); 
      border-color: rgba(255, 68, 68, 0.5); color: #ff6666; font-weight: bold; 
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.15);
    }
    .anim-btn {
      flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.15); 
      background: rgba(255,255,255,0.05); color: #eee; border-radius: 6px; 
      cursor: pointer; font-weight: 600; font-size: 11px;
      transition: all 0.2s ease;
    }
    .anim-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .anim-btn-primary {
      border: 1px solid rgba(255, 68, 68, 0.4);
      background: rgba(255, 68, 68, 0.15);
      color: #ff6666;
    }
    .anim-btn-primary:hover {
      background: rgba(255, 68, 68, 0.25);
      border-color: rgba(255, 68, 68, 0.6);
      color: #ff8888;
    }
    
    /* Collapsible Panels */
    .control-panel {
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s ease;
    }
    .control-panel.collapsed {
      max-height: 40px !important;
      padding-top: 10px !important;
      padding-bottom: 0 !important;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      margin: 0 !important;
      padding-bottom: 5px;
    }
    .panel-toggle-btn {
      color: #ff6666;
      font-size: 10px;
      transition: transform 0.35s ease;
      transform: rotate(0deg);
      display: inline-block;
      line-height: 1;
    }
    .control-panel.collapsed .panel-toggle-btn {
      transform: rotate(-180deg);
    }
  </style>
</head>
<body>
  <div class="font-loader">BULLS 66</div>
  <div id="view"></div>
  <div id="hud">
    <h3>Lara Croft <span class="red">Style Comparison</span></h3>
    <p>Comparing 15 variations side-by-side. Pan horizontally using the mouse.</p>
    <p id="loading-status">Loading models...</p>
  </div>
  <div id="mesh-control" class="control-panel">
    <h4 class="panel-header" onclick="togglePanel('mesh-control')">
      <span>Meshes Visibility</span>
      <span class="panel-toggle-btn">▼</span>
    </h4>
    <div id="mesh-list"></div>
  </div>
  <div id="anim-control" class="control-panel">
    <h4 class="panel-header" onclick="togglePanel('anim-control')">
      <span>Animations</span>
      <span class="panel-toggle-btn">▼</span>
    </h4>
    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
      <button id="btn-play-pause" class="anim-btn anim-btn-primary">Pause</button>
      <button id="btn-stop" class="anim-btn">Stop</button>
    </div>
    <div style="margin-bottom: 12px; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 500;">
        <span>Vitesse:</span>
        <span id="speed-val" style="color: #ff6666; font-weight: bold;">1.0x</span>
      </div>
      <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="1.0" style="width: 100%; cursor: pointer; accent-color: #ff4444; margin: 0; display: block;">
    </div>
    <div id="anim-list" style="overflow-y: auto; flex: 1;"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    window.togglePanel = function(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('collapsed');
    };

    const viewEl = document.getElementById('view');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(0, 180, 1200);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 100, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun1 = new THREE.DirectionalLight(0xffffff, 1.5);
    sun1.position.set(200, 400, 300);
    scene.add(sun1);

    const sun2 = new THREE.DirectionalLight(0xffffff, 0.5);
    sun2.position.set(-200, 400, -300);
    scene.add(sun2);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    const meshListEl = document.getElementById('mesh-list');
    const meshVisibility = new Map(); // name -> boolean
    const allModels = [];
    window.allModels = allModels;

    function getCleanName(name) {
      if (!name) return "Unnamed";
      let clean = name;
      if (clean.includes('|')) clean = clean.split('|').pop();
      clean = clean.replace(/^[0-9_+ -]+/, ''); 
      clean = clean.replace(/_[0-9._]+$/, '');  
      return clean || name;
    }

    function updateMeshListUI() {
      const sortedEntries = Array.from(meshVisibility.entries()).sort((a, b) => a[1].label.localeCompare(b[1].label));
      meshListEl.innerHTML = '';
      sortedEntries.forEach(([key, info]) => {
        const div = document.createElement('div');
        div.className = 'mesh-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = info.visible;
        checkbox.onchange = (e) => {
          info.visible = e.target.checked;
          applyMeshVisibility(key, e.target.checked);
        };
        const label = document.createElement('span');
        label.textContent = info.label;
        label.title = key; 
        label.style.opacity = info.visible ? '1' : '0.5';
        div.onclick = () => checkbox.click();
        checkbox.onclick = (e) => e.stopPropagation();
        div.appendChild(checkbox);
        div.appendChild(label);
        meshListEl.appendChild(div);
      });
    }

    function applyMeshVisibility(meshName, visible) {
      allModels.forEach(model => {
        model.traverse(node => {
          if (node.isMesh && node.name === meshName) {
            node.visible = visible;
          }
        });
      });
    }

    function createNameLabel(text, color = '#ffffff') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(18,18,24,0.85)';
      if (ctx.roundRect) ctx.roundRect(0, 0, 512, 128, 20);
      else ctx.rect(0, 0, 512, 128);
      ctx.fill();
      ctx.font = 'bold 50px system-ui';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);
      
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(120, 30, 1);
      return sprite;
    }

    // Bone mapping dictionary between Mixamo and Lara 2026 Native
    const BONE_SYNONYMS = {
      'Hips': ['hips', 'pelvis', 'cog', 'roothips', 'rootground'],
      'Spine': ['spine01', 'spinelower', 'spine0', 'spine1', 'spine'],
      'Spine2': ['spine02', 'spineupper', 'spine2', 'spine03', 'spine'],
      'Neck': ['neck', 'headnecklower'],
      'Head': ['head', 'headneckupper'],
      'LeftShoulder': ['leftshoulder', 'shoulderl', 'claviclel', 'armleftshoulder', 'larmclavicle'],
      'LeftArm': ['armleftshoulder2', 'upperarml', 'larmhumerus', 'upperarm.l', 'upper_arm.l', 'leftarm', 'armleftelbow', 'arm.l'],
      'LeftForeArm': ['lowerarml', 'larmradius', 'forearm.l', 'forearm_l', 'leftforearm', 'armleftelbow', 'armleftwrist'],
      'LeftHand': ['handl', 'larmwrist', 'hand.l', 'hand_l', 'wrist.l', 'wrist_l', 'lefthand', 'armleftwrist'],
      'RightShoulder': ['rightshoulder', 'shoulderr', 'clavicler', 'armrightshoulder', 'rarmclavicle'],
      'RightArm': ['rightarm', 'armrightshoulder2', 'upperarmr', 'armrightelbow', 'rarmhumerus', 'upperarm.r', 'upper_arm.r', 'arm.r'],
      'RightForeArm': ['lowerarmr', 'rarmradius', 'forearm.r', 'forearm_r', 'rightforearm', 'armrightelbow', 'armrightwrist'],
      'RightHand': ['handr', 'rarmwrist', 'hand.r', 'hand_r', 'wrist.r', 'wrist_r', 'righthand', 'armrightwrist'],
      'LeftUpLeg': ['legleftthigh', 'thighl', 'llegfemur', 'thigh.l', 'thigh_l', 'leftupleg'],
      'LeftLeg': ['legleftknee', 'calfl', 'shinl', 'llegtibia', 'shin.l', 'shin_l', 'calf.l', 'calf_l', 'leftleg'],
      'LeftFoot': ['legleftankle', 'footl', 'llegankle', 'foot.l', 'foot_l', 'ankle.l', 'ankle_l', 'leftfoot'],
      'LeftToeBase': ['leglefttoes', 'balll', 'toel', 'llegball', 'toe.l', 'toe_l', 'ball.l', 'ball_l', 'lefttoebase'],
      'RightUpLeg': ['legrightthigh', 'thighr', 'rlegfemur', 'thigh.r', 'thigh_r', 'rightupleg'],
      'RightLeg': ['legrightknee', 'calfr', 'shinr', 'rlegtibia', 'shin.r', 'shin_r', 'calf.r', 'calf_r', 'rightleg'],
      'RightFoot': ['legrightankle', 'footr', 'rlegankle', 'foot.r', 'foot_r', 'ankle.r', 'ankle_r', 'rightfoot'],
      'RightToeBase': ['legrighttoes', 'ballr', 'toer', 'rlegball', 'toe.r', 'toe_r', 'ball.r', 'ball_r', 'righttoebase']
    };

    function resolveTargetFingerBoneName(targetInstance, side, type, segment) {
      const sideChar = side.charAt(0).toLowerCase();
      const segmentIndex = parseInt(segment) - 1;
      const segmentLetter = ['a', 'b', 'c'][segmentIndex] || 'a';
      
      const candidates = [
        new RegExp(`arm.*${side}.*finger.*${type === 'thumb' ? 1 : type === 'index' ? 2 : type === 'middle' ? 3 : type === 'ring' ? 4 : 5}${segmentLetter}`, 'i'),
        new RegExp(`${type}_0${segment}_${sideChar}`, 'i'),
        new RegExp(`${type === 'thumb' ? 'thumb' : 'f_' + type}\\.0${segment}\\.${sideChar}`, 'i'),
        new RegExp(`${sideChar}.*hand.*${type}.*${segmentIndex}`, 'i'),
        new RegExp(`mixamorig.*${side}.*hand.*${type}.*${segment}`, 'i'),
        new RegExp(`mixamorig_${side}_hand_${type}_${segment}`, 'i'),
        new RegExp(`${side}_hand_${type}_${segment}`, 'i')
      ];

      let foundName = null;
      targetInstance.traverse(node => {
        if (node.isBone && !foundName) {
          for (const rx of candidates) {
            if (rx.test(node.name)) {
              foundName = node.name;
              break;
            }
          }
        }
      });
      return foundName;
    }

    function resolveTargetBoneName(targetInstance, baseName) {
      const fingerMatch = baseName.match(/Hand(Thumb|Index|Middle|Ring|Pinky)(\d)/i);
      if (fingerMatch) {
        const side = baseName.toLowerCase().includes('left') ? 'left' : 'right';
        const type = fingerMatch[1].toLowerCase();
        const segment = fingerMatch[2];
        const resolvedFinger = resolveTargetFingerBoneName(targetInstance, side, type, segment);
        if (resolvedFinger) return resolvedFinger;
      }

      const synonyms = BONE_SYNONYMS[baseName];
      if (synonyms) {
        for (const syn of synonyms) {
          let foundName = null;
          targetInstance.traverse(node => {
            if (node.isBone && !foundName) {
              const nameNormalized = node.name.toLowerCase().replace(/[:_ .\-]/g, '');
              if (nameNormalized === syn || nameNormalized.includes(syn)) {
                if (!nameNormalized.includes('twist') && !nameNormalized.includes('muscle') && !nameNormalized.includes('offset')) {
                  foundName = node.name;
                }
              }
            }
          });
          if (foundName) return foundName;
        }
      }

      const candidates = [
        'mixamorig:' + baseName,
        'mixamorig_' + baseName,
        'mixamorig' + baseName,
        baseName,
        'mixamorig:' + baseName.charAt(0).toLowerCase() + baseName.slice(1),
        'mixamorig_' + baseName.charAt(0).toLowerCase() + baseName.slice(1),
        'mixamorig' + baseName.charAt(0).toLowerCase() + baseName.slice(1),
        baseName.charAt(0).toLowerCase() + baseName.slice(1)
      ];

      for (const cand of candidates) {
        if (targetInstance.getObjectByName(cand)) {
          return cand;
        }
      }
      return null;
    }

    function retargetMixamoClip(rawClip, targetInstance, animScene) {
      if (!rawClip || !targetInstance) return null;

      const animBones = {};
      if (animScene) {
        animScene.updateMatrixWorld(true);
        animScene.traverse(c => {
          if (c.isBone) {
            const match = c.name.match(/mixamorig[:_]?(.+)/i);
            if (match) {
              animBones[match[1]] = {
                restWorldQuaternion: c.getWorldQuaternion(new THREE.Quaternion()),
                restLocalQuaternion: c.quaternion.clone(),
                parentRestWorldQuaternion: c.parent ? c.parent.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion(),
                defaultPosition: c.position.clone()
              };
            }
          }
        });
      }

      const clonedTracks = [];
      for (const track of rawClip.tracks) {
        const cl = track.clone();
        cl.times = new Float32Array(track.times);
        cl.values = new Float32Array(track.values);
        clonedTracks.push(cl);
      }
      const workingClip = new THREE.AnimationClip(rawClip.name, rawClip.duration, clonedTracks);

      for (const track of workingClip.tracks) {
        if (track.name.endsWith('.position')) {
          const firstVal = new THREE.Vector3(track.values[0], track.values[1], track.values[2]);
          if (firstVal.length() > 5.0) {
            for (let i = 0; i < track.values.length; i++) {
              track.values[i] *= 0.01;
            }
          }
        }
      }

      const rootRotTrackIndex = workingClip.tracks.findIndex(t => t.name.toLowerCase().includes('rootjoint') && t.name.endsWith('.quaternion'));
      const hipsRotTrackIndex = workingClip.tracks.findIndex(t => (t.name.toLowerCase().includes('hips') || t.name.toLowerCase().endsWith('hips.quaternion')) && t.name.endsWith('.quaternion') && !t.name.toLowerCase().includes('rootjoint'));

      if (rootRotTrackIndex !== -1) {
        const rootRotTrack = workingClip.tracks[rootRotTrackIndex];
        if (hipsRotTrackIndex !== -1) {
          const hipsRotTrack = workingClip.tracks[hipsRotTrackIndex];
          const timesSet = new Set([...rootRotTrack.times, ...hipsRotTrack.times]);
          const times = Array.from(timesSet).sort((a, b) => a - b);
          
          const values = new Float32Array(times.length * 4);
          
          function evaluateQuaternionTrack(track, t) {
            const trackTimes = track.times;
            const trackValues = track.values;
            if (t <= trackTimes[0]) {
              return new THREE.Quaternion(trackValues[0], trackValues[1], trackValues[2], trackValues[3]);
            }
            if (t >= trackTimes[trackTimes.length - 1]) {
              const idx = (trackTimes.length - 1) * 4;
              return new THREE.Quaternion(trackValues[idx], trackValues[idx+1], trackValues[idx+2], trackValues[idx+3]);
            }
            let i = 0;
            while (i < trackTimes.length - 1 && trackTimes[i+1] < t) {
              i++;
            }
            const t0 = trackTimes[i];
            const t1 = trackTimes[i+1];
            const alpha = (t - t0) / (t1 - t0);
            
            const q0 = new THREE.Quaternion(trackValues[4*i], trackValues[4*i+1], trackValues[4*i+2], trackValues[4*i+3]);
            const q1 = new THREE.Quaternion(trackValues[4*(i+1)], trackValues[4*(i+1)+1], trackValues[4*(i+1)+2], trackValues[4*(i+1)+3]);
            return q0.slerp(q1, alpha);
          }

          for (let i = 0; i < times.length; i++) {
            const t = times[i];
            const qRoot = evaluateQuaternionTrack(rootRotTrack, t);
            const qHips = evaluateQuaternionTrack(hipsRotTrack, t);
            const qCombined = qRoot.multiply(qHips);
            
            values[4*i] = qCombined.x;
            values[4*i+1] = qCombined.y;
            values[4*i+2] = qCombined.z;
            values[4*i+3] = qCombined.w;
          }
          
          hipsRotTrack.times = new Float32Array(times);
          hipsRotTrack.values = values;
          workingClip.tracks.splice(rootRotTrackIndex, 1);
        } else {
          const hipsPosTrack = workingClip.tracks.find(t => t.name.toLowerCase().includes('hips') && !t.name.toLowerCase().includes('rootjoint'));
          let hipsName = 'mixamorig:Hips.quaternion';
          if (hipsPosTrack) {
            hipsName = hipsPosTrack.name.split('.')[0] + '.quaternion';
          }
          rootRotTrack.name = hipsName;
        }
      }

      let srcHipsDefaultY = 0.991;
      let computedHipsRatio = 1.0; 
      
      const hipsBone = targetInstance.getObjectByName(resolveTargetBoneName(targetInstance, 'Hips'));
      
      for (const tr of workingClip.tracks) {
        const [boneFull, prop] = tr.name.split('.');
        const match = boneFull.match(/mixamorig[:_]?(.+)/i);
        if (match) {
          const baseName = match[1];
          if (prop === 'position' && baseName.toLowerCase() === 'hips') {
            let refSrcY = 0.991;
            if (animBones[baseName]) {
              refSrcY = animBones[baseName].defaultPosition.y;
            }
            if (refSrcY > 5.0) {
              refSrcY *= 0.01;
            }
            srcHipsDefaultY = refSrcY;
            
            let targetHipsHeight = 0.991;
            if (hipsBone && hipsBone.defaultPosition) {
              const isLaraNative = targetInstance.getObjectByName('mixamorig_root_hips') !== undefined;
              targetHipsHeight = isLaraNative ? hipsBone.defaultPosition.z : hipsBone.defaultPosition.y;
            }
            
            if (refSrcY > 0) {
              computedHipsRatio = targetHipsHeight / refSrcY;
            }
          }
        }
      }

      const hasRootTranslation = workingClip.tracks.some(t => t.name.toLowerCase().includes('rootjoint') && t.name.endsWith('.position'));
      const tracks = [];

      for (const tr of workingClip.tracks) {
        const [boneFull, prop] = tr.name.split('.');
        const match = boneFull.match(/mixamorig[:_]?(.+)/i);
        if (!match) continue;
        let baseName = match[1];

        if (prop === 'position' && baseName.toLowerCase() === 'hips' && hasRootTranslation) {
          continue;
        }

        let isRootJointTranslation = false;
        if (prop === 'position' && baseName.toLowerCase().includes('rootjoint')) {
          baseName = 'Hips';
          isRootJointTranslation = true;
        }

        const targetBoneName = resolveTargetBoneName(targetInstance, baseName);
        if (targetBoneName) {
          if (prop === 'scale') continue;

          const isHips = targetBoneName.toLowerCase().endsWith('hips');
          if (prop === 'position' && !isHips) continue;

          const clone = tr.clone();
          clone.name = `${targetBoneName}.${prop}`;

          if (prop === 'position' && isHips) {
            const bone = targetInstance.getObjectByName(targetBoneName);
            if (bone && bone.defaultPosition) {
              let P_src = null;
              if (isRootJointTranslation) {
                P_src = new THREE.Quaternion();
              } else if (animBones[baseName]) {
                P_src = animBones[baseName].parentRestWorldQuaternion;
              } else {
                P_src = new THREE.Quaternion();
              }
              const P_tgt = (bone.parent && bone.parent.restWorldQuaternion)
                ? bone.parent.restWorldQuaternion
                : new THREE.Quaternion();
              const P_tgt_inv = P_tgt.clone().invert();
              
              let srcRestPos = null;
              if (isRootJointTranslation) {
                srcRestPos = new THREE.Vector3(0, 0, 0);
              } else if (animBones[baseName]) {
                srcRestPos = animBones[baseName].defaultPosition.clone();
                if (srcRestPos.length() > 5.0) {
                  srcRestPos.multiplyScalar(0.01);
                }
              } else {
                srcRestPos = new THREE.Vector3(0, srcHipsDefaultY, 0);
              }

              const animNameLower = (rawClip.name || "").toLowerCase();
              const isWalk = (animNameLower.includes('walk') || 
                              animNameLower.includes('run') || 
                              animNameLower.includes('step') || 
                              animNameLower.includes('stairs')) &&
                             !animNameLower.includes('dance');

              if (isWalk) {
                for (let j = 0; j < clone.values.length / 3; j++) {
                  let yVal = clone.values[3*j+1];
                  const dx = (clone.values[3*j] - srcRestPos.x) * computedHipsRatio;
                  const dy = 0.0; // walking in-place
                  const dz = (clone.values[3*j+2] - srcRestPos.z) * computedHipsRatio;
                  
                  const dP = new THREE.Vector3(dx, dy, dz)
                    .applyQuaternion(P_src)
                    .applyQuaternion(P_tgt_inv);
                  const resPos = bone.defaultPosition.clone().add(dP);
                  
                  clone.values[3*j] = resPos.x;
                  clone.values[3*j+1] = resPos.y;
                  clone.values[3*j+2] = resPos.z;
                }
              } else {
                for (let j = 0; j < clone.values.length / 3; j++) {
                  let yVal = clone.values[3*j+1];
                  if (isRootJointTranslation && (animNameLower.includes('laying') || animNameLower.includes('sleeping'))) {
                    yVal = 0.12; 
                  }
                  const dx = (clone.values[3*j] - srcRestPos.x) * computedHipsRatio;
                  const dy = (yVal - srcRestPos.y) * computedHipsRatio;
                  const dz = (clone.values[3*j+2] - srcRestPos.z) * computedHipsRatio;
                  
                  const dP = new THREE.Vector3(dx, dy, dz)
                    .applyQuaternion(P_src)
                    .applyQuaternion(P_tgt_inv);
                  const resPos = bone.defaultPosition.clone().add(dP);
                  
                  clone.values[3*j] = resPos.x;
                  clone.values[3*j+1] = resPos.y;
                  clone.values[3*j+2] = resPos.z;
                }
              }
            }
          }

          if (prop === 'quaternion') {
            const tgtLower = targetBoneName.toLowerCase();
            const isClavicle = tgtLower.includes('clavicle') || 
                               tgtLower.includes('shoulder_1') || 
                               tgtLower.includes('shoulder1') || 
                               (tgtLower.includes('shoulder') && 
                                !tgtLower.includes('shoulder_2') && 
                                !tgtLower.includes('shoulder2') && 
                                !tgtLower.includes('shoulder 2'));
            if (isClavicle) continue;

            const bone = targetInstance.getObjectByName(targetBoneName);
            if (bone) {
              if (bone.restLocalQuaternion && bone.restWorldQuaternion) {
                let B_src = null;
                let P_src = null;
                
                if (animBones[baseName]) {
                  const cached = animBones[baseName];
                  B_src = cached.restWorldQuaternion;
                  P_src = cached.parentRestWorldQuaternion;
                } else {
                  B_src = new THREE.Quaternion();
                  P_src = new THREE.Quaternion();
                }
                
                if (B_src && P_src) {
                  const B_tgt = bone.restWorldQuaternion;
                  const P_tgt = (bone.parent && bone.parent.restWorldQuaternion)
                    ? bone.parent.restWorldQuaternion
                    : new THREE.Quaternion();
                  
                  const P_tgt_inv = P_tgt.clone().invert();
                  const B_src_inv = B_src.clone().invert();

                  for (let i = 0; i < clone.values.length; i += 4) {
                    const srcLocalQ = new THREE.Quaternion(clone.values[i], clone.values[i+1], clone.values[i+2], clone.values[i+3]);
                    const animWorldQ = P_src.clone().multiply(srcLocalQ);
                    const deltaQ = animWorldQ.clone().multiply(B_src_inv);
                    const tgtAnimWorldQ = deltaQ.clone().multiply(B_tgt);
                    const tgtLocalQ = P_tgt_inv.clone().multiply(tgtAnimWorldQ).normalize();

                    clone.values[i] = tgtLocalQ.x;
                    clone.values[i+1] = tgtLocalQ.y;
                    clone.values[i+2] = tgtLocalQ.z;
                    clone.values[i+3] = tgtLocalQ.w;
                  }
                } else {
                  // Fallback
                  const parentRestWorldQ = (bone.parent && bone.parent.restWorldQuaternion)
                    ? bone.parent.restWorldQuaternion
                    : new THREE.Quaternion();
                  const parentInv = parentRestWorldQ.clone().invert();
                  const boneRestLocalQ = bone.restLocalQuaternion.clone();

                  for (let i = 0; i < clone.values.length; i += 4) {
                    const q = new THREE.Quaternion(clone.values[i], clone.values[i+1], clone.values[i+2], clone.values[i+3]);
                    const resQ = parentInv.clone()
                      .multiply(q)
                      .multiply(parentRestWorldQ)
                      .multiply(boneRestLocalQ);

                    clone.values[i] = resQ.x;
                    clone.values[i+1] = resQ.y;
                    clone.values[i+2] = resQ.z;
                    clone.values[i+3] = resQ.w;
                  }
                }
              }
            }
          }

          tracks.push(clone);
        }
      }

      const trackSample = tracks.find(t => t.name.includes('LeftArm') || t.name.includes('arm_left_shoulder_2') || t.name.includes('upper_arm'));
      if (trackSample) {
        console.log(`[TrackSample] model="${targetInstance.name}" name="${trackSample.name}" valuesSample="${Array.from(trackSample.values.slice(0, 8)).map(n => n.toFixed(4)).join(', ')}"`);
      }
      console.log(`[Retarget] model="${targetInstance.name}" rawTracks=${workingClip.tracks.length} retargetedTracks=${tracks.length} sampleHips="${resolveTargetBoneName(targetInstance, 'Hips')}" sampleLeftArm="${resolveTargetBoneName(targetInstance, 'LeftArm')}"`);
      return new THREE.AnimationClip(`${workingClip.name}_retargeted`, workingClip.duration, tracks);
    }

    const ANIMATION_FILES = [
      "walking.glb",

    function formatName(fileName) {
      let name = fileName.replace('.glb', '');
      name = name.replace(/_/g, ' ');
      name = name.replace(/,/g, '');
      name = name.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
      return name;
    }

    let currentAnimFile = null;
    let rawAnimClip = null;
    let animScene = null;
    let isPaused = false;
    let playbackSpeed = 1.0;

    window.getCurrentAnimFile = () => currentAnimFile;
    window.getIsPaused = () => isPaused;
    window.getPlaybackSpeed = () => playbackSpeed;

    function playAnimationOnModel(model, clip) {
      if (!model.userData.mixer) {
        console.warn("Model has no mixer assigned:", model);
        return;
      }
      const mixer = model.userData.mixer;
      mixer.stopAllAction();
      const action = mixer.clipAction(clip);
      action.play();
    }

    function stopAllAnimations() {
      allModels.forEach(model => {
        if (model.userData.mixer) {
          model.userData.mixer.stopAllAction();
        }
      });
      currentAnimFile = null;
      rawAnimClip = null;
      animScene = null;
      
      const items = document.querySelectorAll('.anim-item');
      items.forEach(item => item.classList.remove('active'));
    }

    function loadAndPlayAnimation(file) {
      console.log("loadAndPlayAnimation called with:", file);
      currentAnimFile = file;
      
      const items = document.querySelectorAll('.anim-item');
      items.forEach(item => {
        if (item.dataset.file === file) {
          item.classList.add('active');
          item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          item.classList.remove('active');
        }
      });

      const hudP = document.querySelector('#hud p:last-child');
      const originalText = hudP.textContent;
      hudP.innerHTML = `Loading animation <span style="color:#ff4444">${formatName(file)}</span>...`;

      loader.load('media/glb-animations/' + file, (gltf) => {
        hudP.textContent = originalText;
        console.log("GLB animation loaded:", file, "Animations count:", gltf.animations ? gltf.animations.length : 0);
        if (gltf.animations && gltf.animations.length > 0) {
          rawAnimClip = gltf.animations[0];
          animScene = gltf.scene;
          
          allModels.forEach(model => {
            if (!model.userData.retargetedClips) {
              model.userData.retargetedClips = {};
            }
            const retargeted = retargetMixamoClip(rawAnimClip, model, animScene);
            if (retargeted) {
              model.userData.retargetedClips[file] = retargeted;
              playAnimationOnModel(model, retargeted);
            }
          });
        }
      }, undefined, (err) => {
        console.error("Failed to load animation", file, err);
        hudP.textContent = `Error loading ${file}`;
      });
    }

    function createAnimListUI() {
      const animListEl = document.getElementById('anim-list');
      animListEl.innerHTML = '';
      
      ANIMATION_FILES.forEach(file => {
        const div = document.createElement('div');
        div.className = 'anim-item';
        div.dataset.file = file;
        div.textContent = formatName(file);
        div.onclick = () => {
          loadAndPlayAnimation(file);
        };
        animListEl.appendChild(div);
      });
    }

    const SPACING = 120;

    document.fonts.ready.then(() => {
      createAnimListUI();

      const btnPlayPause = document.getElementById('btn-play-pause');
      const btnStop = document.getElementById('btn-stop');
      const speedSlider = document.getElementById('speed-slider');
      const speedVal = document.getElementById('speed-val');

      btnPlayPause.onclick = () => {
        isPaused = !isPaused;
        btnPlayPause.textContent = isPaused ? 'Reprendre' : 'Pause';
        if (isPaused) {
          btnPlayPause.classList.remove('anim-btn-primary');
        } else {
          btnPlayPause.classList.add('anim-btn-primary');
        }
      };

      btnStop.onclick = () => {
        stopAllAnimations();
      };

      speedSlider.oninput = (e) => {
        playbackSpeed = parseFloat(e.target.value);
        speedVal.textContent = playbackSpeed.toFixed(1) + 'x';
      };

      const variants = [
        { id: 'lara_croft_324_rigged', label: 'Lara 324 Rigged', file: 'media/all_lara/lara_croft_324_rigged.glb', offset: -7, color: '#ff6600' },
        { id: 'lara_croft_4543', label: 'Lara 4543', file: 'media/all_lara/lara_croft_4543.glb', offset: -6, color: '#aa77ff' },
        { id: 'lara_croft_43254_rigged', label: 'Lara 43254 Rigged', file: 'media/all_lara/lara_croft_43254_rigged.glb', offset: -5, color: '#33bb66' },
        { id: 'lara_croft_brown_jacket', label: 'Brown Jacket', file: 'media/all_lara/lara_croft_brown_jacket.glb', offset: -4, color: '#d4a373' },
        { id: 'lara_croft_dress_345', label: 'Dress 345', file: 'media/all_lara/lara_croft_dress_345.glb', offset: -3, color: '#e07a5f' },
        { id: 'lara_croft_motorcycle_gear', label: 'Motorcycle Gear', file: 'media/all_lara/lara_croft_motorcycle_gear.glb', offset: -2, color: '#8d99ae' },
        { id: 'lara_croft_red_dress', label: 'Red Dress', file: 'media/all_lara/lara_croft_red_dress.glb', offset: 0, color: '#ff4d6d', hideHairMeshes: true },
        { id: 'lara_hair', label: 'Lara Hair', file: 'media/all_lara/lara_hair.glb', offset: 0, color: '#ffd166', noLabel: true, alignToModel: 'lara_croft_red_dress', skipNormalize: true },
        { id: 'lara_croft_spy_gear', label: 'Spy Gear', file: 'media/all_lara/lara_croft_spy_gear.glb', offset: 1, color: '#3d5a80' },
        { id: 'lara_croft_suit', label: 'Suit', file: 'media/all_lara/lara_croft_suit.glb', offset: 2, color: '#edf2f4' },
        { id: 'lara_croft_swim_gear', label: 'Swim Gear', file: 'media/all_lara/lara_croft_swim_gear.glb', offset: 3, color: '#00b4d8' },
        { id: 'lara_croft_swim_gear_1', label: 'Swim Gear 1', file: 'media/all_lara/lara_croft_swim_gear_1.glb', offset: 4, color: '#90e0ef' },
        { id: 'lara_croft_swim_gear_243', label: 'Swim Gear 243', file: 'media/all_lara/lara_croft_swim_gear_243.glb', offset: 5, color: '#0077b6' },
        { id: 'lara_croft_black_tank_top', label: 'Black Tank Top', file: 'media/all_lara/lara_croft_black_tank_top.glb', offset: 6, color: '#4a4a4a', fixOpaque: true },
        { id: 'lara_croft_4259', label: 'Lara 4259', file: 'media/all_lara/lara_croft_4259.glb', offset: 7, color: '#d2a23c', fixOpaque: true }
      ];

      // Track loaded models by id for post-load alignment
      const modelsMap = {};

      // Find the world-space Y of the head bone (ignoring face detail bones)
      function getHeadBoneWorldY(model) {
        model.updateMatrixWorld(true);
        const skipPat = /jaw|tongue|lip|eyelid|eyebrow|brow\.?[0-9]|lash|tooth|teeth|ear|cheek|chin/i;
        const headPat  = /mixamorig.*:head$|head neck upper|^head$/i;
        let best = null;
        model.traverse(c => {
          if (!c.isBone || best) return;
          if (skipPat.test(c.name)) return;
          if (headPat.test(c.name)) best = c;
        });
        if (!best) return null;
        const pos = new THREE.Vector3();
        best.getWorldPosition(pos);
        return pos.y;
      }

      // Scale Lara Hair to match target's proportions, then align head bones in Y
      function applyHairToTarget(hairModel, targetModel) {
        // 1. Copy target scale so hair skeleton has the same unit size
        const ts = targetModel.scale.x;
        hairModel.scale.setScalar(ts);
        hairModel.updateMatrixWorld(true);

        // 2. Ground the hair (lift so its lowest vertex is at Y=0)
        const box = new THREE.Box3().setFromObject(hairModel);
        hairModel.position.y = -box.min.y;
        hairModel.updateMatrixWorld(true);

        // 3. Match head bone world-Y
        const targetHeadY = getHeadBoneWorldY(targetModel);
        const hairHeadY   = getHeadBoneWorldY(hairModel);
        if (targetHeadY !== null && hairHeadY !== null) {
          hairModel.position.y += (targetHeadY - hairHeadY);
          hairModel.updateMatrixWorld(true);
          console.log(`[Lara Hair] scale=${ts.toFixed(3)}, head delta Y=${(targetHeadY - hairHeadY).toFixed(1)}`);
        }

        // 4. Same X as target (Red Dress)
        hairModel.position.x = targetModel.position.x;
        hairModel.updateMatrixWorld(true);
      }

      function normalizeHeight(model, targetHeight = 175) {
        model.scale.set(1, 1, 1);
        model.position.set(0, 0, 0);
        model.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        if (size.y > 0) {
          const factor = targetHeight / size.y;
          model.scale.setScalar(factor);
          
          model.updateMatrixWorld(true);
          const newBox = new THREE.Box3().setFromObject(model);
          model.position.y = -newBox.min.y;
          model.updateMatrixWorld(true);
          console.log(`Normalized model ${model.name} height to ${targetHeight}. Scale factor: ${factor}. Y-offset: ${model.position.y}`);
        }
      }

      let loadedCount = 0;

      variants.forEach(v => {
        loader.load(v.file, (gltf) => {
          const model = gltf.scene;
          model.name = v.label;
          
          model.updateMatrixWorld(true);
          model.traverse(c => {
            c.restWorldQuaternion = c.getWorldQuaternion(new THREE.Quaternion());
            if (c.isBone) {
              c.defaultPosition = c.position.clone();
              c.defaultRotation = c.rotation.clone();
              c.defaultScale = c.scale.clone();
              c.restLocalQuaternion = c.quaternion.clone();
            }
            
            if (c.isMesh) {
              if (!meshVisibility.has(c.name)) {
                const labelName = getCleanName(c.material ? c.material.name : c.name);
                meshVisibility.set(c.name, { label: labelName, visible: true });
                updateMeshListUI();
              }
              c.material = c.material.clone();
              // Fix transparent materials for models flagged with fixOpaque
              if (v.fixOpaque) {
                const mats = Array.isArray(c.material) ? c.material : [c.material];
                mats.forEach(m => {
                  m.transparent = false;
                  m.alphaTest = 0;
                  m.depthWrite = true;
                  m.needsUpdate = true;
                });
              }
              // Hide native hair meshes on Red Dress (replaced by Lara Hair overlay)
              if (v.hideHairMeshes) {
                const geoName = c.geometry?.name || '';
                const matName = (Array.isArray(c.material) ? c.material[0]?.name : c.material?.name) || '';
                if (/hair/i.test(geoName) || /hair/i.test(matName)) {
                  c.visible = false;
                  meshVisibility.set(c.name, { label: getCleanName(matName || geoName), visible: false });
                }
              }
            }
          });

          if (!v.skipNormalize) normalizeHeight(model, 175);

          const mixer = new THREE.AnimationMixer(model);
          model.userData.mixer = mixer;
          
          allModels.push(model);
          modelsMap[v.id] = model;
          const x = v.offset * SPACING;
          model.position.x = x;
          scene.add(model);

          // Align + scale Lara Hair to match Red Dress proportions
          if (v.alignToModel) {
            const target = modelsMap[v.alignToModel];
            if (target) applyHairToTarget(model, target);
          }
          // If Red Dress loads FIRST, re-trigger alignment on already-loaded hair
          if (v.id === 'lara_croft_red_dress' && modelsMap['lara_hair']) {
            applyHairToTarget(modelsMap['lara_hair'], model);
          }

          if (!v.noLabel) {
            const label = createNameLabel(v.label, v.color);
            label.position.set(x, 215, 0);
            scene.add(label);
          }

          loadedCount++;
          document.getElementById('loading-status').innerText = `Loaded ${loadedCount} / 15 models`;

          if (loadedCount === 15) {
            document.getElementById('loading-screen').style.display = 'none';
            loadAndPlayAnimation("happy_walk.glb");
          } else if (rawAnimClip && animScene) {
            const retargeted = retargetMixamoClip(rawAnimClip, model, animScene);
            if (retargeted) {
              if (!model.userData.retargetedClips) {
                model.userData.retargetedClips = {};
              }
              model.userData.retargetedClips[currentAnimFile] = retargeted;
              playAnimationOnModel(model, retargeted);
            }
          }
        }, undefined, (err) => {
          console.error("Failed to load model:", v.label, err);
          loadedCount++;
          document.getElementById('loading-status').innerText = `Error loading ${v.label} (${loadedCount}/15)`;
        });
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta() * playbackSpeed;
      if (!isPaused) {
        allModels.forEach(model => {
          if (model.userData.mixer) {
            model.userData.mixer.update(delta);
          }
        });
      }
      
      renderer.render(scene, camera);
    }
    animate();
  </script>
