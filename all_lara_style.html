<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>All Lara Croft Styles - Comparison View</title>
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
  <style>
    .font-loader { font-family: 'Graduate'; position: absolute; visibility: hidden; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #151518; color: #e0e0e8; }
    #view { width: 100vw; height: 100vh; }
    #left-sidebar {
      position: absolute;
      top: 10px;
      left: 10px;
      bottom: 10px;
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    #hud {
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 13px; line-height: 1.5;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      width: 100%;
      box-sizing: border-box;
      pointer-events: auto;
    }
    .red { color: #ff4444; font-weight: bold; }
    #mesh-control {
      position: absolute; top: 10px; right: 10px; 
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 11px; max-height: 90vh;
      overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; width: 220px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    #mesh-control h4 { margin: 0 0 10px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 5px; font-size: 13px; }
    .mesh-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; cursor: pointer; }
    .mesh-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .mesh-item input { cursor: pointer; }
 
    #anim-control {
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 12px;
      overflow-y: auto; overflow-x: hidden; border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
      width: 100%;
      box-sizing: border-box;
      pointer-events: auto;
      flex: 1;
      min-height: 0;
    }
    #anim-control h4 { margin: 0 0 12px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; font-size: 14px; }
    .anim-item { 
      display: block; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; border-radius: 6px; 
      border: 1px solid rgba(255,255,255,0.03); background: rgba(255,255,255,0.01); 
      transition: background 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  padding-left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .anim-item:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); padding-left: 16px; }
    .anim-item:focus-visible { 
      outline: none;
      color: #fff; 
      background: rgba(255,255,255,0.08); 
      border-color: #ff4444; 
      padding-left: 16px;
      box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.4);
    }
    .anim-item.active { 
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.25) 0%, rgba(255, 68, 68, 0.1) 100%); 
      border-color: rgba(255, 68, 68, 0.5); color: #ff6666; font-weight: bold; 
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.15);
    }
    .anim-btn {
      flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.15); 
      background: rgba(255,255,255,0.05); color: #eee; border-radius: 6px; 
      cursor: pointer; font-weight: 600; font-size: 11px;
      transition: all 0.2s ease;
    }
    .anim-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .anim-btn-primary {
      border: 1px solid rgba(255, 68, 68, 0.4);
      background: rgba(255, 68, 68, 0.15);
      color: #ff6666;
    }
    .anim-btn-primary:hover {
      background: rgba(255, 68, 68, 0.25);
      border-color: rgba(255, 68, 68, 0.6);
      color: #ff8888;
    }
    
    /* Collapsible Panels */
    .control-panel {
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s ease;
    }
    .control-panel.collapsed {
      max-height: 40px !important;
      padding-top: 10px !important;
      padding-bottom: 0 !important;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      margin: 0 !important;
      padding-bottom: 5px;
    }
    .panel-toggle-btn {
      color: #ff6666;
      font-size: 10px;
      transition: transform 0.35s ease;
      transform: rotate(0deg);
      display: inline-block;
      line-height: 1;
    }
    .control-panel.collapsed .panel-toggle-btn {
      transform: rotate(-180deg);
    }
    .hierarchy-node-clickable:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #fff !important;
    }
    .hierarchy-node-selected {
      background: rgba(255, 51, 102, 0.25) !important;
      border: 1px solid rgba(255, 51, 102, 0.5);
      color: #ff3366 !important;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="font-loader">BULLS 66</div>
  <div id="view"></div>
  <div id="left-sidebar">
    <div id="hud">
      <h3>Lara Croft <span class="red">Style Comparison</span></h3>
      <p>Comparing <span id="model-count-text">16</span> variations side-by-side. Pan horizontally using the mouse.</p>
      <p id="loading-status">Loading models...</p>
      <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; pointer-events: auto;">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 12px; user-select: none;">
          <input type="checkbox" id="toggle-skeletons" style="cursor: pointer; accent-color: #ff4444;">
          <span>Afficher les Squelettes</span>
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 12px; user-select: none;">
          <input type="checkbox" id="toggle-superposition" style="cursor: pointer; accent-color: #ff4444;">
          <span>Superposer les modèles (X = 0)</span>
        </label>
      </div>
    </div>

    <div id="anim-control" class="control-panel">
      <h4 class="panel-header" onclick="togglePanel('anim-control')">
        <span>Animations</span>
        <span class="panel-toggle-btn">▼</span>
      </h4>
      <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <button id="btn-play-pause" class="anim-btn anim-btn-primary">Pause</button>
        <button id="btn-stop" class="anim-btn">Stop</button>
      </div>
      <div style="margin-bottom: 12px; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 500;">
          <span>Vitesse:</span>
          <span id="speed-val" style="color: #ff6666; font-weight: bold;">1.0x</span>
        </div>
        <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="1.0" style="width: 100%; cursor: pointer; accent-color: #ff4444; margin: 0; display: block;">
      </div>
      <div id="anim-list" style="overflow-y: auto; flex: 1;"></div>
    </div>
  </div>

  <div id="joint-3d-label" style="position: absolute; display: none; background: rgba(255, 51, 102, 0.9); color: white; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; font-weight: bold; pointer-events: none; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transform: translate(-50%, -100%); margin-top: -10px; white-space: nowrap; border: 1px solid rgba(255, 255, 255, 0.25);"></div>

  <div id="hierarchy-tooltip" style="position: fixed; display: none; background: rgba(18, 18, 24, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 20px 15px 15px 15px; font-size: 11px; max-height: calc(100vh - 40px); overflow-y: auto; pointer-events: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 99999; color: #ddd; width: 320px; right: 20px; top: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; margin-bottom: 10px;">
      <span style="font-weight: bold; color: #fff; font-size: 13px;" id="tooltip-model-name">Model Name</span>
      <span style="cursor: pointer; color: #ff6666; font-size: 18px; font-weight: bold; padding: 0 4px; user-select: none; line-height: 1;" onclick="hideTooltip()">&times;</span>
    </div>
    
    <!-- Navigation par Onglets -->
    <div style="display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">
      <button id="tab-joints" class="anim-btn anim-btn-primary" style="padding: 6px 12px; font-size: 10px; flex: 1;" onclick="switchTooltipTab('joints')">🦴 Squelette (Joints)</button>
      <button id="tab-meshes" class="anim-btn" style="padding: 6px 12px; font-size: 10px; flex: 1;" onclick="switchTooltipTab('meshes')">👗 Meshes</button>
    </div>

    <!-- Conteneur Joints -->
    <div id="tooltip-joints-container">
      <div id="tooltip-joints-stats" style="font-size: 10px; color: #ff4d6d; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px;"></div>
      <div id="tooltip-joints-content" style="max-height: calc(100vh - 180px); overflow-y: auto; padding-right: 5px;"></div>
    </div>
    
    <!-- Conteneur Meshes -->
    <div id="tooltip-meshes-container" style="display: none;">
      <div id="tooltip-meshes-stats" style="font-size: 10px; color: #51cf66; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px;"></div>
      <div id="tooltip-meshes-content" style="max-height: calc(100vh - 180px); overflow-y: auto; padding-right: 5px;"></div>
    </div>
  </div>
  <div id="mesh-control" class="control-panel collapsed">
    <h4 class="panel-header" onclick="togglePanel('mesh-control')">
      <span>Meshes Visibility</span>
      <span class="panel-toggle-btn">▼</span>
    </h4>
    <div id="mesh-list"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Global error diagnostic display
    window.addEventListener('error', (e) => {
      const errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.width = '100%';
      errDiv.style.background = 'rgba(255,0,0,0.9)';
      errDiv.style.color = '#fff';
      errDiv.style.padding = '10px';
      errDiv.style.zIndex = '999999';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '12px';
      errDiv.textContent = `[JS Error] ${e.message} at ${e.filename}:${e.lineno}`;
      document.body.appendChild(errDiv);
    });

    window.togglePanel = function(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('collapsed');
    };

    const viewEl = document.getElementById('view');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(0, 180, 1200);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 100, 0);
    controls.maxPolarAngle = Math.PI; // Allow rotating below the floor/models
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun1 = new THREE.DirectionalLight(0xffffff, 1.5);
    sun1.position.set(200, 400, 300);
    scene.add(sun1);

    const sun2 = new THREE.DirectionalLight(0xffffff, 0.5);
    sun2.position.set(-200, 400, -300);
    scene.add(sun2);

    // marqueur de joint 3D sélectionné
    const markerGeo = new THREE.SphereGeometry(3, 16, 16);
    const markerMat = new THREE.MeshBasicMaterial({
      color: 0xff3366,
      transparent: true,
      opacity: 0.85,
      depthTest: false // rendu par-dessus tout pour rester visible
    });
    const selectedBoneMarker = new THREE.Mesh(markerGeo, markerMat);
    selectedBoneMarker.visible = false;
    selectedBoneMarker.renderOrder = 999;
    scene.add(selectedBoneMarker);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    const meshListEl = document.getElementById('mesh-list');
    const meshVisibility = new Map(); // name -> boolean
    const allModels = [];
    window.allModels = allModels;

    const variants = [
      // Groupe 1 : 89 os (suffixes numériques bas)
      { id: 'lara_croft_324_rigged', label: 'Lara 324 Rigged', file: 'media/all_lara/lara_croft_324_rigged.glb', color: '#ff6600' },
      
      // Groupe 2 : 98 os (suffixes numériques en _085)
      { id: 'lara_croft_43254_rigged', label: 'Lara 43254 Rigged', file: 'media/all_lara/lara_croft_43254_rigged.glb', color: '#33bb66' },
      { id: 'lara_croft_4543', label: 'Lara 4543', file: 'media/all_lara/lara_croft_4543.glb', color: '#aa77ff' },
      { id: 'lara_croft_motorcycle_gear', label: 'Motorcycle Gear', file: 'media/all_lara/lara_croft_motorcycle_gear.glb', color: '#8d99ae' },
      { id: 'lara_croft_spy_gear', label: 'Spy Gear', file: 'media/all_lara/lara_croft_spy_gear.glb', color: '#3d5a80' },
      { id: 'lara_croft_suit', label: 'Suit', file: 'media/all_lara/lara_croft_suit.glb', color: '#edf2f4' },
      
      // Groupe 3 : 92 os (suffixes numériques bas)
      { id: 'lara_croft_brown_jacket', label: 'Brown Jacket', file: 'media/all_lara/lara_croft_brown_jacket.glb', color: '#d4a373' },
      { id: 'lara_croft_swim_gear', label: 'Swim Gear', file: 'media/all_lara/lara_croft_swim_gear.glb', color: '#00b4d8' },
      { id: 'lara_croft_swim_gear_1', label: 'Swim Gear 1', file: 'media/all_lara/lara_croft_swim_gear_1.glb', color: '#90e0ef' },
      
      // Groupe 4 : 87 os (suffixes intermédiaires _076)
      { id: 'lara_croft_dress_345', label: 'Dress 345', file: 'media/all_lara/lara_croft_dress_345.glb', color: '#e07a5f' },
      
      // Groupe 5 : 136 os (robe rouge, squelette complexe)
      { id: 'lara_croft_red_dress', label: 'Red Dress', file: 'media/all_lara/lara_croft_red_dress.glb', color: '#ff4d6d' },
      
      // Groupe 6 : 93 os (squelette d'accessoire spécifique)
      { id: 'lara_croft_swim_gear_243', label: 'Swim Gear 243', file: 'media/all_lara/lara_croft_swim_gear_243.glb', color: '#0077b6' },
      
      // Groupe 7 : 88-97 os (sans suffixe numérique)
      { id: 'lara_croft_black_tank_top', label: 'Black Tank Top', file: 'media/all_lara/lara_croft_black_tank_top.glb', color: '#4a4a4a', fixOpaque: true },
      { id: 'lara_croft_4259', label: 'Lara 4259', file: 'media/all_lara/lara_croft_4259.glb', color: '#d2a23c', fixOpaque: true },
      { id: 'lara_croft_3254_rigged', label: 'Lara 3254 Rigged', file: 'media/all_lara/lara_croft_3254_rigged.glb', color: '#99cc33', fixOpaque: true },
      { id: 'lara_croft_gold_shades', label: 'Gold Shades', file: 'media/all_lara/lara_croft_gold_shades.glb', color: '#ffd700', fixOpaque: true },
      
      // Groupe 8 : 88 os (préfixe mixamorig_ retiré)
      { id: 'lara_officiel', label: 'Lara Officiel', file: 'media/all_lara/lara_original_88_bones.glb', color: '#ff0055', fixOpaque: true },
      
      // Groupe 9 : 91 os (sans suffixe, variante zip)
      { id: 'lara_croft_zip', label: 'Swim', file: 'media/all_lara/lara_croft_zip.glb', color: '#cc99ff', fixOpaque: true },

      // Groupe 10 : 63 os (majuscules, squelette ultra-simplifié)
      { id: 'lara_croft_543i', label: 'Lara 543i', file: 'media/all_lara/lara_croft_543i.glb', color: '#00ffcc', fixOpaque: true },

      // X-Bot du Studio
      { id: 'xbot_studio', label: 'X-Bot (Studio)', file: 'media/all_lara/xbot_studio.glb', color: '#3b82f6', fixOpaque: true }
    ];

    function getCleanName(name) {
      if (!name) return "Unnamed";
      let clean = name;
      if (clean.includes('|')) clean = clean.split('|').pop();
      clean = clean.replace(/^[0-9_+ -]+/, ''); 
      clean = clean.replace(/_[0-9.]+(?:_[0-9.]+){2,}$/, '');  
      return clean || name;
    }

    function updateMeshListUI() {
      const sortedEntries = Array.from(meshVisibility.entries()).sort((a, b) => a[1].label.localeCompare(b[1].label));
      meshListEl.innerHTML = '';
      sortedEntries.forEach(([key, info]) => {
        const div = document.createElement('div');
        div.className = 'mesh-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = info.visible;
        checkbox.onchange = (e) => {
          info.visible = e.target.checked;
          applyMeshVisibility(key, e.target.checked);
        };
        const label = document.createElement('span');
        label.textContent = info.label;
        label.title = key; 
        label.style.opacity = info.visible ? '1' : '0.5';
        div.onclick = () => checkbox.click();
        checkbox.onclick = (e) => e.stopPropagation();
        div.appendChild(checkbox);
        div.appendChild(label);
        meshListEl.appendChild(div);
      });
    }

    function applyMeshVisibility(meshName, visible) {
      allModels.forEach(model => {
        model.traverse(node => {
          if (node.isMesh && node.name === meshName) {
            node.visible = visible;
          }
        });
      });
    }

    function createNameLabel(text, color = '#ffffff') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(18,18,24,0.85)';
      if (ctx.roundRect) ctx.roundRect(0, 0, 512, 128, 20);
      else ctx.rect(0, 0, 512, 128);
      ctx.fill();
      ctx.font = 'bold 50px system-ui';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);
      
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(120, 30, 1);
      return sprite;
    }

    // Bone mapping dictionary between Mixamo and Lara 2026 Native
    const BONE_SYNONYMS = {
      'Hips': ['hips', 'pelvis', 'cog', 'roothips', 'rootground', 'hip'],
      'Spine': ['spine01', 'spinelower', 'spine0', 'spine1', 'spine'],
      'Spine2': ['spine02', 'spineupper', 'spine2', 'spine03', 'spine', 'spine3'],
      'Neck': ['neck', 'headnecklower'],
      'Head': ['head', 'headneckupper'],
      'LeftShoulder': ['leftshoulder', 'shoulderl', 'claviclel', 'armleftshoulder', 'larmclavicle', 'shlderl', 'armleftshoulder1'],
      'LeftArm': ['armleftshoulder2', 'upperarml', 'larmhumerus', 'upperarm.l', 'upper_arm.l', 'leftarm', 'armleftelbow', 'arm.l', 'bicepl'],
      'LeftForeArm': ['lowerarml', 'larmradius', 'forearm.l', 'forearm_l', 'leftforearm', 'armleftelbow', 'armleftwrist', 'forarml', 'forearml'],
      'LeftHand': ['handl', 'larmwrist', 'hand.l', 'hand_l', 'wrist.l', 'wrist_l', 'lefthand', 'armleftwrist', 'palml'],
      'RightShoulder': ['rightshoulder', 'shoulderr', 'clavicler', 'armrightshoulder', 'rarmclavicle', 'shlderr', 'armrightshoulder1'],
      'RightArm': ['rightarm', 'armrightshoulder2', 'upperarmr', 'armrightelbow', 'rarmhumerus', 'upperarm.r', 'upper_arm.r', 'arm.r', 'bicepr'],
      'RightForeArm': ['lowerarmr', 'rarmradius', 'forearm.r', 'forearm_r', 'rightforearm', 'armrightelbow', 'armrightwrist', 'forarmr', 'forearmr'],
      'RightHand': ['handr', 'rarmwrist', 'hand.r', 'hand_r', 'wrist.r', 'wrist_r', 'righthand', 'armrightwrist', 'palmr'],
      'LeftUpLeg': ['legleftthigh', 'thighl', 'llegfemur', 'thigh.l', 'thigh_l', 'leftupleg'],
      'LeftLeg': ['legleftknee', 'calfl', 'shinl', 'llegtibia', 'shin.l', 'shin_l', 'calf.l', 'calf_l', 'leftleg'],
      'LeftFoot': ['legleftankle', 'footl', 'llegankle', 'foot.l', 'foot_l', 'ankle.l', 'ankle_l', 'leftfoot'],
      'LeftToeBase': ['leglefttoes', 'balll', 'toel', 'llegball', 'toe.l', 'toe_l', 'ball.l', 'ball_l', 'lefttoebase'],
      'RightUpLeg': ['legrightthigh', 'thighr', 'rlegfemur', 'thigh.r', 'thigh_r', 'rightupleg'],
      'RightLeg': ['legrightknee', 'calfr', 'shinr', 'rlegtibia', 'shin.r', 'shin_r', 'calf.r', 'calf_r', 'rightleg'],
      'RightFoot': ['legrightankle', 'footr', 'rlegankle', 'foot.r', 'foot_r', 'ankle.r', 'ankle_r', 'rightfoot'],
      'RightToeBase': ['legrighttoes', 'ballr', 'toer', 'rlegball', 'toe.r', 'toe_r', 'ball.r', 'ball_r', 'righttoebase']
    };

    function resolveTargetFingerBoneName(targetInstance, side, type, segment) {
      const sideChar = side.charAt(0).toLowerCase();
      const segmentIndex = parseInt(segment) - 1;
      const segmentLetter = ['a', 'b', 'c'][segmentIndex] || 'a';
      
      const candidates = [
        new RegExp(`^${type}${segment}_${sideChar}$`, 'i'),
        new RegExp(`arm.*${side}.*finger.*${type === 'thumb' ? 1 : type === 'index' ? 2 : type === 'middle' ? 3 : type === 'ring' ? 4 : 5}${segmentLetter}`, 'i'),
        new RegExp(`${type}_0${segment}_${sideChar}`, 'i'),
        new RegExp(`${type === 'thumb' ? 'thumb' : 'f_' + type}\\.0${segment}\\.${sideChar}`, 'i'),
        new RegExp(`${sideChar}.*hand.*${type}.*${segmentIndex}`, 'i'),
        new RegExp(`mixamorig.*${side}.*hand.*${type}.*${segment}`, 'i'),
        new RegExp(`mixamorig_${side}_hand_${type}_${segment}`, 'i'),
        new RegExp(`${side}_hand_${type}_${segment}`, 'i')
      ];

      let foundName = null;
      targetInstance.traverse(node => {
        if (node.isBone && !foundName) {
          for (const rx of candidates) {
            if (rx.test(node.name)) {
              foundName = node.name;
              break;
            }
          }
        }
      });
      return foundName;
    }

    function resolveTargetBoneName(targetInstance, baseName) {
      const fingerMatch = baseName.match(/Hand(Thumb|Index|Middle|Ring|Pinky)(\d)/i);
      if (fingerMatch) {
        const side = baseName.toLowerCase().includes('left') ? 'left' : 'right';
        const type = fingerMatch[1].toLowerCase();
        const segment = fingerMatch[2];
        const resolvedFinger = resolveTargetFingerBoneName(targetInstance, side, type, segment);
        if (resolvedFinger) return resolvedFinger;
      }

      const synonyms = BONE_SYNONYMS[baseName];
      if (synonyms) {
        for (const syn of synonyms) {
          let foundName = null;
          targetInstance.traverse(node => {
            if (node.isBone && !foundName) {
              const nameNormalized = node.name.toLowerCase().replace(/[:_ .\-]/g, '');
              if (nameNormalized === syn || (nameNormalized.includes(syn) && 
                  !nameNormalized.includes(syn + '1') && 
                  !nameNormalized.includes(syn + '2') && 
                  !nameNormalized.includes(syn + '3') && 
                  !nameNormalized.includes(syn + '4'))) {
                if (!nameNormalized.includes('twist') && !nameNormalized.includes('muscle') && !nameNormalized.includes('offset')) {
                  foundName = node.name;
                }
              }
            }
          });
          if (foundName) return foundName;
        }
      }

      const candidates = [
        'mixamorig:' + baseName,
        'mixamorig_' + baseName,
        'mixamorig' + baseName,
        baseName,
        'mixamorig:' + baseName.charAt(0).toLowerCase() + baseName.slice(1),
        'mixamorig_' + baseName.charAt(0).toLowerCase() + baseName.slice(1),
        'mixamorig' + baseName.charAt(0).toLowerCase() + baseName.slice(1),
        baseName.charAt(0).toLowerCase() + baseName.slice(1)
      ];

      for (const cand of candidates) {
        if (targetInstance.getObjectByName(cand)) {
          return cand;
        }
      }
      return null;
    }

    function retargetMixamoClip(rawClip, targetInstance, animScene) {
      if (!rawClip || !targetInstance) return null;

      const animBones = {};
      if (animScene) {
        animScene.updateMatrixWorld(true);
        animScene.traverse(c => {
          if (c.isBone) {
            const match = c.name.match(/mixamorig[:_]?(.+)/i);
            if (match) {
              animBones[match[1]] = {
                restWorldQuaternion: c.getWorldQuaternion(new THREE.Quaternion()),
                restLocalQuaternion: c.quaternion.clone(),
                parentRestWorldQuaternion: c.parent ? c.parent.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion(),
                defaultPosition: c.position.clone()
              };
            }
          }
        });
      }

      const clonedTracks = [];
      for (const track of rawClip.tracks) {
        const cl = track.clone();
        cl.times = new Float32Array(track.times);
        cl.values = new Float32Array(track.values);
        clonedTracks.push(cl);
      }
      const workingClip = new THREE.AnimationClip(rawClip.name, rawClip.duration, clonedTracks);

      for (const track of workingClip.tracks) {
        if (track.name.endsWith('.position')) {
          const firstVal = new THREE.Vector3(track.values[0], track.values[1], track.values[2]);
          if (firstVal.length() > 5.0) {
            for (let i = 0; i < track.values.length; i++) {
              track.values[i] *= 0.01;
            }
          }
        }
      }

      const rootRotTrackIndex = workingClip.tracks.findIndex(t => t.name.toLowerCase().includes('rootjoint') && t.name.endsWith('.quaternion'));
      const hipsRotTrackIndex = workingClip.tracks.findIndex(t => (t.name.toLowerCase().includes('hips') || t.name.toLowerCase().endsWith('hips.quaternion')) && t.name.endsWith('.quaternion') && !t.name.toLowerCase().includes('rootjoint'));

      if (rootRotTrackIndex !== -1) {
        const rootRotTrack = workingClip.tracks[rootRotTrackIndex];
        if (hipsRotTrackIndex !== -1) {
          const hipsRotTrack = workingClip.tracks[hipsRotTrackIndex];
          const timesSet = new Set([...rootRotTrack.times, ...hipsRotTrack.times]);
          const times = Array.from(timesSet).sort((a, b) => a - b);
          
          const values = new Float32Array(times.length * 4);
          
          function evaluateQuaternionTrack(track, t) {
            const trackTimes = track.times;
            const trackValues = track.values;
            if (t <= trackTimes[0]) {
              return new THREE.Quaternion(trackValues[0], trackValues[1], trackValues[2], trackValues[3]);
            }
            if (t >= trackTimes[trackTimes.length - 1]) {
              const idx = (trackTimes.length - 1) * 4;
              return new THREE.Quaternion(trackValues[idx], trackValues[idx+1], trackValues[idx+2], trackValues[idx+3]);
            }
            let i = 0;
            while (i < trackTimes.length - 1 && trackTimes[i+1] < t) {
              i++;
            }
            const t0 = trackTimes[i];
            const t1 = trackTimes[i+1];
            const alpha = (t - t0) / (t1 - t0);
            
            const q0 = new THREE.Quaternion(trackValues[4*i], trackValues[4*i+1], trackValues[4*i+2], trackValues[4*i+3]);
            const q1 = new THREE.Quaternion(trackValues[4*(i+1)], trackValues[4*(i+1)+1], trackValues[4*(i+1)+2], trackValues[4*(i+1)+3]);
            return q0.slerp(q1, alpha);
          }

          for (let i = 0; i < times.length; i++) {
            const t = times[i];
            const qRoot = evaluateQuaternionTrack(rootRotTrack, t);
            const qHips = evaluateQuaternionTrack(hipsRotTrack, t);
            const qCombined = qRoot.multiply(qHips);
            
            values[4*i] = qCombined.x;
            values[4*i+1] = qCombined.y;
            values[4*i+2] = qCombined.z;
            values[4*i+3] = qCombined.w;
          }
          
          hipsRotTrack.times = new Float32Array(times);
          hipsRotTrack.values = values;
          workingClip.tracks.splice(rootRotTrackIndex, 1);
        } else {
          const hipsPosTrack = workingClip.tracks.find(t => t.name.toLowerCase().includes('hips') && !t.name.toLowerCase().includes('rootjoint'));
          let hipsName = 'mixamorig:Hips.quaternion';
          if (hipsPosTrack) {
            hipsName = hipsPosTrack.name.split('.')[0] + '.quaternion';
          }
          rootRotTrack.name = hipsName;
        }
      }

      let srcHipsDefaultY = 0.991;
      let computedHipsRatio = 1.0; 
      
      const hipsBone = targetInstance.getObjectByName(resolveTargetBoneName(targetInstance, 'Hips'));
      
      for (const tr of workingClip.tracks) {
        const [boneFull, prop] = tr.name.split('.');
        const match = boneFull.match(/mixamorig[:_]?(.+)/i);
        if (match) {
          const baseName = match[1];
          if (prop === 'position' && baseName.toLowerCase() === 'hips') {
            let refSrcY = 0.991;
            if (animBones[baseName]) {
              refSrcY = animBones[baseName].defaultPosition.y;
            }
            if (refSrcY > 5.0) {
              refSrcY *= 0.01;
            }
            srcHipsDefaultY = refSrcY;
            
            let targetHipsHeight = 0.991;
            if (hipsBone && hipsBone.defaultPosition) {
              const isLaraNative = targetInstance.getObjectByName('mixamorig_root_hips') !== undefined;
              targetHipsHeight = isLaraNative ? hipsBone.defaultPosition.z : hipsBone.defaultPosition.y;
            }
            
            if (refSrcY > 0) {
              computedHipsRatio = targetHipsHeight / refSrcY;
            }
          }
        }
      }

      const hasRootTranslation = workingClip.tracks.some(t => t.name.toLowerCase().includes('rootjoint') && t.name.endsWith('.position'));
      const tracks = [];

      for (const tr of workingClip.tracks) {
        const [boneFull, prop] = tr.name.split('.');
        const match = boneFull.match(/mixamorig[:_]?(.+)/i);
        if (!match) continue;
        let baseName = match[1];

        if (prop === 'position' && baseName.toLowerCase() === 'hips' && hasRootTranslation) {
          continue;
        }

        let isRootJointTranslation = false;
        if (prop === 'position' && baseName.toLowerCase().includes('rootjoint')) {
          baseName = 'Hips';
          isRootJointTranslation = true;
        }

        const targetBoneName = resolveTargetBoneName(targetInstance, baseName);
        if (targetBoneName) {
          if (prop === 'scale') continue;

          const isHips = targetBoneName.toLowerCase().endsWith('hips');
          if (prop === 'position' && !isHips) continue;

          const clone = tr.clone();
          clone.name = `${targetBoneName}.${prop}`;

          if (prop === 'position' && isHips) {
            const bone = targetInstance.getObjectByName(targetBoneName);
            if (bone && bone.defaultPosition) {
              let P_src = null;
              if (isRootJointTranslation) {
                P_src = new THREE.Quaternion();
              } else if (animBones[baseName]) {
                P_src = animBones[baseName].parentRestWorldQuaternion;
              } else {
                P_src = new THREE.Quaternion();
              }
              const P_tgt = (bone.parent && bone.parent.restWorldQuaternion)
                ? bone.parent.restWorldQuaternion
                : new THREE.Quaternion();
              const P_tgt_inv = P_tgt.clone().invert();
              
              let srcRestPos = null;
              if (isRootJointTranslation) {
                srcRestPos = new THREE.Vector3(0, 0, 0);
              } else if (animBones[baseName]) {
                srcRestPos = animBones[baseName].defaultPosition.clone();
                if (srcRestPos.length() > 5.0) {
                  srcRestPos.multiplyScalar(0.01);
                }
              } else {
                srcRestPos = new THREE.Vector3(0, srcHipsDefaultY, 0);
              }

              const animNameLower = (rawClip.name || "").toLowerCase();
              const isWalk = (animNameLower.includes('walk') || 
                              animNameLower.includes('run') || 
                              animNameLower.includes('step') || 
                              animNameLower.includes('stairs')) &&
                             !animNameLower.includes('dance');

              if (isWalk) {
                for (let j = 0; j < clone.values.length / 3; j++) {
                  let yVal = clone.values[3*j+1];
                  const dx = (clone.values[3*j] - srcRestPos.x) * computedHipsRatio;
                  const dy = 0.0; // walking in-place
                  const dz = (clone.values[3*j+2] - srcRestPos.z) * computedHipsRatio;
                  
                  const dP = new THREE.Vector3(dx, dy, dz)
                    .applyQuaternion(P_src)
                    .applyQuaternion(P_tgt_inv);
                  const resPos = bone.defaultPosition.clone().add(dP);
                  
                  clone.values[3*j] = resPos.x;
                  clone.values[3*j+1] = resPos.y;
                  clone.values[3*j+2] = resPos.z;
                }
              } else {
                for (let j = 0; j < clone.values.length / 3; j++) {
                  let yVal = clone.values[3*j+1];
                  if (isRootJointTranslation && (animNameLower.includes('laying') || animNameLower.includes('sleeping'))) {
                    yVal = 0.12; 
                  }
                  const dx = (clone.values[3*j] - srcRestPos.x) * computedHipsRatio;
                  const dy = (yVal - srcRestPos.y) * computedHipsRatio;
                  const dz = (clone.values[3*j+2] - srcRestPos.z) * computedHipsRatio;
                  
                  const dP = new THREE.Vector3(dx, dy, dz)
                    .applyQuaternion(P_src)
                    .applyQuaternion(P_tgt_inv);
                  const resPos = bone.defaultPosition.clone().add(dP);
                  
                  clone.values[3*j] = resPos.x;
                  clone.values[3*j+1] = resPos.y;
                  clone.values[3*j+2] = resPos.z;
                }
              }
            }
          }

          if (prop === 'quaternion') {
            const tgtLower = targetBoneName.toLowerCase();
            const isClavicle = tgtLower.includes('clavicle') || 
                               tgtLower.includes('shoulder_1') || 
                               tgtLower.includes('shoulder1') || 
                               (tgtLower.includes('shoulder') && 
                                !tgtLower.includes('shoulder_2') && 
                                !tgtLower.includes('shoulder2') && 
                                !tgtLower.includes('shoulder 2'));
            if (isClavicle) continue;

            const bone = targetInstance.getObjectByName(targetBoneName);
            if (bone) {
              if (bone.restLocalQuaternion && bone.restWorldQuaternion) {
                let B_src = null;
                let P_src = null;
                
                if (animBones[baseName]) {
                  const cached = animBones[baseName];
                  B_src = cached.restWorldQuaternion;
                  P_src = cached.parentRestWorldQuaternion;
                } else {
                  B_src = new THREE.Quaternion();
                  P_src = new THREE.Quaternion();
                }
                
                if (B_src && P_src) {
                  const B_tgt = bone.restWorldQuaternion;
                  const P_tgt = (bone.parent && bone.parent.restWorldQuaternion)
                    ? bone.parent.restWorldQuaternion
                    : new THREE.Quaternion();
                  
                  const P_tgt_inv = P_tgt.clone().invert();
                  const B_src_inv = B_src.clone().invert();

                  for (let i = 0; i < clone.values.length; i += 4) {
                    const srcLocalQ = new THREE.Quaternion(clone.values[i], clone.values[i+1], clone.values[i+2], clone.values[i+3]);
                    const animWorldQ = P_src.clone().multiply(srcLocalQ);
                    const deltaQ = animWorldQ.clone().multiply(B_src_inv);
                    const tgtAnimWorldQ = deltaQ.clone().multiply(B_tgt);
                    const tgtLocalQ = P_tgt_inv.clone().multiply(tgtAnimWorldQ).normalize();

                    clone.values[i] = tgtLocalQ.x;
                    clone.values[i+1] = tgtLocalQ.y;
                    clone.values[i+2] = tgtLocalQ.z;
                    clone.values[i+3] = tgtLocalQ.w;
                  }
                } else {
                  // Fallback
                  const parentRestWorldQ = (bone.parent && bone.parent.restWorldQuaternion)
                    ? bone.parent.restWorldQuaternion
                    : new THREE.Quaternion();
                  const parentInv = parentRestWorldQ.clone().invert();
                  const boneRestLocalQ = bone.restLocalQuaternion.clone();

                  for (let i = 0; i < clone.values.length; i += 4) {
                    const q = new THREE.Quaternion(clone.values[i], clone.values[i+1], clone.values[i+2], clone.values[i+3]);
                    const resQ = parentInv.clone()
                      .multiply(q)
                      .multiply(parentRestWorldQ)
                      .multiply(boneRestLocalQ);

                    clone.values[i] = resQ.x;
                    clone.values[i+1] = resQ.y;
                    clone.values[i+2] = resQ.z;
                    clone.values[i+3] = resQ.w;
                  }
                }
              }
            }
          }

          tracks.push(clone);
        }
      }

      const trackSample = tracks.find(t => t.name.includes('LeftArm') || t.name.includes('arm_left_shoulder_2') || t.name.includes('upper_arm'));
      if (trackSample) {
        console.log(`[TrackSample] model="${targetInstance.name}" name="${trackSample.name}" valuesSample="${Array.from(trackSample.values.slice(0, 8)).map(n => n.toFixed(4)).join(', ')}"`);
      }
      console.log(`[Retarget] model="${targetInstance.name}" rawTracks=${workingClip.tracks.length} retargetedTracks=${tracks.length} sampleHips="${resolveTargetBoneName(targetInstance, 'Hips')}" sampleLeftArm="${resolveTargetBoneName(targetInstance, 'LeftArm')}"`);
      return new THREE.AnimationClip(`${workingClip.name}_retargeted`, workingClip.duration, tracks);
    }

    function formatName(fileName) {
      let name = fileName.replace('.glb', '');
      name = name.replace(/_/g, ' ');
      name = name.replace(/,/g, '');
      name = name.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
      return name;
    }

    let currentAnimFile = null;
    let rawAnimClip = null;
    let animScene = null;
    let isPaused = false;
    let playbackSpeed = 1.0;

    window.getCurrentAnimFile = () => currentAnimFile;
    window.getIsPaused = () => isPaused;
    window.getPlaybackSpeed = () => playbackSpeed;

    function playAnimationOnModel(model, clip) {
      if (!model.userData.mixer) {
        console.warn("Model has no mixer assigned:", model);
        return;
      }
      const mixer = model.userData.mixer;
      mixer.stopAllAction();
      const action = mixer.clipAction(clip);
      action.play();
    }

    function stopAllAnimations() {
      allModels.forEach(model => {
        if (model.userData.mixer) {
          model.userData.mixer.stopAllAction();
        }
      });
      currentAnimFile = null;
      rawAnimClip = null;
      animScene = null;
      
      const items = document.querySelectorAll('.anim-item');
      items.forEach(item => item.classList.remove('active'));
    }

    function loadAndPlayAnimation(file) {
      console.log("loadAndPlayAnimation called with:", file);
      currentAnimFile = file;
      
      const items = document.querySelectorAll('.anim-item');
      items.forEach(item => {
        if (item.dataset.file === file) {
          item.classList.add('active');
          item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          item.classList.remove('active');
        }
      });

      const hudP = document.getElementById('loading-status');
      const originalText = hudP ? hudP.textContent : '';
      if (hudP) {
        hudP.innerHTML = `Loading animation <span style="color:#ff4444">${formatName(file)}</span>...`;
      }

      loader.load('media/glb-animations/' + file, (gltf) => {
        if (hudP) {
          hudP.textContent = originalText;
        }
        console.log("GLB animation loaded:", file, "Animations count:", gltf.animations ? gltf.animations.length : 0);
        if (gltf.animations && gltf.animations.length > 0) {
          rawAnimClip = gltf.animations[0];
          animScene = gltf.scene;
          
          allModels.forEach(model => {
            if (!model.userData.retargetedClips) {
              model.userData.retargetedClips = {};
            }
            const retargeted = retargetMixamoClip(rawAnimClip, model, animScene);
            if (retargeted) {
              model.userData.retargetedClips[file] = retargeted;
              playAnimationOnModel(model, retargeted);
            }
          });
        }
      }, undefined, (err) => {
        console.error("Failed to load animation", file, err);
        hudP.textContent = `Error loading ${file}`;
      });
    }

    function createAnimListUI() {
      const animListEl = document.getElementById('anim-list');
      animListEl.innerHTML = '';
      
      ANIMATION_FILES.forEach(file => {
        const div = document.createElement('div');
        div.className = 'anim-item';
        div.dataset.file = file;
        div.textContent = formatName(file);
        div.tabIndex = 0;
        div.addEventListener('click', () => {
          loadAndPlayAnimation(file);
        });
        div.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.keyCode === 13 || e.key === ' ' || e.keyCode === 32) {
            e.preventDefault();
            loadAndPlayAnimation(file);
          }
        });
        animListEl.appendChild(div);
      });
    }

      // Track loaded models by id for post-load alignment
      const modelsMap = {};

      // Find head bone
      function getHeadBone(model) {
        const skipPat = /jaw|tongue|lip|eyelid|eyebrow|brow\.?[0-9]|lash|tooth|teeth|ear|cheek|chin|hair|eyeball|^eye|top_end/i;
        let best = null;
        model.traverse(c => {
          if (!c.isBone || best) return;
          if (skipPat.test(c.name)) return;
          const name = c.name.toLowerCase();
          if (name.includes('head') && !name.includes('neck lower') && !name.includes('neck_lower')) {
            best = c;
          }
        });
        return best;
      }

      // Find the world-space Y of the head bone (ignoring face detail bones)
      function getHeadBoneWorldY(model) {
        const bone = getHeadBone(model);
        if (!bone) return null;
        model.updateMatrixWorld(true);
        const pos = new THREE.Vector3();
        bone.getWorldPosition(pos);
        return pos.y;
      }

      // Scale Lara Hair to match target's proportions, then align head bones in X, Y, Z
      function applyHairToTarget(hairModel, targetModel) {
        const targetHeadBone = getHeadBone(targetModel);
        const hairHeadBone = getHeadBone(hairModel);

        if (targetHeadBone && hairHeadBone) {
          // 1. Reset scale and position to base to measure world scale cleanly
          hairModel.scale.set(1, 1, 1);
          hairModel.position.set(0, 0, 0);
          hairModel.updateMatrixWorld(true);

          // Get target head bone world scale
          const targetScale = new THREE.Vector3();
          targetHeadBone.getWorldScale(targetScale);

          // Get hair head bone world scale
          const hairScale = new THREE.Vector3();
          hairHeadBone.getWorldScale(hairScale);

          // Calculate scale factor matching the head bone scale (scaled down to 38% to fit the head proportions)
          const scaleFactor = (targetScale.y / hairScale.y) * 0.38;
          hairModel.scale.setScalar(scaleFactor);
          hairModel.updateMatrixWorld(true);

          // 2. Align head bones in 3D (X, Y, Z)
          const targetHeadPos = new THREE.Vector3();
          targetHeadBone.getWorldPosition(targetHeadPos);

          const hairHeadPos = new THREE.Vector3();
          hairHeadBone.getWorldPosition(hairHeadPos);

          // Position hair model so its head bone aligns exactly with the target's head bone (moved back by 3cm)
          hairModel.position.x += (targetHeadPos.x - hairHeadPos.x);
          hairModel.position.y += (targetHeadPos.y - hairHeadPos.y);
          hairModel.position.z += (targetHeadPos.z - hairHeadPos.z) - 3;
          hairModel.updateMatrixWorld(true);

          console.log(`[Lara Hair] scaled by factor ${scaleFactor.toFixed(3)} to match head bone, aligned in 3D`);
        } else {
          // Fallback to simple scaling and Y alignment
          const ts = targetModel.scale.x;
          hairModel.scale.setScalar(ts);
          hairModel.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(hairModel);
          hairModel.position.y = -box.min.y;
          hairModel.updateMatrixWorld(true);

          const targetHeadY = getHeadBoneWorldY(targetModel);
          const hairHeadY   = getHeadBoneWorldY(hairModel);
          if (targetHeadY !== null && hairHeadY !== null) {
            hairModel.position.y += (targetHeadY - hairHeadY);
            hairModel.updateMatrixWorld(true);
          }
          hairModel.position.x = targetModel.position.x;
          hairModel.updateMatrixWorld(true);
        }
      }

      function normalizeHeight(model, targetHeight = 175) {
        model.scale.set(1, 1, 1);
        model.position.set(0, 0, 0);
        model.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        if (size.y > 0) {
          const factor = targetHeight / size.y;
          model.scale.setScalar(factor);
          
          model.updateMatrixWorld(true);
          const newBox = new THREE.Box3().setFromObject(model);
          model.position.y = -newBox.min.y;
          model.updateMatrixWorld(true);
          console.log(`Normalized model ${model.name} height to ${targetHeight}. Scale factor: ${factor}. Y-offset: ${model.position.y}`);
        }
      }

      let loadedCount = 0;

      variants.forEach((v, index) => {
        loader.load(v.file, (gltf) => {
          const model = gltf.scene;
          model.name = v.label;
          
          model.updateMatrixWorld(true);
          model.traverse(c => {
            c.restWorldQuaternion = c.getWorldQuaternion(new THREE.Quaternion());
            if (c.isBone) {
              c.defaultPosition = c.position.clone();
              c.defaultRotation = c.rotation.clone();
              c.defaultScale = c.scale.clone();
              c.restLocalQuaternion = c.quaternion.clone();
            }
            
            if (c.isMesh) {
              let newName = c.name;
              if (c.material) {
                const matName = Array.isArray(c.material) ? (c.material[0] ? c.material[0].name : '') : c.material.name;
                if (matName) {
                  const nameLower = matName.toLowerCase();
                  if ((nameLower.includes('handgun left') || nameLower.includes('hhl2') || nameLower.includes('.hhl')) && !nameLower.includes('holster')) {
                    newName = 'handgun_left';
                  } else if ((nameLower.includes('handgun right') || nameLower.includes('hhr2') || nameLower.includes('.hhr')) && !nameLower.includes('holster')) {
                    newName = 'handgun_right';
                  } else if (nameLower.includes('mp5') && !nameLower.includes('ammo') && !nameLower.includes('holster')) {
                    newName = 'mp5';
                  } else if (nameLower.includes('mp5') && nameLower.includes('ammo') && !nameLower.includes('holster')) {
                    newName = 'mp5_ammo';
                  } else if (nameLower.includes('backpack')) {
                    if (nameLower.includes('backpack1') || nameLower.includes('backpack_1')) {
                      newName = 'backpack_1';
                    } else if (nameLower.includes('backpack2') || nameLower.includes('backpack_2')) {
                      newName = 'backpack_2';
                    } else {
                      newName = 'backpack';
                    }
                  } else {
                    newName = getCleanName(matName);
                  }
                }
              }
              if (newName) {
                c.name = newName;
              }

              if (!meshVisibility.has(c.name)) {
                meshVisibility.set(c.name, { label: c.name, visible: true });
                updateMeshListUI();
              }
              c.material = c.material.clone();
              // Fix transparent materials for models flagged with fixOpaque
              if (v.fixOpaque) {
                const mats = Array.isArray(c.material) ? c.material : [c.material];
                mats.forEach(m => {
                  const mName = (m.name || '').toLowerCase();
                  const meshName = (c.name || '').toLowerCase();
                  const isHairOrLash = mName.includes('hair') || mName.includes('lash') || mName.includes('trans') || 
                                       meshName.includes('hair') || meshName.includes('lash');
                  m.transparent = false;
                  m.alphaTest = isHairOrLash ? 0.1 : 0;
                  m.depthWrite = true;
                  if (isHairOrLash) m.side = THREE.DoubleSide;
                  m.needsUpdate = true;
                });
              }
              // Hide native hair meshes on Red Dress (replaced by Lara Hair overlay)
              if (v.hideHairMeshes) {
                const geoName = c.geometry?.name || '';
                const matName = (Array.isArray(c.material) ? c.material[0]?.name : c.material?.name) || '';
                if (/hair/i.test(geoName) || /hair/i.test(matName)) {
                  c.visible = false;
                  meshVisibility.set(c.name, { label: getCleanName(matName || geoName), visible: false });
                }
              }
            }
          });

          if (!v.skipNormalize) normalizeHeight(model, 175);

          const mixer = new THREE.AnimationMixer(model);
          model.userData.mixer = mixer;
          
          model.name = v.id;

          const skeletonHelper = new THREE.SkeletonHelper(model);
          const showSkeletons = document.getElementById('toggle-skeletons')?.checked || false;
          skeletonHelper.visible = showSkeletons;
          scene.add(skeletonHelper);
          model.userData.skeletonHelper = skeletonHelper;

          allModels.push(model);
          modelsMap[v.id] = model;
          const superpose = document.getElementById('toggle-superposition')?.checked || false;
          const offset = index - Math.floor(variants.length / 2);
          const x = superpose ? 0 : offset * SPACING;
          model.position.x = x;
          scene.add(model);

          if (!v.noLabel) {
            const label = createNameLabel(v.label, v.color);
            label.position.set(x, 215, 0);
            label.visible = !superpose;
            scene.add(label);
            model.userData.label = label;
          }

          loadedCount++;
          document.getElementById('loading-status').innerText = `Loaded ${loadedCount} / ${variants.length} models`;

          if (loadedCount === variants.length) {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) loadingScreen.style.display = 'none';
            loadAndPlayAnimation("idle.glb");
          } else if (rawAnimClip && animScene) {
            const retargeted = retargetMixamoClip(rawAnimClip, model, animScene);
            if (retargeted) {
              if (!model.userData.retargetedClips) {
                model.userData.retargetedClips = {};
              }
              model.userData.retargetedClips[currentAnimFile] = retargeted;
              playAnimationOnModel(model, retargeted);
            }
          }
        }, undefined, (err) => {
          console.error("Failed to load model:", v.label, err);
          loadedCount++;
          document.getElementById('loading-status').innerText = `Error loading ${v.label} (${loadedCount}/${variants.length})`;
          if (loadedCount === variants.length) {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) loadingScreen.style.display = 'none';
            loadAndPlayAnimation("idle.glb");
          }
        });
      });
    });

    // Layout update function to toggle between side-by-side and superposition
    function updateLayout() {

      allModels.forEach((model, index) => {
        const variantIndex = variants.findIndex(v => v.id === model.name);
        const idx = variantIndex !== -1 ? variantIndex : index;
        const offset = idx - Math.floor(variants.length / 2);
        const targetX = superpose ? 0 : offset * SPACING;
        
        model.position.x = targetX;
        if (model.userData.label) {

    let selectedModel = null;

    window.switchTooltipTab = function(tab) {

    window.selectBone = function(modelUuid, boneUuid, event) {
      if (event) {
        event.stopPropagation();
      }
      
      if (!selectedModel || selectedModel.uuid !== modelUuid) {
        selectedModel = allModels.find(m => m.uuid === modelUuid);
      }
      if (!selectedModel) return;
      
      let targetBone = null;
      selectedModel.traverse(c => {
        if (c.isBone && c.uuid === boneUuid) {
          targetBone = c;
        }
      });
      
      if (!targetBone) return;
      
      selectedBone = targetBone;
      
      // Mettre à jour le marqueur 3D et le label
      updateSelectedBoneMarker();
      
      // Mettre à jour le style de la liste HTML
      const selectedBones = document.querySelectorAll('.hierarchy-node-selected');
      selectedBones.forEach(el => el.classList.remove('hierarchy-node-selected'));
      
      const nodeEl = document.getElementById(`bone-${boneUuid}`);
      if (nodeEl) {
        nodeEl.classList.add('hierarchy-node-selected');
      }
    };

    function findClosestBone(model, worldPoint) {
      let closestBone = null;
      let minDistance = Infinity;
      const tempPos = new THREE.Vector3();
      
      model.traverse(node => {
        if (node.isBone) {
          node.getWorldPosition(tempPos);
          const dist = tempPos.distanceTo(worldPoint);
          if (dist < minDistance) {
            minDistance = dist;
            closestBone = node;
          }
        }
      });
      
      return closestBone;
    }

    const tempBonePos = new THREE.Vector3();
    function updateSelectedBoneMarker() {
      if (!selectedBone || !selectedBoneMarker) {
        if (selectedBoneMarker) selectedBoneMarker.visible = false;
        const labelEl = document.getElementById('joint-3d-label');
        if (labelEl) labelEl.style.display = 'none';
        return;
      }
      
      selectedBone.getWorldPosition(tempBonePos);
      
      selectedBoneMarker.position.copy(tempBonePos);
      selectedBoneMarker.visible = true;
      
      const labelEl = document.getElementById('joint-3d-label');
      if (labelEl) {
        labelEl.textContent = selectedBone.name;
        
        const proj = tempBonePos.clone().project(camera);
        // Si le joint est derrière la caméra, on cache le label
        if (proj.z > 1) {
          labelEl.style.display = 'none';
        } else {
          labelEl.style.display = 'block';
          const x = (proj.x * 0.5 + 0.5) * window.innerWidth;
          const y = (proj.y * -0.5 + 0.5) * window.innerHeight;
          labelEl.style.left = `${x}px`;
          labelEl.style.top = `${y}px`;
        }
      }
    }

    function getMeshTreeHTML(model) {
      let html = '';
      let meshCount = 0;
      
      function traverseNode(node, depth = 0) {
        if (node.isBone) {
          // On n'affiche pas les bones dans l'onglet des meshes, mais on traverse leurs enfants
          for (let i = 0; i < node.children.length; i++) {
            traverseNode(node.children[i], depth);
          }
          return;
        }
        
        let shouldRender = false;
        let typeIcon = '📁';
        let color = '#339af0';
        let isClickable = false;
        
        if (node.isSkinnedMesh) {
          typeIcon = '👗';
          color = '#ff6b6b';
          meshCount++;
          isClickable = true;
          shouldRender = true;
        } else if (node.isMesh) {
          typeIcon = '📦';
          color = '#51cf66';
          meshCount++;
          isClickable = true;
          shouldRender = true;
        } else if (node.isGroup && node.name) {
          shouldRender = true;
        }
        
        if (shouldRender && node !== model) {
          const indent = '&nbsp;'.repeat(depth * 2);
          const label = node.name || 'Unnamed';
          if (isClickable) {
            const isSelected = activeHighlightedMesh && activeHighlightedMesh.uuid === node.uuid;
            const highlightClass = isSelected ? 'hierarchy-node-selected' : '';
            html += `<div id="node-${node.uuid}" class="hierarchy-node-clickable ${highlightClass}" onclick="window.highlightMesh('${model.uuid}', '${node.uuid}', event)" style="color: ${color}; font-family: monospace; white-space: nowrap; line-height: 1.4; display: block; margin: 1px 0; border-radius: 4px; padding: 2px 4px; cursor: pointer;">${indent}${typeIcon} <strong>${label}</strong> <span style="font-size: 9px; opacity: 0.5;">(${node.type})</span></div>`;
          } else {
            html += `<div style="color: ${color}; font-family: monospace; white-space: nowrap; line-height: 1.4; padding: 2px 4px;">${indent}${typeIcon} <strong>${label}</strong> <span style="font-size: 9px; opacity: 0.5;">(${node.type})</span></div>`;
          }
        }
        
        const nextDepth = shouldRender && node !== model ? depth + 1 : depth;
        for (let i = 0; i < node.children.length; i++) {
          traverseNode(node.children[i], nextDepth);
        }
      }
      
      traverseNode(model, 0);
      return { html, meshCount };
    }

    let activeHighlightedMesh = null;
    let originalMeshMaterials = null;

    window.highlightMesh = function(modelUuid, meshUuid, event) {
      if (event) {
        event.stopPropagation();
      }
      
      const model = allModels.find(m => m.uuid === modelUuid);
      if (!model) return;
      
      let targetMesh = null;
      model.traverse(c => {
        if (c.uuid === meshUuid) {
          targetMesh = c;
        }
      });
      
      if (!targetMesh) return;
      
      // Toggle if already active
      if (activeHighlightedMesh === targetMesh) {
        window.clearHighlight();
        return;
      }
      
      window.clearHighlight();
      
      activeHighlightedMesh = targetMesh;
      originalMeshMaterials = targetMesh.material;
      
      // Glowing highlight material
      const highlightMat = new THREE.MeshStandardMaterial({
        color: 0xff3366,
        emissive: 0xff1133,
        roughness: 0.2,
        metalness: 0.8,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide
      });
      
      targetMesh.material = highlightMat;
      
      // Clear selection styling and highlight in HTML tree
      const selectedNodes = document.querySelectorAll('.hierarchy-node-selected');
      selectedNodes.forEach(el => el.classList.remove('hierarchy-node-selected'));
      
      const nodeEl = document.getElementById(`node-${meshUuid}`);
      if (nodeEl) {
        nodeEl.classList.add('hierarchy-node-selected');
      }
    };

    window.clearHighlight = function() {
      if (activeHighlightedMesh && originalMeshMaterials !== null) {
        activeHighlightedMesh.material = originalMeshMaterials;
      }
      activeHighlightedMesh = null;
      originalMeshMaterials = null;
      
      const selectedNodes = document.querySelectorAll('.hierarchy-node-selected');
      selectedNodes.forEach(el => {
        el.classList.remove('hierarchy-node-selected');
      });
    };

    function showTooltip(model, initialBone = null) {
      if (!tooltipEl) return;
      window.clearHighlight();
      
      selectedModel = model;
      
      const variant = variants.find(v => v.id === model.name);
      const label = variant ? variant.label : model.name;
      
      document.getElementById('tooltip-model-name').textContent = label;
      
      // Construire la liste du Squelette (Joints)
      let jointsHTML = '';
      let boneCount = 0;
      
      const rootBones = [];
      model.traverse(node => {
        if (node.isBone) {
          if (!node.parent || !node.parent.isBone) {
            rootBones.push(node);
          }
        }
      });
      
      function traverseBone(bone, depth = 0) {
        const indent = '&nbsp;'.repeat(depth * 2);
        boneCount++;
        
        const isSelected = selectedBone && selectedBone.uuid === bone.uuid;
        const highlightClass = isSelected ? 'hierarchy-node-selected' : '';
        
        jointsHTML += `<div id="bone-${bone.uuid}" class="hierarchy-node-clickable ${highlightClass}" onclick="window.selectBone('${model.uuid}', '${bone.uuid}', event)" style="color: #a1a1aa; font-family: monospace; white-space: nowrap; line-height: 1.4; display: block; margin: 1px 0; border-radius: 4px; padding: 2px 4px; cursor: pointer;">${indent}🦴 <strong>${bone.name}</strong></div>`;
        
        for (let i = 0; i < bone.children.length; i++) {
          const child = bone.children[i];
          if (child.isBone) {
            traverseBone(child, depth + 1);
          }
        }
      }
      
      // Si on clique sur un modèle, on définit le joint initialement sélectionné
      if (initialBone) {
        selectedBone = initialBone;
      } else if (!selectedBone || !model.getObjectByProperty('uuid', selectedBone.uuid)) {
        // Par défaut le premier os racine si rien n'est sélectionné
        selectedBone = rootBones[0] || null;
      }
      
      rootBones.forEach(rb => traverseBone(rb, 0));
      
      // Construire la liste des Meshes
      const { html: meshesHTML, meshCount } = getMeshTreeHTML(model);
      
      // Mettre à jour les éléments HTML
      const jointsStatsEl = document.getElementById('tooltip-joints-stats');
      const jointsContentEl = document.getElementById('tooltip-joints-content');
      const meshesStatsEl = document.getElementById('tooltip-meshes-stats');
      const meshesContentEl = document.getElementById('tooltip-meshes-content');
      
      if (jointsStatsEl) jointsStatsEl.textContent = `Total: ${boneCount} joints / squelette`;
      if (jointsContentEl) jointsContentEl.innerHTML = jointsHTML;
      
      if (meshesStatsEl) meshesStatsEl.textContent = `Total: ${meshCount} meshes`;
      if (meshesContentEl) meshesContentEl.innerHTML = meshesHTML;
      
      // Afficher le tooltip
      tooltipEl.style.display = 'block';
      
      // Forcer l'affichage de l'onglet actif
      window.switchTooltipTab(activeTab);
      
      // Mettre à jour le marqueur 3D
      updateSelectedBoneMarker();
      
      // Faire défiler jusqu'au joint sélectionné
      if (selectedBone) {
        setTimeout(() => {
          const boneEl = document.getElementById(`bone-${selectedBone.uuid}`);
          if (boneEl) {
            boneEl.scrollIntoView({ block: 'nearest' });
          }
        }, 50);
      }
    }

    function hideTooltip() {
      if (tooltipEl) tooltipEl.style.display = 'none';
      hoveredModel = null;
      selectedModel = null;
      selectedBone = null;
      if (selectedBoneMarker) selectedBoneMarker.visible = false;
      const labelEl = document.getElementById('joint-3d-label');
      if (labelEl) labelEl.style.display = 'none';
      window.clearHighlight();
    }
    
    window.hideTooltip = hideTooltip;

    // Détecter clic vs drag sur les modèles
    let startX = 0;
    let startY = 0;

    window.addEventListener('mousedown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('mouseup', (e) => {
      const diffX = Math.abs(e.clientX - startX);
      const diffY = Math.abs(e.clientY - startY);
      
      // Si le client a bougé de moins de 5px, c'est une sélection par clic
      if (diffX < 5 && diffY < 5) {
        if (allModels.length === 0) return;
        
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(allModels, true);
        
        if (intersects.length > 0) {
          let obj = intersects[0].object;
          let rootModel = null;
          while (obj && obj !== scene) {
            if (allModels.includes(obj)) {
              rootModel = obj;
              break;
            }
            obj = obj.parent;
          }
          
          if (rootModel) {
            const intersectPoint = intersects[0].point;
            const closestBone = findClosestBone(rootModel, intersectPoint);
            showTooltip(rootModel, closestBone);
            return;
          }
        }
        
        // Cacher le panneau si on clique en dehors
        const isClickInsideTooltip = tooltipEl && tooltipEl.contains(e.target);
        const isClickInsideControls = (document.getElementById('mesh-control')?.contains(e.target)) || 
                                     (document.getElementById('anim-control')?.contains(e.target)) || 
                                     (document.getElementById('hud')?.contains(e.target));
                                     
        if (!isClickInsideTooltip && !isClickInsideControls) {
          hideTooltip();
        }
      }
    });

    // Mousemove contrôle uniquement le pointeur visuel
    window.addEventListener('mousemove', (e) => {
      if (e.buttons !== 0 || allModels.length === 0) {
        return;
      }
      
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(allModels, true);
      
      let foundModel = false;
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && obj !== scene) {
          if (allModels.includes(obj)) {
            foundModel = true;
            break;
          }
          obj = obj.parent;
        }
      }
      
      if (foundModel) {
        document.body.style.cursor = 'pointer';
      } else {
        document.body.style.cursor = 'default';
      }
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta() * playbackSpeed;
      if (!isPaused) {
        allModels.forEach(model => {
          if (model.userData.mixer) {
            model.userData.mixer.update(delta);
          }
        });
      }
      
      // Mettre à jour le marqueur 3D et la position du label 2D à chaque frame (pour l'animation)
      updateSelectedBoneMarker();
      
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
