name: room-contact

services:
  mailer:
    image: rmnclmnt/mailer@sha256:e6a82a010920adf260ba051ced5c4a2a38266d134912b1c0811187bc84956728
    restart: unless-stopped
    environment:
      SENDER_EMAIL: ${SENDER_EMAIL:?Adresse d’expédition requise}
      TO_EMAIL: ${TO_EMAIL:?Adresse destinataire requise}
      TO_NAME: David Herelle
      SMTP_HOST: ${SMTP_HOST:?Serveur SMTP requis}
      SMTP_PORT: ${SMTP_PORT:?Port SMTP requis}
      SMTP_TLS: ${SMTP_TLS:?Choisir STARTTLS}
      SMTP_SSL: ${SMTP_SSL:?Choisir TLS implicite}
      SMTP_USER: ${SMTP_USER:?Identifiant SMTP requis}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Mot de passe SMTP requis}
      FORCE_HTTPS: "false"
      CORS_ORIGINS: '["https://dinatih.org", "http://localhost:5173", "http://127.0.0.1:5173"]'

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mailer
