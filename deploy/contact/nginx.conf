# Le port hôte écoute uniquement sur loopback, derrière cloudflared.
map $http_cf_connecting_ip $contact_client {
  "" $binary_remote_addr;
  default $http_cf_connecting_ip;
}
limit_req_zone $contact_client zone=contact:1m rate=5r/m;

server {
  listen 80;
  client_max_body_size 16k;
  limit_req_status 429;

  location = /api/mail {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=contact burst=2 nodelay;
    resolver 127.0.0.11 valid=30s;
    set $mailer mailer;
    proxy_pass http://$mailer:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / { return 404; }
}
