services:
  ha-mcp:
    image: ghcr.io/homeassistant-ai/ha-mcp:8.7.0@sha256:600677bbd7574dfb59682e40d6945f73fcc8852d3684b3671506602473942448
    command: ha-mcp-web
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HOMEASSISTANT_URL: http://127.0.0.1:8123
      MCP_HOST: 127.0.0.1
      MCP_PORT: '8086'
      MCP_SECRET_PATH: /mcp
      HA_MCP_DISABLE_SETTINGS_UI: 'true'
      REDACT_SECRETS: 'true'
    volumes:
      - data:/home/mcpuser/.ha-mcp
volumes:
  data:
