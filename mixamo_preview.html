<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mixamo Previewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #333; color: white; font-family: sans-serif; }
    #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; z-index: 10; min-width: 250px; }
    label { display: block; margin-bottom: 8px; cursor: pointer; }
    input[type="file"] { margin-top: 8px; width: 100%; }
    h3 { margin-top: 0; font-size: 1.1em; border-bottom: 1px solid #666; padding-bottom: 5px; }
  </style>
</head>
<body>
  <div id="ui">
    <h3>Modèles 3D</h3>
    <label><input type="checkbox" id="toggle-original" checked> lara_mixamo.glb (Original)</label>
    <label><input type="checkbox" id="toggle-final" checked> lara_mixamo_final.glb (Sans armes/holsters)</label>
    
    <h3 style="margin-top:20px;">Test d'Animations</h3>
    <p style="font-size:0.85em; color:#bbb;">Chargez un fichier d'animation (.fbx ou .glb) depuis votre PC (ex: téléchargé sur Mixamo, stocké dans media/mixamo-anims/).</p>
    <input type="file" id="anim-file" accept=".fbx,.glb,.gltf">
    
    <p id="anim-status" style="color: #4CAF50; font-size: 0.9em; font-weight: bold; margin-top: 15px;">Aucune animation chargée.</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, clock;
    let modelOriginal, modelFinal;
    let mixerOriginal, mixerFinal;
    let currentActionOriginal, currentActionFinal;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x3a3a4a);
      scene.fog = new THREE.Fog(0x3a3a4a, 200, 1000);

      const grid = new THREE.GridHelper(500, 100, 0xffffff, 0xffffff);
      grid.material.opacity = 0.1;
      grid.material.transparent = true;
      scene.add(grid);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.set(0, 150, 400);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(0, 200, 100);
      dirLight.castShadow = true;
      dirLight.shadow.camera.top = 200;
      dirLight.shadow.camera.bottom = -200;
      dirLight.shadow.camera.left = -200;
      dirLight.shadow.camera.right = 200;
      scene.add(dirLight);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 90, 0);
      controls.update();

      clock = new THREE.Clock();

      // Load models
      const gltfLoader = new GLTFLoader();
      
      // Utiliser les chemins relatifs servis par Vite dans "public"
      gltfLoader.load('/media/glb/lara_mixamo.glb', (gltf) => {
        modelOriginal = gltf.scene;
        modelOriginal.scale.set(100, 100, 100);
        modelOriginal.position.x = -60;
        modelOriginal.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
        scene.add(modelOriginal);
        mixerOriginal = new THREE.AnimationMixer(modelOriginal);
      }, undefined, (e) => console.error(e));

      gltfLoader.load('/media/glb/lara_mixamo_final.glb', (gltf) => {
        modelFinal = gltf.scene;
        modelFinal.scale.set(100, 100, 100);
        modelFinal.position.x = 60;
        modelFinal.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
        scene.add(modelFinal);
        mixerFinal = new THREE.AnimationMixer(modelFinal);
      }, undefined, (e) => console.error(e));

      // UI Checkboxes
      document.getElementById('toggle-original').addEventListener('change', (e) => {
        if (modelOriginal) modelOriginal.visible = e.target.checked;
      });
      document.getElementById('toggle-final').addEventListener('change', (e) => {
        if (modelFinal) modelFinal.visible = e.target.checked;
      });

      // Anim Loader
      document.getElementById('anim-file').addEventListener('change', handleFileLoad);
      window.addEventListener('resize', onWindowResize);
    }

    function handleFileLoad(event) {
      const file = event.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const ext = file.name.split('.').pop().toLowerCase();
      const status = document.getElementById('anim-status');
      status.innerText = `Chargement de ${file.name}...`;

      const onLoadAnim = (animData) => {
        let clip;
        if (animData.animations && animData.animations.length > 0) {
          clip = animData.animations[0];
        }
        
        if (!clip) {
          status.innerText = 'Erreur : Aucune animation trouvée dans le fichier.';
          status.style.color = '#ff5555';
          return;
        }

        // Nettoyer les noms des tracks si besoin (Mixamo met parfois le namespace de l'armature)
        clip.tracks.forEach(track => {
            // Retire l'éventuel préfixe avant "mixamorig:" ajouté par Blender/FBXLoader
            const match = track.name.match(/(mixamorig:.*)/);
            if (match) track.name = match[1];
        });

        if (mixerOriginal) {
          if (currentActionOriginal) currentActionOriginal.stop();
          currentActionOriginal = mixerOriginal.clipAction(clip);
          currentActionOriginal.play();
        }
        if (mixerFinal) {
          if (currentActionFinal) currentActionFinal.stop();
          currentActionFinal = mixerFinal.clipAction(clip);
          currentActionFinal.play();
        }

        status.innerText = `Lecture en cours : ${file.name}`;
        status.style.color = '#4CAF50';
      };

      const onError = (e) => {
        status.innerText = `Erreur de chargement.`;
        status.style.color = '#ff5555';
        console.error(e);
      };

      if (ext === 'fbx') {
        const loader = new FBXLoader();
        loader.load(url, onLoadAnim, undefined, onError);
      } else {
        const loader = new GLTFLoader();
        loader.load(url, onLoadAnim, undefined, onError);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixerOriginal) mixerOriginal.update(delta);
      if (mixerFinal) mixerFinal.update(delta);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
