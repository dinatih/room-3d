<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mixamo Sandbox V6 (Dynamic Sway)</title>
    <style>
        body { margin: 0; background: #020202; color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.95); padding: 15px; border-radius: 10px; border: 1px solid #444; width: 320px; z-index: 10; max-height: 95vh; overflow-y: auto; }
        h3 { margin: 0 0 10px 0; color: #00ffaa; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px; }
        select, button { width: 100%; margin: 5px 0; padding: 10px; background: #111; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
        .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 0.9em; }
        .stats { margin-top: 15px; font-size: 0.8em; color: #888; border-top: 1px solid #333; padding-top: 10px; }
        #hips-debug { font-family: monospace; color: #00ffaa; margin-top: 5px; font-size: 1.1em; text-align: center; }
    </style>
</head>
<body>

<div id="ui">
    <h3>Mixamo Sandbox V6</h3>
    
    <label style="font-size: 0.8em; color: #aaa;">Model:</label>
    <select id="model-select">
        <option value="media/sandbox/x_bot.glb">X Bot (Source 180cm)</option>
        <option value="media/sandbox/y_bot.glb">Y Bot (Source 170cm)</option>
    </select>

    <label style="font-size: 0.8em; color: #aaa;">Animation:</label>
    <select id="anim-select" size="10"></select>

    <div class="row">
        <span>Visual Skeleton:</span>
        <input type="checkbox" id="show-bones" checked>
    </div>

    <div class="row">
        <span>Neutralize Drift (In-Place):</span>
        <input type="checkbox" id="lock-hips" checked>
    </div>

    <button id="reset-pose">RESET T-POSE</button>

    <div class="stats">
        Hips Local Position (Live):
        <div id="hips-debug">0.00, 0.00, 0.00</div>
        <div id="log" style="color: #ff5555; margin-top: 5px;"></div>
    </div>
</div>

<div id="canvas-container"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const ANIMS = ['anim_angry_gesture.glb', 'anim_ascending_stairs.glb', 'anim_asking_question.glb', 'anim_beckoning.glb', 'anim_catwalk_sequence_01.glb', 'anim_catwalk_sequence_02.glb', 'anim_catwalk_sequence_03.glb', 'anim_catwalk_sequence_04.glb', 'anim_catwalk_sequence_05.glb', 'anim_cheering_while_sitting.glb', 'anim_clapping.glb', 'anim_closing.glb', 'anim_crawl_backwards_in_prone.glb', 'anim_descending_stairs.glb', 'anim_dig_and_plant_seeds.glb', 'anim_disappointed.glb', 'anim_double_leg_takedown___attacker.glb', 'anim_drinking_fountain.glb', 'anim_finding.glb', 'anim_gaming.glb', 'anim_hanging_idle.glb', 'anim_happy_walk.glb', 'anim_happy_walk_backward.glb', 'anim_having_a_meeting_female.glb', 'anim_having_a_meeting_male.glb', 'anim_jumping_jacks.glb', 'anim_laying_seizure.glb', 'anim_laying_severe_cough.glb', 'anim_left_turn.glb', 'anim_looking_through_files_low.glb', 'anim_martelo_do_chau_sem_mao.glb', 'anim_one_shoulder_lean.glb', 'anim_pick_fruit.glb', 'anim_plant_a_plant.glb', 'anim_plant_tree.glb', 'anim_pointing.glb', 'anim_pulled_from_seat.glb', 'anim_pull_pilot_from_seat.glb', 'anim_pull_plant.glb', 'anim_rapping.glb', 'anim_right_turn.glb', 'anim_rummaging.glb', 'anim_scared.glb', 'anim_searching_pockets.glb', 'anim_seated_idle.glb', 'anim_sitting_drinking.glb', 'anim_sitting_talking.glb', 'anim_skinning_test.glb', 'anim_stand_up.glb', 'anim_standing_arguing.glb', 'anim_surprised.glb', 'anim_swing_into_wall.glb', 'anim_t_pose.glb', 'anim_talking.glb', 'anim_talking_at_watercooler.glb', 'anim_talking_on_a_cell_phone.glb', 'anim_talking_on_phone.glb', 'anim_telling_a_secret.glb', 'anim_tonic_seizure.glb', 'anim_tripping.glb', 'anim_victory.glb', 'anim_walking.glb', 'anim_watering.glb', 'anim_wheelbarrow_walk_turn.glb', 'anim_wheelchair.glb', 'anim_writing.glb', 'anim_yelling.glb'];

    const sel = document.getElementById('anim-select');
    ANIMS.forEach(f => {
        const opt = document.createElement('option');
        opt.value = 'media/sandbox/' + f;
        opt.innerText = f.replace('anim_', '').replace('.glb', '').replace(/_/g, ' ');
        sel.appendChild(opt);
    });
    sel.value = 'media/sandbox/anim_happy_walk.glb';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020202);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(250, 160, 450);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 90, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dl = new THREE.DirectionalLight(0xffffff, 1.5);
    dl.position.set(100, 300, 100);
    dl.castShadow = true;
    scene.add(dl);
    scene.add(new THREE.GridHelper(1000, 100, 0x333333, 0x111111));

    const loader = new GLTFLoader();
    let currentModel = null, currentHelper = null, mixer = null, restState = new Map();

    async function loadModel(path) {
        if (currentModel) scene.remove(currentModel);
        if (currentHelper) scene.remove(currentHelper);
        const gltf = await loader.loadAsync(path);
        currentModel = gltf.scene;
        scene.add(currentModel);
        restState.clear();
        currentModel.traverse(o => {
            if (o.isMesh) { o.castShadow = o.receiveShadow = true; if (o.material) o.material.alphaMode = "OPAQUE"; }
            if (o.isBone) restState.set(o.name, { pos: o.position.clone(), quat: o.quaternion.clone() });
        });
        updateBonesVisibility();
        if (sel.value) loadAnimation(sel.value);
    }

    async function loadAnimation(path) {
        if (!currentModel) return;
        if (mixer) mixer.stopAllAction();
        
        try {
            const gltf = await loader.loadAsync(path);
            const rawClip = gltf.animations[0];
            if (!rawClip) return;

            const tracks = [];
            const inPlace = document.getElementById('lock-hips').checked;
            const hipsRest = restState.get('mixamorig_Hips');
            const restPos = hipsRest?.pos || new THREE.Vector3(0, 95, 0);

            for (const track of rawClip.tracks) {
                let tname = track.name;
                const dot = tname.lastIndexOf('.'); if (dot < 0) continue;
                let bPart = tname.substring(0, dot);
                const pPart = tname.substring(dot);
                const sep = Math.max(bPart.lastIndexOf('|'), bPart.lastIndexOf(':'), bPart.lastIndexOf('/'));
                if (sep >= 0) bPart = bPart.substring(sep + 1);
                
                let pure = bPart.replace('mixamorig_', '').replace('mixamorig:', '').replace('mixamorig', '');
                if (pure === '' || pure.toLowerCase().includes('hips')) pure = 'Hips';
                
                // --- CAPTURE SWAY FROM ROOT ---
                // If animation has a track for the root/armature itself, we apply it to Hips!
                if (bPart.toLowerCase().includes('rootjoint') || bPart.toLowerCase().includes('armature')) {
                    if (pPart === '.position') { pure = 'Hips'; }
                    else if (pPart === '.quaternion') { pure = 'Hips'; }
                    else continue;
                }

                const target = 'mixamorig_' + pure;
                if (pPart === '.scale') continue;
                if (pPart === '.position' && pure !== 'Hips') continue;

                const cloned = track.clone();
                cloned.name = target + pPart;

                // --- GAIT SWAY RECONSTRUCTION ---
                if (pure === 'Hips' && pPart === '.position') {
                    const v = cloned.values;
                    const fX = v[0], fY = v[1], fZ = v[2];
                    
                    for (let i = 0; i < v.length; i += 3) {
                        const dx = v[i] - fX;
                        const dy = v[i + 1] - fY;
                        const dz = v[i + 2] - fZ;

                        // Lateral Sway (X) & Bobbing (Y) - Always 100x from meters
                        v[i] = restPos.x + (dx * 100);
                        v[i + 1] = restPos.y + (dy * 100);
                        
                        // DRIFT (Z)
                        if (inPlace) {
                            // Only allow small Z swaying (< 20cm), lock long drift
                            if (Math.abs(dz * 100) > 30) v[i + 2] = restPos.z;
                            else v[i + 2] = restPos.z + (dz * 100);
                        } else {
                            v[i + 2] = restPos.z + (dz * 100);
                        }
                    }
                }
                tracks.push(cloned);
            }
            // Use character root as mixer base
            const root = currentModel.getObjectByName('mixamo_armature') || currentModel;
            mixer = new THREE.AnimationMixer(root);
            mixer.clipAction(new THREE.AnimationClip("sandbox", rawClip.duration, tracks)).play();
        } catch (e) { console.warn(e); }
    }

    function updateBonesVisibility() {
        if (currentHelper) scene.remove(currentHelper);
        if (document.getElementById('show-bones').checked && currentModel) {
            currentHelper = new THREE.SkeletonHelper(currentModel);
            currentHelper.material.color.set(0x00ff88);
            scene.add(currentHelper);
        }
    }

    document.getElementById('model-select').addEventListener('change', e => loadModel(e.target.value));
    sel.addEventListener('change', e => loadAnimation(e.target.value));
    document.getElementById('show-bones').addEventListener('change', updateBonesVisibility);
    document.getElementById('lock-hips').addEventListener('change', () => loadAnimation(sel.value));
    document.getElementById('reset-pose').addEventListener('click', () => {
        if (mixer) mixer.stopAllAction();
        currentModel.traverse(o => { if (o.isBone && restState.has(o.name)) { const s = restState.get(o.name); o.position.copy(s.pos); o.quaternion.copy(s.quat); } });
    });

    const clock = new THREE.Clock();
    const debugEl = document.getElementById('hips-debug');
    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        if (mixer) mixer.update(dt);
        
        if (currentModel) {
            const hips = currentModel.getObjectByName('mixamorig_Hips');
            if (hips) {
                debugEl.innerText = `${hips.position.x.toFixed(2)}, ${hips.position.y.toFixed(2)}, ${hips.position.z.toFixed(2)}`;
            }
        }
        renderer.render(scene, camera);
    }
    loadModel('media/sandbox/x_bot.glb');
    animate();
</script>
</body>
</html>
