<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lara Comparison - 7 Variations</title>
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
  <style>
    /* Force font loading */
    .font-loader { font-family: 'Graduate'; position: absolute; visibility: hidden; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1a1a1f; color: #e0e0e8; }
    #view { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
      padding: 15px; border-radius: 8px; font-size: 13px; line-height: 1.5;
      pointer-events: none; border: 1px solid #444;
    }
    .red { color: #ff4444; font-weight: bold; }
    .vivid { color: #ff0000; text-shadow: 0 0 5px #f00; font-weight: bold; }
    .white { color: #ffffff; font-weight: bold; }
    .blue { color: #4488ff; font-weight: bold; }
    #mesh-control {
      position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8);
      padding: 15px; border-radius: 8px; font-size: 11px; max-height: 90vh;
      overflow-y: auto; border: 1px solid #444; color: #ccc; width: 220px;
    }
    #mesh-control h4 { margin: 0 0 10px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 5px; }
    .mesh-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; cursor: pointer; }
    .mesh-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .mesh-item input { cursor: pointer; }
  </style>
</head>
<body>
  <div class="font-loader">BULLS 66</div>
  <div id="view"></div>
  <div id="hud">
    <h3>Lara <span class="red">Comparison View</span></h3>
    <p>1: Native | 2: <span class="red">Rosanna</span> | 3: <span class="white">Marissa</span> | 4: <span class="gold">Delphina</span> | 5: Sara | 6: <span style="color: #bc9c74">Cha</span> | 7: <span class="vivid">Vivid</span></p>
    <p>Comparing 7 custom variations.</p>
  </div>
  <div id="mesh-control">
    <h4>Meshes Visibility</h4>
    <div id="mesh-list"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const viewEl = document.getElementById('view');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(0, 200, 1000);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 100, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(100, 200, 100);
    scene.add(sun);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    const meshListEl = document.getElementById('mesh-list');
    const meshVisibility = new Map(); // name -> boolean
    const allModels = [];

    function getCleanName(name) {
      if (!name) return "Unnamed";
      // '5_BackPack_1.0_0_0' -> 'BackPack'
      // '5_+Head|Glasses_1.0_0_0' -> 'Glasses'
      let clean = name;
      if (clean.includes('|')) clean = clean.split('|').pop();
      clean = clean.replace(/^[0-9_+ -]+/, ''); // Remove leading garbage
      clean = clean.replace(/_[0-9._]+$/, '');  // Remove trailing versioning
      return clean || name;
    }

    function updateMeshListUI() {
      const sortedEntries = Array.from(meshVisibility.entries()).sort((a, b) => a[1].label.localeCompare(b[1].label));
      meshListEl.innerHTML = '';
      sortedEntries.forEach(([key, info]) => {
        const div = document.createElement('div');
        div.className = 'mesh-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = info.visible;
        checkbox.onchange = (e) => {
          info.visible = e.target.checked;
          applyMeshVisibility(key, e.target.checked);
        };
        const label = document.createElement('span');
        label.textContent = info.label;
        label.title = key; // Show full technical name on hover
        label.style.opacity = info.visible ? '1' : '0.5';
        div.onclick = () => checkbox.click();
        checkbox.onclick = (e) => e.stopPropagation();
        div.appendChild(checkbox);
        div.appendChild(label);
        meshListEl.appendChild(div);
      });
    }

    function applyMeshVisibility(meshName, visible) {
      allModels.forEach(model => {
        model.traverse(node => {
          if (node.isMesh && node.name === meshName) {
            node.visible = visible;
          }
        });
      });
    }

    function createNameLabel(text, color = '#ffffff') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      if (ctx.roundRect) ctx.roundRect(0, 0, 512, 128, 20);
      else ctx.rect(0, 0, 512, 128);
      ctx.fill();
      ctx.font = 'bold 60px system-ui';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);
      
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(100, 25, 1);
      return sprite;
    }

    function processModel(model, style) {
      const isVivid = style === 'vivid';
      const isNative = style === 'native';
      const isRosanna = style === 'rosanna';
      const isMarissa = style === 'marissa';
      const isDelphina = style === 'delphina';
      const isSara = style === 'sara';
      const isCha = style === 'cha';

      model.traverse(node => {
        if (node.isMesh) {
          const originalMat = node.material;
          const meshName = node.name.toLowerCase();
          const matName = (originalMat && originalMat.name) ? originalMat.name.toLowerCase() : "";

          // Track unique mesh names for global visibility control
          if (!meshVisibility.has(node.name)) {
            const label = getCleanName(originalMat ? originalMat.name : node.name);
            // HIDE eye2 by default as requested
            const isEye2 = meshName.includes('eye2') || matName.includes('eye2');
            meshVisibility.set(node.name, { label: label, visible: !isEye2 });
            updateMeshListUI();
          }

          // Apply visibility from global state
          node.visible = meshVisibility.get(node.name).visible;

          // Clone material to avoid sharing between models
          node.material = node.material.clone();
          
          const mat = node.material;

          const isHand = matName.includes('hand') || matName.includes('finger') || meshName.includes('hand') || meshName.includes('finger');
          const isSkin = matName.includes('skin') || matName.includes('face') || matName.includes('head') || matName.includes('body') || matName.includes('arm') || matName.includes('leg') || isHand;
          const isHair = matName.includes('hair') || matName.includes('pony') || matName.includes('braid') || meshName.includes('hair') || meshName.includes('pony') || meshName.includes('braid');
          const isLash = matName.includes('lash');
          const isEye  = matName.includes('eye') && !isLash;
          const isClothing = matName.includes('top') || matName.includes('shirt') || matName.includes('short') || matName.includes('pant') || matName.includes('boot') || matName.includes('gear') || matName.includes('bag') || matName.includes('pack') || matName.includes('belt') || matName.includes('holster');
          const isGlasses = matName.includes('lens') || meshName.includes('lens') || matName.includes('glass') || meshName.includes('glass') || matName.includes('frame') || meshName.includes('frame');
          const isMouth = matName.includes('mouth') || matName.includes('teeth') || matName.includes('tongue');

          // HIDE GLASSES for Delphina and Marissa
          if ((isDelphina || isMarissa) && isGlasses && !isClothing && !isSkin && !isHair && !isEye && !isLash) {
             node.visible = false;
             return;
          }

          // UNIVERSAL FIX: Force OPAQUE by default
          mat.transparent = false;
          mat.depthWrite = true;
          mat.alphaTest = 0;

          if (isHair || isLash || matName.includes('trans')) {
            mat.transparent = true;
            mat.alphaTest = 0.5;
            mat.side = THREE.DoubleSide;
          }

          // HAIR COLORING
          if (isHair) {
            if (isDelphina) {
               mat.map = null; // Kill dark texture to see blonde
               mat.color.setHex(0xffe08a); 
               mat.emissive.setHex(0xffe08a);
               mat.emissiveIntensity = 0.2;
            } else if (isVivid) {
               mat.color.setHex(0xff0000);
               mat.emissive.setHex(0xff0000);
               mat.emissiveIntensity = 0.1;
             } else if (isSara) {
                if (matName.includes('hair.classic')) {
                  mat.map = null; // Kill dark texture to see red
                  mat.color.setHex(0xff0000); // Red
                  mat.emissive.setHex(0xff0000);
                  mat.emissiveIntensity = 0.05;
                }
            } else if (isCha) {
               mat.map = null; // Kill dark texture to see blonde-chatain
               mat.color.setHex(0xbc9c74); // Blonde-chatain
               mat.emissive.setHex(0xbc9c74);
               mat.emissiveIntensity = 0.05;
            }
          }

          // CLOTHING COLOR-IFICATION
          if (!isNative) {
            const isTop = matName.includes('top') || matName.includes('shirt') || matName.includes('tank') || meshName.includes('shirt');
            const isShorts = matName.includes('short') || matName.includes('pant') || meshName.includes('short');
            const isBackpack = matName.includes('backpack') || matName.includes('bag') || matName.includes('pack');
            const isOtherClothing = matName.includes('boot') || 
                                    matName.includes('gear') || matName.includes('holster') || matName.includes('belt') ||
                                    matName.includes('vest') || matName.includes('glove') || isBackpack;

            const shouldColor = !isSkin && !isEye && !isLash && !isMouth && !isHair;

            if (shouldColor) {
              let color = 0xcc0000; // Brighter default red
              let forceProcedural = false;
              
              if (isRosanna) {
                 if (isShorts) {
                   color = 0xa2c4d9; // Blue jean
                   forceProcedural = true;
                 }
                 else if (isTop || isBackpack) color = 0xff2222; // Red
              } else if (isMarissa) {
                 if (isShorts) {
                   color = 0xa2c4d9; 
                   forceProcedural = true;
                 } else {
                   color = 0xffffff; 
                   forceProcedural = true; // Force procedural white to ignore teal texture
                 }
              } else if (isDelphina) {
                 color = 0xffffff; 
                 forceProcedural = true; // Force all-white
              } else if (isSara) {
                 color = 0x050505; // Deep black
                 forceProcedural = true; // Avoid texture details for pure black look
              } else if (isCha) {
                 if (isShorts) {
                   color = 0x151515; // Black jean
                   forceProcedural = true;
                 } else if (isTop) {
                   color = 0x0044cc; // Superman blue
                   forceProcedural = true;
                 } else {
                   color = 0x151515; // Black boots / gear
                   forceProcedural = true;
                 }
              } else {
                // Vivid Red
                const redColor = 0xff0000;
                const gearColor = 0x990000;
                const isGear = matName.includes('gear') || matName.includes('holster') || matName.includes('boot');
                color = isGear ? gearColor : redColor;
              }

              const useMap = mat.map && !forceProcedural;

              if (useMap) {
                 mat.color.setHex(color);
                 if (isVivid) {
                   mat.emissive = new THREE.Color(color);
                   mat.emissiveIntensity = 0.35;
                 }
                 if (isRosanna && isTop) {
                    mat.roughness = 0.5;
                    mat.metalness = 0.0;
                    mat.emissive = new THREE.Color(0xff0000);
                    mat.emissiveIntensity = 0.01;

                    // BULLS 66 Text
                    const canvas = document.createElement('canvas');
                    canvas.width = 1024; canvas.height = 1024;
                    const ctx = canvas.getContext('2d');
                    if (mat.map && mat.map.image) ctx.drawImage(mat.map.image, 0, 0, 1024, 1024);
                    ctx.fillStyle = 'black'; ctx.textAlign = 'center';
                    
                    // X=700 comme demandé
                    ctx.font = '900 80px Graduate';
                    ctx.fillText('BULLS', 700, 750);
                    ctx.font = '900 150px Graduate';
                    ctx.fillText('66', 700, 870);
                    
                    const newTex = new THREE.CanvasTexture(canvas);
                    newTex.flipY = false;
                    newTex.colorSpace = THREE.SRGBColorSpace;
                    mat.map = newTex;
                    mat.needsUpdate = true;
                 }
              } else {
                // Procedural material for jeans, white, black
                node.material = new THREE.MeshStandardMaterial({
                  color: color,
                  emissive: (isVivid || (isRosanna && isTop)) ? new THREE.Color(color === 0x050505 ? 0 : color) : new THREE.Color(0,0,0),
                  emissiveIntensity: isVivid ? 0.5 : ((isRosanna && isTop) ? 0.05 : 0),
                  roughness: (isRosanna || isMarissa || isDelphina || isSara) ? 0.9 : (isVivid ? 0.1 : 0.25),
                  metalness: (isRosanna || isMarissa || isDelphina || isSara) ? 0.0 : (isVivid ? 0.3 : 0.1),
                  transparent: isHair,
                  alphaTest: isHair ? 0.5 : 0,
                  depthWrite: true,
                  name: style + 'Material'
                });
              }
            }
          }
        }
      });
    }

    const SPACING = 150;

    document.fonts.ready.then(() => {
      const variants = [
        { id: 'native', label: 'Native',  offset: -3, color: '#aaa' },
        { id: 'rosanna', label: 'Rosanna', offset: -2, color: '#ff4444' },
        { id: 'marissa', label: 'Marissa', offset: -1, color: '#ffffff' },
        { id: 'delphina',label: 'Delphina',offset: 0,  color: '#ffd700' },
        { id: 'sara',    label: 'Sara',    offset: 1,  color: '#888' },
        { id: 'cha',     label: 'Cha',     offset: 2,  color: '#bc9c74' },
        { id: 'vivid',   label: 'Vivid',   offset: 3,  color: '#ff0000' },
      ];

      variants.forEach(v => {
        const file = v.id === 'native' ? 'media/sandbox/lara_native.glb' : 
                     v.id === 'vivid' ? 'media/sandbox/vivid_red_lara_native.glb' :
                     v.id === 'rosanna' ? 'media/sandbox/rosanna_lara_native.glb' :
                     'media/sandbox/lara_native.glb';

        loader.load(file, (gltf) => {
          const model = gltf.scene;
          allModels.push(model);
          const x = v.offset * SPACING;
          model.position.x = x;
          scene.add(model);
          processModel(model, v.id);

          // Add name label
          const label = createNameLabel(v.label, v.color);
          label.position.set(x, 215, 0);
          scene.add(label);
        });
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
