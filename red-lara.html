<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lara Comparison - 7 Variations</title>
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
  <style>
    /* Force font loading */
    .font-loader { font-family: 'Graduate'; position: absolute; visibility: hidden; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1a1a1f; color: #e0e0e8; }
    #view { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 10px; left: 10px; 
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 13px; line-height: 1.5;
      pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .red { color: #ff4444; font-weight: bold; }
    .vivid { color: #ff0000; text-shadow: 0 0 5px #f00; font-weight: bold; }
    .white { color: #ffffff; font-weight: bold; }
    .blue { color: #4488ff; font-weight: bold; }
    #mesh-control {
      position: absolute; top: 10px; right: 10px; 
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 11px; max-height: 90vh;
      overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; width: 220px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    #mesh-control h4 { margin: 0 0 10px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 5px; font-size: 13px; }
    .mesh-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; cursor: pointer; }
    .mesh-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .mesh-item input { cursor: pointer; }

    #anim-control {
      position: absolute; top: 180px; left: 10px; 
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px; border-radius: 12px; font-size: 12px; max-height: calc(100vh - 210px);
      overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; width: 230px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
    }
    #anim-control h4 { margin: 0 0 12px; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; font-size: 14px; }
    .anim-item { 
      display: block; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; border-radius: 6px; 
      border: 1px solid rgba(255,255,255,0.03); background: rgba(255,255,255,0.01); 
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .anim-item:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); transform: translateX(2px); }
    .anim-item.active { 
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.25) 0%, rgba(255, 68, 68, 0.1) 100%); 
      border-color: rgba(255, 68, 68, 0.5); color: #ff6666; font-weight: bold; 
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.15);
    }
    .anim-btn {
      flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.15); 
      background: rgba(255,255,255,0.05); color: #eee; border-radius: 6px; 
      cursor: pointer; font-weight: 600; font-size: 11px;
      transition: all 0.2s ease;
    }
    .anim-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .anim-btn-primary {
      border: 1px solid rgba(255, 68, 68, 0.4);
      background: rgba(255, 68, 68, 0.15);
      color: #ff6666;
    }
    .anim-btn-primary:hover {
      background: rgba(255, 68, 68, 0.25);
      border-color: rgba(255, 68, 68, 0.6);
      color: #ff8888;
    }
  </style>
</head>
<body>
  <div class="font-loader">BULLS 66</div>
  <div id="view"></div>
  <div id="hud">
    <h3>Lara <span class="red">Comparison View</span></h3>
    <p>1: Native | 2: <span class="red">Rosanna</span> | 3: <span class="white">Marissa</span> | 4: <span class="gold">Delphina</span> | 5: Sara | 6: <span style="color: #bc9c74">Cha</span> | 7: <span class="vivid">Vivid</span> | 8: <span style="color: #ffd700">Sabira</span> | 9: <span style="color: #e2d6bd">Safa</span> | 10: <span style="color: #5f6e4b">Rajaa</span></p>
    <p>Comparing 10 custom variations.</p>
  </div>
  <div id="mesh-control">
    <h4>Meshes Visibility</h4>
    <div id="mesh-list"></div>
  </div>
  <div id="anim-control">
    <h4>Animations</h4>
    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
      <button id="btn-play-pause" class="anim-btn anim-btn-primary">Pause</button>
      <button id="btn-stop" class="anim-btn">Stop</button>
    </div>
    <div style="margin-bottom: 12px; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 500;">
        <span>Vitesse:</span>
        <span id="speed-val" style="color: #ff6666; font-weight: bold;">1.0x</span>
      </div>
      <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="1.0" style="width: 100%; cursor: pointer; accent-color: #ff4444; margin: 0; display: block;">
    </div>
    <div id="anim-list" style="overflow-y: auto; flex: 1;"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const viewEl = document.getElementById('view');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(50, 180, 1050);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(50, 100, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(100, 200, 100);
    scene.add(sun);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    const meshListEl = document.getElementById('mesh-list');
    const meshVisibility = new Map(); // name -> boolean
    const allModels = [];
    window.allModels = allModels;

    function getCleanName(name) {
      if (!name) return "Unnamed";
      // '5_BackPack_1.0_0_0' -> 'BackPack'
      // '5_+Head|Glasses_1.0_0_0' -> 'Glasses'
      let clean = name;
      if (clean.includes('|')) clean = clean.split('|').pop();
      clean = clean.replace(/^[0-9_+ -]+/, ''); // Remove leading garbage
      clean = clean.replace(/_[0-9._]+$/, '');  // Remove trailing versioning
      return clean || name;
    }

    function updateMeshListUI() {
      const sortedEntries = Array.from(meshVisibility.entries()).sort((a, b) => a[1].label.localeCompare(b[1].label));
      meshListEl.innerHTML = '';
      sortedEntries.forEach(([key, info]) => {
        const div = document.createElement('div');
        div.className = 'mesh-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = info.visible;
        checkbox.onchange = (e) => {
          info.visible = e.target.checked;
          applyMeshVisibility(key, e.target.checked);
        };
        const label = document.createElement('span');
        label.textContent = info.label;
        label.title = key; // Show full technical name on hover
        label.style.opacity = info.visible ? '1' : '0.5';
        div.onclick = () => checkbox.click();
        checkbox.onclick = (e) => e.stopPropagation();
        div.appendChild(checkbox);
        div.appendChild(label);
        meshListEl.appendChild(div);
      });
    }

    function applyMeshVisibility(meshName, visible) {
      allModels.forEach(model => {
        model.traverse(node => {
          if (node.isMesh && node.name === meshName) {
            node.visible = visible;
          }
        });
      });
    }

    function createNameLabel(text, color = '#ffffff') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      if (ctx.roundRect) ctx.roundRect(0, 0, 512, 128, 20);
      else ctx.rect(0, 0, 512, 128);
      ctx.fill();
      ctx.font = 'bold 60px system-ui';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);
      
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(100, 25, 1);
      return sprite;
    }

    function processModel(model, style) {
      const isVivid = style === 'vivid';
      const isNative = style === 'native';
      const isRosanna = style === 'rosanna';
      const isMarissa = style === 'marissa';
      const isDelphina = style === 'delphina';
      const isSara = style === 'sara';
      const isCha = style === 'cha';
      const isSabira = style === 'sabira';
      const isSafa = style === 'safa';
      const isRajaa = style === 'rajaa';

      model.traverse(node => {
        if (node.isMesh) {
          const originalMat = node.material;
          const meshName = node.name.toLowerCase();
          const matName = (originalMat && originalMat.name) ? originalMat.name.toLowerCase() : "";

          // Track unique mesh names for global visibility control
          if (!meshVisibility.has(node.name)) {
            const label = getCleanName(originalMat ? originalMat.name : node.name);
            // HIDE eye2 by default as requested
            const isEye2 = meshName.includes('eye2') || matName.includes('eye2');
            meshVisibility.set(node.name, { label: label, visible: !isEye2 });
            updateMeshListUI();
          }

          // Apply visibility from global state
          node.visible = meshVisibility.get(node.name).visible;

          // Clone material to avoid sharing between models
          node.material = node.material.clone();
          
          const mat = node.material;

          const isHand = matName.includes('hand') || matName.includes('finger') || meshName.includes('hand') || meshName.includes('finger');
          const isSkin = matName.includes('skin') || matName.includes('face') || matName.includes('head') || matName.includes('body') || matName.includes('arm') || matName.includes('leg') || isHand;
          const isHair = matName.includes('hair') || matName.includes('pony') || matName.includes('braid') || meshName.includes('hair') || meshName.includes('pony') || meshName.includes('braid');
          const isLash = matName.includes('lash');
          const isEye  = matName.includes('eye') && !isLash;
          const isClothing = matName.includes('top') || matName.includes('shirt') || matName.includes('short') || matName.includes('pant') || matName.includes('boot') || matName.includes('gear') || matName.includes('bag') || matName.includes('pack') || matName.includes('belt') || matName.includes('holster');
          const isGlasses = matName.includes('lens') || matName.includes('glass') || matName.includes('frame');
          const isMouth = matName.includes('mouth') || matName.includes('teeth') || matName.includes('tongue');

          // HIDE GLASSES for Delphina, Marissa, Cha, Sabira, Safa, Rajaa
          if ((isDelphina || isMarissa || isCha || isSabira || isSafa || isRajaa) && isGlasses) {
             mat.visible = false;
          }

          // UNIVERSAL FIX: Force OPAQUE by default
          mat.transparent = false;
          mat.depthWrite = true;
          mat.alphaTest = 0;

          if (isHair || isLash || matName.includes('trans')) {
            mat.transparent = true;
            mat.alphaTest = 0.5;
            mat.side = THREE.DoubleSide;
          }

          // HAIR COLORING
          if (isHair) {
            if (isDelphina) {
               mat.map = null; // Kill dark texture to see blonde
               mat.color.setHex(0xffe08a); 
               mat.emissive.setHex(0xffe08a);
               mat.emissiveIntensity = 0.2;
            } else if (isVivid) {
               mat.color.setHex(0xff0000);
               mat.emissive.setHex(0xff0000);
               mat.emissiveIntensity = 0.1;
            } else if (isSara) {
                if (matName.includes('hair.classic')) {
                  mat.map = null; // Kill dark texture to see red
                  mat.color.setHex(0xff0000); // Red
                  mat.emissive.setHex(0xff0000);
                  mat.emissiveIntensity = 0.05;
                } else {
                  mat.map = null;
                  mat.color.setHex(0x0a0a0a); // Deep black
                  mat.emissive.setHex(0x000000);
                  mat.emissiveIntensity = 0;
                }
            } else if (isCha) {
               mat.map = null; // Kill dark texture to see blonde-chatain
               mat.color.setHex(0xbc9c74); // Blonde-chatain
               mat.emissive.setHex(0xbc9c74);
               mat.emissiveIntensity = 0.05;
            }
          }

          // EYE COLORING
          const isEyesMaterial = matName.includes('eyes') && !matName.includes('lash');
          if (isEyesMaterial) {
             if (isDelphina) {
                const loader = new THREE.TextureLoader();
                const blueTex = loader.load('media/textures/8003_blue.png');
                blueTex.flipY = false;
                blueTex.colorSpace = THREE.SRGBColorSpace;
                mat.map = blueTex;
                mat.needsUpdate = true;
             } else if (isCha) {
                const loader = new THREE.TextureLoader();
                const greenTex = loader.load('media/textures/8003_green.png');
                greenTex.flipY = false;
                greenTex.colorSpace = THREE.SRGBColorSpace;
                mat.map = greenTex;
                mat.needsUpdate = true;
             }
          }

          // TEXTURE REPLACEMENTS FOR CHA (SUPERMAN TOP, RED BOOTS, GOLDEN SOCKS) & RAJAA (CAMOUFLAGE)
          const isShirt = matName.toLowerCase().includes('shirt');
          const isBoot = matName.toLowerCase().includes('boot');
          const isShorts = matName.toLowerCase().includes('short') || matName.toLowerCase().includes('pant') || meshName.toLowerCase().includes('short');
          if (isCha) {
             console.log("Cha Material:", matName, "isBoot:", isBoot, "isShirt:", isShirt);
             if (isShirt) {
                const loader = new THREE.TextureLoader();
                const shirtTex = loader.load('media/textures/8019_cha.png?t=' + Date.now());
                shirtTex.flipY = false;
                shirtTex.colorSpace = THREE.SRGBColorSpace;
                mat.map = shirtTex;
                mat.needsUpdate = true;
             }
             if (isBoot) {
                const loader = new THREE.TextureLoader();
                const bootsTex = loader.load('media/textures/8016_cha.png?t=' + Date.now());
                bootsTex.flipY = false;
                bootsTex.colorSpace = THREE.SRGBColorSpace;
                mat.map = bootsTex;
                mat.needsUpdate = true;
             }
          }
          if (isRajaa) {
             if (isShirt) {
                const loader = new THREE.TextureLoader();
                const shirtTex = loader.load('media/textures/8019_rajaa.png?t=' + Date.now());
                shirtTex.flipY = false;
                shirtTex.colorSpace = THREE.SRGBColorSpace;
                mat.map = shirtTex;
                mat.needsUpdate = true;
             }
             if (isShorts) {
                const loader = new THREE.TextureLoader();
                const shortsTex = loader.load('media/textures/8031_rajaa.png?t=' + Date.now());
                shortsTex.flipY = false;
                shortsTex.colorSpace = THREE.SRGBColorSpace;
                mat.map = shortsTex;
                mat.needsUpdate = true;
             }
          }

          // CLOTHING COLOR-IFICATION
          if (!isNative) {
            const isTop = matName.toLowerCase().includes('top') || matName.toLowerCase().includes('shirt') || matName.toLowerCase().includes('tank') || meshName.toLowerCase().includes('shirt');
            const isBackpack = matName.toLowerCase().includes('backpack') || matName.toLowerCase().includes('bag') || matName.toLowerCase().includes('pack');
            const isOtherClothing = matName.toLowerCase().includes('boot') || 
                                    matName.toLowerCase().includes('gear') || matName.toLowerCase().includes('holster') || matName.toLowerCase().includes('belt') ||
                                    matName.toLowerCase().includes('vest') || matName.toLowerCase().includes('glove') || isBackpack;

            const shouldColor = !isSkin && !isEye && !isLash && !isMouth && !isHair && 
                                !(isCha && (isShirt || isBoot)) && 
                                !(isSabira && !isTop) && 
                                !isRajaa;

            if (shouldColor) {
              let color = 0xcc0000; // Brighter default red
              let forceProcedural = false;
              
              if (isRosanna) {
                 if (isShorts) {
                   color = 0xa2c4d9; // Blue jean
                   forceProcedural = true;
                 }
                 else if (isTop || isBackpack) color = 0xff2222; // Red
              } else if (isMarissa) {
                 if (isShorts) {
                   color = 0xa2c4d9; 
                   forceProcedural = true;
                 } else {
                   color = 0xffffff; 
                   forceProcedural = true; // Force procedural white to ignore teal texture
                 }
              } else if (isDelphina) {
                 color = 0xffffff; 
                 forceProcedural = true; // Force all-white
              } else if (isSara) {
                 color = 0x050505; // Deep black
                 forceProcedural = true; // Avoid texture details for pure black look
              } else if (isCha) {
                 if (isShorts) {
                   color = 0xff0000; // Vivid red
                   forceProcedural = true;
                 } else if (isTop) {
                   color = 0x0044cc; // Superman blue
                   forceProcedural = true;
                 } else {
                   color = 0x151515; // Black boots / gear
                   forceProcedural = true;
                 }
              } else if (isSabira) {
                 if (isTop) {
                   color = 0xffd700; // Yellow top
                   forceProcedural = true;
                 }
              } else if (isSafa) {
                 color = 0xe2d6bd; // Beige
                 forceProcedural = true;
              } else {
                // Vivid Red
                const redColor = 0xff0000;
                const gearColor = 0x990000;
                const isGear = matName.includes('gear') || matName.includes('holster') || matName.includes('boot');
                color = isGear ? gearColor : redColor;
              }

              const useMap = mat.map && !forceProcedural;

              if (useMap) {
                 mat.color.setHex(color);
                 if (isVivid) {
                   mat.emissive = new THREE.Color(color);
                   mat.emissiveIntensity = 0.35;
                 }
                 if (isRosanna && isTop) {
                    mat.roughness = 0.5;
                    mat.metalness = 0.0;
                    mat.emissive = new THREE.Color(0xff0000);
                    mat.emissiveIntensity = 0.01;

                    // BULLS 66 Text
                    const canvas = document.createElement('canvas');
                    canvas.width = 1024; canvas.height = 1024;
                    const ctx = canvas.getContext('2d');
                    if (mat.map && mat.map.image) ctx.drawImage(mat.map.image, 0, 0, 1024, 1024);
                    ctx.fillStyle = 'black'; ctx.textAlign = 'center';
                    
                    // X=700 comme demandé
                    ctx.font = '900 80px Graduate';
                    ctx.fillText('BULLS', 700, 750);
                    ctx.font = '900 150px Graduate';
                    ctx.fillText('66', 700, 870);
                    
                    const newTex = new THREE.CanvasTexture(canvas);
                    newTex.flipY = false;
                    newTex.colorSpace = THREE.SRGBColorSpace;
                    mat.map = newTex;
                    mat.needsUpdate = true;
                 }
              } else {
                // Procedural material for jeans, white, black, beige, yellow
                node.material = new THREE.MeshStandardMaterial({
                  color: color,
                  emissive: (isVivid || (isRosanna && isTop)) ? new THREE.Color(color === 0x050505 ? 0 : color) : new THREE.Color(0,0,0),
                  emissiveIntensity: isVivid ? 0.5 : ((isRosanna && isTop) ? 0.05 : 0),
                  roughness: (isRosanna || isMarissa || isDelphina || isSara || isSafa || isSabira) ? 0.9 : (isVivid ? 0.1 : 0.25),
                  metalness: (isRosanna || isMarissa || isDelphina || isSara || isSafa || isSabira) ? 0.0 : (isVivid ? 0.3 : 0.1),
                  transparent: false,
                  alphaTest: isHair ? 0.5 : 0,
                  depthWrite: true,
                  name: style + 'Material'
                });
              }
            }
          }
        }
      });
    }

    // Bone mapping dictionary between Mixamo and Lara 2026 Native
    const MIX_TO_LARA = {
      "mixamorig:Hips": "mixamorig_root_hips",
      "mixamorig:Spine": "mixamorig_spine_lower",
      "mixamorig:Spine2": "mixamorig_spine_upper",
      "mixamorig:Neck": "mixamorig_head_neck_lower",
      "mixamorig:Head": "mixamorig_head_neck_upper",
      "mixamorig:LeftShoulder": "",
      "mixamorig:LeftArm": "mixamorig_arm_left_shoulder_2",
      "mixamorig:LeftForeArm": "mixamorig_arm_left_elbow",
      "mixamorig:LeftHand": "mixamorig_arm_left_wrist",
      "mixamorig:LeftUpLeg": "mixamorig_leg_left_thigh",
      "mixamorig:LeftLeg": "mixamorig_leg_left_knee",
      "mixamorig:LeftFoot": "mixamorig_leg_left_ankle",
      "mixamorig:LeftToeBase": "mixamorig_leg_left_toes",
      "mixamorig:RightShoulder": "",
      "mixamorig:RightArm": "mixamorig_arm_right_shoulder_2",
      "mixamorig:RightForeArm": "mixamorig_arm_right_elbow",
      "mixamorig:RightHand": "mixamorig_arm_right_wrist",
      "mixamorig:RightUpLeg": "mixamorig_leg_right_thigh",
      "mixamorig:RightLeg": "mixamorig_leg_right_knee",
      "mixamorig:RightFoot": "mixamorig_leg_right_ankle",
      "mixamorig:RightToeBase": "mixamorig_leg_right_toes"
    };

    function getLaraBoneName(mixName) {
      let normalized = mixName;
      if (normalized.startsWith('mixamorig')) {
        const base = normalized.replace(/^mixamorig[:_]?/i, '');
        normalized = 'mixamorig:' + base;
      }

      if (MIX_TO_LARA[normalized] !== undefined) {
        return MIX_TO_LARA[normalized];
      }
      
      const fingerMatch = normalized.match(/mixamorig:(Left|Right)Hand(Thumb|Index|Middle|Ring|Pinky)(\d)/i);
      if (fingerMatch) {
        const side = fingerMatch[1].toLowerCase();
        const fingerType = fingerMatch[2];
        const segmentNum = fingerMatch[3];
        
        const fingerIdxMap = { "Thumb": 1, "Index": 2, "Middle": 3, "Ring": 4, "Pinky": 5 };
        const segmentLetterMap = { "1": "a", "2": "b", "3": "c" };
        
        const fIdx = fingerIdxMap[fingerType];
        const segLet = segmentLetterMap[segmentNum];
        
        if (fIdx && segLet) {
          return `mixamorig_arm_${side}_finger_${fIdx}${segLet}`;

    function formatName(fileName) {
      let name = fileName.replace('.glb', '');
      name = name.replace(/_/g, ' ');
      name = name.replace(/,/g, '');
      name = name.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
      return name;
    }

    function retargetMixamoClip(rawClip, targetInstance, animScene) {
      if (!rawClip || !targetInstance) return null;

      const animBones = {};
      if (animScene) {
        animScene.updateMatrixWorld(true);
        animScene.traverse(c => {
          if (c.isBone) {
            const match = c.name.match(/mixamorig[:_]?(.+)/i);
            if (match) {
              animBones[match[1]] = {
                restWorldQuaternion: c.getWorldQuaternion(new THREE.Quaternion()),
                restLocalQuaternion: c.quaternion.clone(),
                parentRestWorldQuaternion: c.parent ? c.parent.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion(),
                defaultPosition: c.position.clone()
              };
            }
          }
        });
      }

      // Deep manual clone of rawClip to avoid shared Float32Array references across calls
      const clonedTracks = [];
      for (const track of rawClip.tracks) {
        const cl = track.clone();
        cl.times = new Float32Array(track.times);
        cl.values = new Float32Array(track.values);
        clonedTracks.push(cl);
      }
      const workingClip = new THREE.AnimationClip(rawClip.name, rawClip.duration, clonedTracks);

      // Detect if translation tracks are in centimeters and scale to meters if needed
      for (const track of workingClip.tracks) {
        if (track.name.endsWith('.position')) {
          const firstVal = new THREE.Vector3(track.values[0], track.values[1], track.values[2]);
          if (firstVal.length() > 5.0) {
            for (let i = 0; i < track.values.length; i++) {
              track.values[i] *= 0.01;
            }
          }
        }
      }

      // Combine both tracks (RootJoint and Hips)
      const rootRotTrackIndex = workingClip.tracks.findIndex(t => t.name.toLowerCase().includes('rootjoint') && t.name.endsWith('.quaternion'));
      const hipsRotTrackIndex = workingClip.tracks.findIndex(t => (t.name.toLowerCase().includes('hips') || t.name.toLowerCase().endsWith('hips.quaternion')) && t.name.endsWith('.quaternion') && !t.name.toLowerCase().includes('rootjoint'));

      if (rootRotTrackIndex !== -1) {
        const rootRotTrack = workingClip.tracks[rootRotTrackIndex];
        
        if (hipsRotTrackIndex !== -1) {
          const hipsRotTrack = workingClip.tracks[hipsRotTrackIndex];
          
          // Combine both tracks
          const timesSet = new Set([...rootRotTrack.times, ...hipsRotTrack.times]);
          const times = Array.from(timesSet).sort((a, b) => a - b);
          
          const values = new Float32Array(times.length * 4);
          
          function evaluateQuaternionTrack(track, t) {
            const trackTimes = track.times;
            const trackValues = track.values;
            if (t <= trackTimes[0]) {
              return new THREE.Quaternion(trackValues[0], trackValues[1], trackValues[2], trackValues[3]);
            }
            if (t >= trackTimes[trackTimes.length - 1]) {
              const idx = (trackTimes.length - 1) * 4;
              return new THREE.Quaternion(trackValues[idx], trackValues[idx+1], trackValues[idx+2], trackValues[idx+3]);
            }
            let i = 0;
            while (i < trackTimes.length - 1 && trackTimes[i+1] < t) {
              i++;
            }
            const t0 = trackTimes[i];
            const t1 = trackTimes[i+1];
            const alpha = (t - t0) / (t1 - t0);
            
            const q0 = new THREE.Quaternion(trackValues[4*i], trackValues[4*i+1], trackValues[4*i+2], trackValues[4*i+3]);
            const q1 = new THREE.Quaternion(trackValues[4*(i+1)], trackValues[4*(i+1)+1], trackValues[4*(i+1)+2], trackValues[4*(i+1)+3]);
            return q0.slerp(q1, alpha);
          }

          for (let i = 0; i < times.length; i++) {
            const t = times[i];
            const qRoot = evaluateQuaternionTrack(rootRotTrack, t);
            const qHips = evaluateQuaternionTrack(hipsRotTrack, t);
            
            // Global rotation = qRoot * qHips
            const qCombined = qRoot.multiply(qHips);
            
            values[4*i] = qCombined.x;
            values[4*i+1] = qCombined.y;
            values[4*i+2] = qCombined.z;
            values[4*i+3] = qCombined.w;
          }
          
          hipsRotTrack.times = new Float32Array(times);
          hipsRotTrack.values = values;
          
          // Remove the rootjoint rotation track so it doesn't get processed separately
          workingClip.tracks.splice(rootRotTrackIndex, 1);
        } else {
          // If no hips rotation track exists, just rename rootjoint rotation track to match Hips naming
          const hipsPosTrack = workingClip.tracks.find(t => t.name.toLowerCase().includes('hips') && !t.name.toLowerCase().includes('rootjoint'));
          let hipsName = 'mixamorig:Hips.quaternion';
          if (hipsPosTrack) {
            hipsName = hipsPosTrack.name.split('.')[0] + '.quaternion';
          }
          rootRotTrack.name = hipsName;
        }
      }

      // Determine height translations scale multiplier dynamically
      let srcHipsDefaultY = 0.991;
      let computedHipsRatio = 100.0;
      for (const tr of workingClip.tracks) {
        const [boneFull, prop] = tr.name.split('.');
        const match = boneFull.match(/mixamorig[:_]?(.+)/i);
        if (match) {
          const baseName = match[1];
          if (prop === 'position' && baseName.toLowerCase() === 'hips') {
            const bone = targetInstance.getObjectByName('mixamorig_root_hips');
            let refSrcY = 0.991;
            if (animBones[baseName]) {
              refSrcY = animBones[baseName].defaultPosition.y;
            }
            if (refSrcY > 5.0) {
              refSrcY *= 0.01;
            }
            srcHipsDefaultY = refSrcY;
            
            let targetHipsHeight = 99.1;
            if (bone && bone.defaultPosition) {
              targetHipsHeight = bone.defaultPosition.z; // since Z is up for Lara
            }
            if (refSrcY > 0) {
              computedHipsRatio = targetHipsHeight / refSrcY;
            }
          }
        }
      }

      const hasRootTranslation = workingClip.tracks.some(t => t.name.toLowerCase().includes('rootjoint') && t.name.endsWith('.position'));
      const tracks = [];

      for (const tr of workingClip.tracks) {
        const [boneFull, prop] = tr.name.split('.');
        
        // Extract the base bone name without prefix
        const match = boneFull.match(/mixamorig[:_]?(.+)/i);
        if (!match) continue; // Skip if it doesn't look like a mixamo bone
        let baseName = match[1];

        if (prop === 'position' && baseName.toLowerCase() === 'hips' && hasRootTranslation) {
          continue;
        }

        let isRootJointTranslation = false;
        if (prop === 'position' && baseName.toLowerCase().includes('rootjoint')) {
          baseName = 'Hips';
          isRootJointTranslation = true;
        }

        let targetBoneName = null;
        const keyName = `mixamorig:${baseName}`;
        targetBoneName = getLaraBoneName(keyName);

        // Mixamo Hips maps directly to mixamorig_root_hips (both position and quaternion)
        if (keyName === 'mixamorig:Hips') {
          targetBoneName = 'mixamorig_root_hips';
        }

        if (targetBoneName) {
          if (prop === 'scale') continue;

          // Only translate the hips position to avoid dismemberment
          const isHips = targetBoneName.toLowerCase().endsWith('hips');
          if (prop === 'position' && !isHips) continue;

          const clone = tr.clone();
          clone.name = `${targetBoneName}.${prop}`;

          // Retarget position for hips
          if (prop === 'position' && isHips) {
            const bone = targetInstance.getObjectByName(targetBoneName);
            if (bone && bone.defaultPosition) {
              let P_src = null;
              if (isRootJointTranslation) {
                P_src = new THREE.Quaternion();
              } else if (animBones[baseName]) {
                P_src = animBones[baseName].parentRestWorldQuaternion;
              } else {
                P_src = new THREE.Quaternion();
              }
              const P_tgt = (bone.parent && bone.parent.restWorldQuaternion)
                ? bone.parent.restWorldQuaternion
                : new THREE.Quaternion();
              const P_tgt_inv = P_tgt.clone().invert();
              
              let srcRestPos = null;
              if (isRootJointTranslation) {
                srcRestPos = new THREE.Vector3(0, 0, 0);
              } else if (animBones[baseName]) {
                srcRestPos = animBones[baseName].defaultPosition.clone();
                if (srcRestPos.length() > 5.0) {
                  srcRestPos.multiplyScalar(0.01);
                }
              } else {
                srcRestPos = new THREE.Vector3(0, srcHipsDefaultY, 0);
              }
              
              const restX = clone.values[0];
              const restY = clone.values[1];
              const restZ = clone.values[2];
              
              let isFlat = true;
              for (let j = 1; j < clone.values.length / 3; j++) {
                if (Math.abs(clone.values[3*j] - restX) > 0.001 ||
                    Math.abs(clone.values[3*j+1] - restY) > 0.001 ||
                    Math.abs(clone.values[3*j+2] - restZ) > 0.001) {
                  isFlat = false;
                  break;
                }
              }

              const animNameLower = (rawClip.name || "").toLowerCase();
              const isWalk = (animNameLower.includes('walk') || 
                              animNameLower.includes('run') || 
                              animNameLower.includes('step') || 
                              animNameLower.includes('stairs')) &&
                             !animNameLower.includes('dance');

              if (isFlat && isWalk) {
                // Reconstruct with 30fps keyframes to inject procedural hips movement
                const duration = workingClip.duration;
                const fps = 30;
                const numFrames = Math.ceil(duration * fps) + 1;
                const newTimes = new Float32Array(numFrames);
                const newValues = new Float32Array(numFrames * 3);
                
                for (let f = 0; f < numFrames; f++) {
                  const t = Math.min(f / fps, duration);
                  newTimes[f] = t;
                  
                  const phase = (t / duration) * 2.0 * Math.PI;
                  
                  const dx = 0.8 * Math.cos(phase); // sway side-to-side (0.8 cm, X)
                  const dy = 0.0; // forward progress cancelled (0.0 cm, Y)
                  const dz = -1.6 * Math.sin(phase * 2.0); // bob up-and-down (1.6 cm, Z)
                  
                  const dP = new THREE.Vector3(dx, dy, dz)
                    .applyQuaternion(P_src)
                    .applyQuaternion(P_tgt_inv);
                  const resPos = bone.defaultPosition.clone().add(dP);
                  
                  newValues[3*f] = resPos.x;
                  newValues[3*f+1] = resPos.y;
                  newValues[3*f+2] = resPos.z;
                }
                
                clone.times = newTimes;
                clone.values = newValues;
              } else {
                for (let j = 0; j < clone.values.length / 3; j++) {
                  let yVal = clone.values[3*j+1];
                  if (isRootJointTranslation && (animNameLower.includes('laying') || animNameLower.includes('sleeping'))) {
                    yVal = 0.12; // Force to ground level (in meters)
                  }
                  const dx = (clone.values[3*j] - srcRestPos.x) * computedHipsRatio;
                  const dy = isWalk ? 0.0 : (yVal - srcRestPos.y) * computedHipsRatio;
                  const dz = (clone.values[3*j+2] - srcRestPos.z) * computedHipsRatio;
                  
                  const dP = new THREE.Vector3(dx, dy, dz)
                    .applyQuaternion(P_src)
                    .applyQuaternion(P_tgt_inv);
                  const resPos = bone.defaultPosition.clone().add(dP);
                  
                  clone.values[3*j] = resPos.x;
                  clone.values[3*j+1] = resPos.y;
                  clone.values[3*j+2] = resPos.z;
                }
              }
            }
          }

          // Retarget rotations (quaternions) for all bones to account for coordinate swaps/bone rolls
          if (prop === 'quaternion') {
            if (targetBoneName.includes('shoulder_1')) continue;

            const bone = targetInstance.getObjectByName(targetBoneName);
            if (bone) {
              if (bone.restLocalQuaternion && bone.restWorldQuaternion) {
                let B_src = null;
                let P_src = null;
                
                if (animBones[baseName]) {
                  const cached = animBones[baseName];
                  B_src = cached.restWorldQuaternion;
                  P_src = cached.parentRestWorldQuaternion;
                } else {
                  B_src = new THREE.Quaternion();
                  P_src = new THREE.Quaternion();
                }
                
                if (B_src && P_src) {
                  const B_tgt = bone.restWorldQuaternion;
                  const P_tgt = (bone.parent && bone.parent.restWorldQuaternion)
                    ? bone.parent.restWorldQuaternion
                    : new THREE.Quaternion();
                  
                  const P_tgt_inv = P_tgt.clone().invert();
                  const B_src_inv = B_src.clone().invert();

                  for (let i = 0; i < clone.values.length; i += 4) {
                    const srcLocalQ = new THREE.Quaternion(clone.values[i], clone.values[i+1], clone.values[i+2], clone.values[i+3]);
                    
                    const animWorldQ = P_src.clone().multiply(srcLocalQ);
                    const deltaQ = animWorldQ.clone().multiply(B_src_inv);
                    const tgtAnimWorldQ = deltaQ.clone().multiply(B_tgt);
                    const tgtLocalQ = P_tgt_inv.clone().multiply(tgtAnimWorldQ).normalize();

                    clone.values[i] = tgtLocalQ.x;
                    clone.values[i+1] = tgtLocalQ.y;
                    clone.values[i+2] = tgtLocalQ.z;
                    clone.values[i+3] = tgtLocalQ.w;
                  }
                } else {
                  // Fallback
                  const parentRestWorldQ = (bone.parent && bone.parent.restWorldQuaternion)
                    ? bone.parent.restWorldQuaternion
                    : new THREE.Quaternion();
                  const parentInv = parentRestWorldQ.clone().invert();
                  const boneRestLocalQ = bone.restLocalQuaternion.clone();

                  for (let i = 0; i < clone.values.length; i += 4) {
                    const q = new THREE.Quaternion(clone.values[i], clone.values[i+1], clone.values[i+2], clone.values[i+3]);
                    const resQ = parentInv.clone()
                      .multiply(q)
                      .multiply(parentRestWorldQ)
                      .multiply(boneRestLocalQ);

                    clone.values[i] = resQ.x;
                    clone.values[i+1] = resQ.y;
                    clone.values[i+2] = resQ.z;
                    clone.values[i+3] = resQ.w;
                  }
                }
              }
            }
          }

          tracks.push(clone);
        }
      }

      return new THREE.AnimationClip(`${workingClip.name}_retargeted`, workingClip.duration, tracks);
    }

    let currentAnimFile = null;
    let currentRetargetedClip = null;
    const loadedRawClips = {};
    let isPaused = false;
    let playbackSpeed = 1.0;
    
    window.getCurrentAnimFile = () => currentAnimFile;
    window.getCurrentRetargetedClip = () => currentRetargetedClip;
    window.getIsPaused = () => isPaused;
    window.getPlaybackSpeed = () => playbackSpeed;

    function playAnimationOnModel(model, clip) {
      if (!model.userData.mixer) {
        console.warn("Model has no mixer assigned:", model);
        return;
      }
      const mixer = model.userData.mixer;
      console.log("Playing clip on model. Mixer root uuid:", mixer.getRoot().uuid, "tracks:", clip.tracks.length);
      mixer.stopAllAction();
      const action = mixer.clipAction(clip);
      action.play();
    }

    function stopAllAnimations() {
      allModels.forEach(model => {
        if (model.userData.mixer) {
          model.userData.mixer.stopAllAction();
        }
      });
      currentRetargetedClip = null;
      currentAnimFile = null;
      
      const items = document.querySelectorAll('.anim-item');
      items.forEach(item => item.classList.remove('active'));
    }

    window.pendingAnimation = null;

    function loadAndPlayAnimation(file) {
      console.log("loadAndPlayAnimation called with:", file);
      currentAnimFile = file;
      
      const items = document.querySelectorAll('.anim-item');
      items.forEach(item => {
        if (item.dataset.file === file) {
          item.classList.add('active');
          item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          item.classList.remove('active');
        }
      });

      if (loadedRawClips[file]) {
        console.log("Playing cached animation:", file);
        currentRetargetedClip = loadedRawClips[file].retargeted;
        allModels.forEach(model => {
          playAnimationOnModel(model, currentRetargetedClip);
        });
        return;
      }

      const hudP = document.querySelector('#hud p:last-child');
      const originalText = hudP.textContent;
      hudP.innerHTML = `Loading animation <span style="color:#ff4444">${formatName(file)}</span>...`;

      console.log("Loading animation GLB from path:", 'media/glb-animations/' + file);
      loader.load('media/glb-animations/' + file, (gltf) => {
        hudP.textContent = originalText;
        console.log("GLB animation loaded:", file, "Animations count:", gltf.animations ? gltf.animations.length : 0);
        if (gltf.animations && gltf.animations.length > 0) {
          const rawClip = gltf.animations[0];
          console.log("Raw clip tracks count:", rawClip.tracks.length);
          
          if (allModels.length > 0) {
            const retargeted = retargetMixamoClip(rawClip, allModels[0], gltf.scene);
            console.log("Retargeted clip tracks count:", retargeted.tracks.length);
            loadedRawClips[file] = { raw: rawClip, retargeted: retargeted };
            currentRetargetedClip = retargeted;
            
            console.log("Active models count:", allModels.length);
            allModels.forEach(model => {
              playAnimationOnModel(model, currentRetargetedClip);
            });
          } else {
            console.log("No models loaded yet, saving animation to pending...");
            window.pendingAnimation = { raw: rawClip, animScene: gltf.scene };
          }
        }
      }, undefined, (err) => {
        console.error("Failed to load animation", file, err);
        hudP.textContent = `Error loading ${file}`;
      });
    }

    function createAnimListUI() {
      const animListEl = document.getElementById('anim-list');
      animListEl.innerHTML = '';
      
      ANIMATION_FILES.forEach(file => {
        const div = document.createElement('div');
        div.className = 'anim-item';
        div.dataset.file = file;
        div.textContent = formatName(file);
        div.onclick = () => {
          loadAndPlayAnimation(file);
        };
        animListEl.appendChild(div);
      });
    }

    const SPACING = 95;

    document.fonts.ready.then(() => {
      createAnimListUI();

      // UI Control bindings
      const btnPlayPause = document.getElementById('btn-play-pause');
      const btnStop = document.getElementById('btn-stop');
      const speedSlider = document.getElementById('speed-slider');
      const speedVal = document.getElementById('speed-val');

      btnPlayPause.onclick = () => {
        isPaused = !isPaused;
        btnPlayPause.textContent = isPaused ? 'Reprendre' : 'Pause';
        if (isPaused) {
          btnPlayPause.classList.remove('anim-btn-primary');
        } else {
          btnPlayPause.classList.add('anim-btn-primary');
        }
      };

      btnStop.onclick = () => {
        stopAllAnimations();
      };

      speedSlider.oninput = (e) => {
        playbackSpeed = parseFloat(e.target.value);
        speedVal.textContent = playbackSpeed.toFixed(1) + 'x';
      };

      const variants = [
        { id: 'native', label: 'Native',  offset: -4.5, color: '#aaa' },
        { id: 'rosanna', label: 'Rosanna', offset: -3.5, color: '#ff4444' },
        { id: 'marissa', label: 'Marissa', offset: -2.5, color: '#ffffff' },
        { id: 'delphina',label: 'Delphina',offset: -1.5,  color: '#ffd700' },
        { id: 'sara',    label: 'Sara',    offset: -0.5,  color: '#888' },
        { id: 'cha',     label: 'Cha',     offset: 0.5,  color: '#bc9c74' },
        { id: 'vivid',   label: 'Vivid',   offset: 1.5,  color: '#ff0000' },
        { id: 'sabira',  label: 'Sabira',  offset: 2.5,  color: '#ffd700' },
        { id: 'safa',    label: 'Safa',    offset: 3.5,  color: '#e2d6bd' },
        { id: 'rajaa',   label: 'Rajaa',   offset: 4.5,  color: '#5f6e4b' },
      ];

variants.forEach(v => {
        const file = v.id === 'native' ? 'media/sandbox/lara_native.glb' : 
                     v.id === 'vivid' ? 'media/sandbox/vivid_red_lara_native.glb' :
                     v.id === 'rosanna' ? 'media/sandbox/rosanna_lara_native.glb' :
                     'media/sandbox/lara_native.glb';

        loader.load(file, (gltf) => {
          const model = gltf.scene;
          
          // Compute rest poses for bones
          model.updateMatrixWorld(true);
          model.traverse(c => {
            c.restWorldQuaternion = c.getWorldQuaternion(new THREE.Quaternion());
            if (c.isBone) {
              c.defaultPosition = c.position.clone();
              c.defaultRotation = c.rotation.clone();
              c.defaultScale = c.scale.clone();
              c.restLocalQuaternion = c.quaternion.clone();
            }
          });

          // Setup animation mixer
          const mixer = new THREE.AnimationMixer(model);
          model.userData.mixer = mixer;
          
          allModels.push(model);
          const x = v.offset * SPACING;
          model.position.x = x;
          scene.add(model);
          processModel(model, v.id);

          // Add name label
          const label = createNameLabel(v.label, v.color);
          label.position.set(x, 215, 0);
          scene.add(label);

          // If there's a pending animation and we are the first model, retarget it now
          if (window.pendingAnimation && !currentRetargetedClip) {
            const raw = window.pendingAnimation.raw;
            const animScene = window.pendingAnimation.animScene;
            const retargeted = retargetMixamoClip(raw, model, animScene);
            if (retargeted) {
              loadedRawClips[currentAnimFile] = { raw: raw, retargeted: retargeted };
              currentRetargetedClip = retargeted;
            }
            window.pendingAnimation = null;
          }

          // Start default animation if loaded
          if (currentRetargetedClip) {
            playAnimationOnModel(model, currentRetargetedClip);
          }
        });
      });

      // Load and play happy walk by default immediately
      loadAndPlayAnimation("happy_walk.glb");
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta() * playbackSpeed;
      if (!isPaused) {
        allModels.forEach(model => {
          if (model.userData.mixer) {
            model.userData.mixer.update(delta);
          }
        });
      }
      
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
