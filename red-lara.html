<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Red Lara Test</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1a1a1f; color: #e0e0e8; }
    #view { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
      padding: 15px; border-radius: 8px; font-size: 13px; line-height: 1.5;
      pointer-events: none; border: 1px solid #444;
    }
    .red { color: #ff4444; font-weight: bold; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hud">
    <h3>Red Lara <span class="red">Material Test</span></h3>
    <p>Loading <b>red_lara_native.glb</b>...</p>
    <p>Targeting clothing materials for a full red style.</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const viewEl = document.getElementById('view');
    const hud = document.getElementById('hud');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 120, 250);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 90, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(100, 200, 100);
    scene.add(sun);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    loader.load('media/sandbox/red_lara_native.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      hud.innerHTML = '<h3>Red Lara <span class="red">Active</span></h3><p>Materials processed. Preserving skin/face details.</p>';

      model.traverse(node => {
        if (node.isMesh) {
          const mat = node.material;
          const matName = mat.name.toLowerCase();
          const meshName = node.name.toLowerCase();

          console.log('Mesh:', node.name, '| Mat:', mat.name);

          // Heuristic: identify skin and face parts to EXCLUDE from red-ification
          // 'body' in this model often refers to the skin mesh, while clothes have specific names.
          const isSkin = matName.includes('skin') || matName.includes('face') || matName.includes('head') || matName.includes('body') || matName.includes('arm') || matName.includes('leg');
          const isHair = matName.includes('hair') || meshName.includes('hair');
          const isEye  = matName.includes('eye') || matName.includes('lens') || matName.includes('lash');
          const isMouth = matName.includes('mouth') || matName.includes('teeth') || matName.includes('tongue');

          // Targets for red
          const isClothing = matName.includes('top') || matName.includes('shirt') || matName.includes('tank') || 
                             matName.includes('short') || matName.includes('pant') || matName.includes('boot') || 
                             matName.includes('gear') || matName.includes('holster') || matName.includes('belt') ||
                             matName.includes('vest') || matName.includes('glove');

          if (isClothing || (!isSkin && !isHair && !isEye && !isMouth)) {
            // Use a bright red for clothes, darker for gear
            const color = (matName.includes('gear') || matName.includes('holster') || matName.includes('boot')) ? 0x660000 : 0xaa0000;

            // Optimization: instead of replacing, we TINT if there's a texture, or replace if not.
            // If we replace, we MUST copy the transparency if it was there (e.g. for some clothing trims)
            if (mat.map) {
               mat.color.setHex(color);
            } else {
              node.material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.4,
                metalness: 0.1,
                transparent: mat.transparent,
                opacity: mat.opacity,
                alphaTest: mat.alphaTest,
                name: 'RedClothing'
              });
            }
          }

          // Fix for the "scary face": ensure head meshes don't have depth/alpha issues
          if (isSkin || isEye || isMouth) {
            if (mat.transparent) {
               // Often eyelashes or mouth parts
               mat.depthWrite = true;
               mat.alphaTest = 0.5;
            }
          }
        }
      });
    });


    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
