<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Red Lara Test</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1a1a1f; color: #e0e0e8; }
    #view { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
      padding: 15px; border-radius: 8px; font-size: 13px; line-height: 1.5;
      pointer-events: none; border: 1px solid #444;
    }
    .red { color: #ff4444; font-weight: bold; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hud">
    <h3>Red Lara <span class="red">Material Test</span></h3>
    <p>Loading <b>red_lara_native.glb</b>...</p>
    <p>Targeting clothing materials for a full red style.</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const viewEl = document.getElementById('view');
    const hud = document.getElementById('hud');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 120, 250);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 90, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(100, 200, 100);
    scene.add(sun);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    loader.load('media/sandbox/red_lara_native.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);
      
      hud.innerHTML = '<h3>Red Lara <span class="red">Active</span></h3><p>Materials processed. Everything red except skin/hair.</p>';

      model.traverse(node => {
        if (node.isMesh) {
          console.log('Mesh:', node.name, 'Material:', node.material.name);
          
          // Target clothing: top, shorts, boots, gear
          // Note: Material names depend on the GLB source. 
          // We apply a heuristic: anything not looking like skin/eyes/hair/mouth becomes red.
          const matName = node.material.name.toLowerCase();
          const meshName = node.name.toLowerCase();
          
          const isSkin = matName.includes('skin') || matName.includes('body') || matName.includes('head') || matName.includes('face') || meshName.includes('body') || meshName.includes('head');
          const isHair = matName.includes('hair') || meshName.includes('hair');
          const isEye = matName.includes('eye') || meshName.includes('lens');
          
          if (!isSkin && !isHair && !isEye) {
            node.material = new THREE.MeshStandardMaterial({
              color: 0xaa0000,
              roughness: 0.3,
              metalness: 0.1,
              name: 'RedClothing'
            });
          }
          
          // Force a dark red for gear/holsters if identified
          if (matName.includes('gear') || matName.includes('boot') || matName.includes('holster')) {
            node.material.color.setHex(0x660000);
          }
        }
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
