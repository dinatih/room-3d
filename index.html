<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Inventaire 3D</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0e0e18; overflow: hidden; }
      #loading {
        position: fixed; inset: 0; background: #ffffff;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading-label {
        color: #d32f2f; font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
        margin-bottom: 14px; letter-spacing: 0.08em; font-weight: 500;
      }
      #loading-track {
        width: 200px; height: 3px; background: #e9ecef; border-radius: 2px;
      }
      #loading-item {
        font-family: monospace; font-size: 10px; color: #888; margin-top: 10px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px;
      }
      #loading-bar {
        height: 100%; width: 0%; background: #d32f2f;
        border-radius: 2px; transition: width 0.15s ease;
      }
    </style>
    <script type="module" crossorigin src="/assets/inventory-BEg_6AV5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/inventory-CujyApwQ.css">
  </head>
  <body>
    <div id="loading">
      <div id="loading-label">Chargement…</div>
      <div id="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-item"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
