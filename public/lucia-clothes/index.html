<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTA 6 — Lucia Clothes &amp; Accessories Catalog</title>
  <script data-goatcounter="https://dinatih.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --gta-pink: #ff3b9a;
      --gta-cyan: #00e5ff;
      --gta-gold: #ffb347;
      --gta-bg: #0b0c16;
      --gta-surface: #141524;
      --bs-primary: #ff3b9a;
      --bs-primary-rgb: 255, 59, 154;
    }
    body.gta-bg {
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 59, 154, 0.14), transparent 38%),
        radial-gradient(circle at 88% 8%, rgba(0, 229, 255, 0.12), transparent 38%),
        var(--gta-bg);
      min-height: 100vh;
    }
    .gta-navbar {
      background: linear-gradient(90deg, #160a24 0%, #2a103b 50%, #0d1d2e 100%);
      border-bottom: 2px solid var(--gta-pink);
    }
    .gta-card {
      background-color: var(--gta-surface) !important;
      border-color: rgba(255, 59, 154, 0.24) !important;
    }
    .btn-gta {
      background-color: var(--gta-pink);
      border-color: var(--gta-pink);
      color: #fff;
    }
    .btn-gta:hover, .btn-gta:focus {
      background-color: #e02882;
      border-color: #e02882;
      color: #fff;
    }
    .btn-outline-gta {
      border-color: var(--gta-pink);
      color: var(--gta-pink);
    }
    .btn-outline-gta:hover {
      background-color: var(--gta-pink);
      color: #fff;
    }
    .text-gta-pink { color: var(--gta-pink) !important; }
    .text-gta-cyan { color: var(--gta-cyan) !important; }
    .bg-gta-pink { background-color: var(--gta-pink) !important; color: #fff !important; }
    .bg-gta-cyan { background-color: var(--gta-cyan) !important; color: #091018 !important; }
    .bg-gta-purple { background-color: #9d4edd !important; color: #fff !important; }
    .bg-gta-gold { background-color: var(--gta-gold) !important; color: #161005 !important; }
    .nav-tabs .nav-link {
      color: #9aa0b8;
    }
    .nav-tabs .nav-link.active {
      color: var(--gta-pink);
      font-weight: 600;
      background-color: transparent;
      border-color: transparent transparent var(--gta-pink) transparent;
      border-bottom: 2px solid var(--gta-pink);
    }
    .preview-img {
      width: 100%;
      aspect-ratio: 17 / 19;
      object-fit: cover;
      cursor: zoom-in;
      background: #090a12;
    }
    .card-style {
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card-style:hover {
      transform: translateY(-2px);
      border-color: var(--gta-pink) !important;
      box-shadow: 0 0 18px rgba(255, 59, 154, .28) !important;
    }
    .angle-dot {
      width: 34px;
      height: 38px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.65;
      border: 2px solid transparent;
      border-radius: 4px;
    }
    .angle-dot.active, .angle-dot:hover {
      opacity: 1;
      border-color: var(--gta-cyan);
    }
    .zoom-thumb {
      width: 72px;
      height: 80px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.6;
      border: 2px solid transparent;
      border-radius: 6px;
    }
    .zoom-thumb.active, .zoom-thumb:hover {
      opacity: 1;
      border-color: var(--gta-cyan);
    }
    .form-check-input:checked {
      background-color: var(--gta-pink);
      border-color: var(--gta-pink);
    }
  </style>
</head>

          </div>
          <div class="col-6 col-md-3">
            <select id="categoryFilter" class="form-select form-select-sm">
              <option value="">All Categories</option>

          </div>

              <option value="">All Shops</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select id="locationFilter" class="form-select form-select-sm">
              <option value="">All Locations</option>
            </select>

          <div class="col-6 col-md-1">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="exclusiveOnly" />
              <label class="form-check-label small" for="exclusiveOnly">Pack</label>
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-secondary-subtle small">
          <span class="text-body-secondary">Filtered results:</span>

    <ul class="nav nav-tabs mb-3" role="tablist">

      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shopsPane" type="button">By Shop</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="gridPane">
        <div class="row g-3" id="cardsGrid"></div>
      </div>
      <div class="tab-pane fade" id="shopsPane">
        <div class="row g-3" id="shopsSummary"></div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="zoomModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content gta-card">
        <div class="modal-header py-2 gta-navbar text-white">

        <div class="modal-footer py-2 justify-content-between small flex-wrap gap-2 gta-card">

          <div id="zoomShare" class="d-flex align-items-center gap-1 flex-wrap"></div>

      return String(str || "")

        .replace(/^-+|-+$/g, "");

        ta.value = text;

      const encBoth = encodeURIComponent(`${title} — ${url}`);

      const xLink = container.querySelector(".js-share-x");
      const fbLink = container.querySelector(".js-share-fb");
      const redditLink = container.querySelector(".js-share-reddit");
      const waLink = container.querySelector(".js-share-wa");

      if (xLink) xLink.href = `https://twitter.com/intent/tweet?text=${encTitle}&url=${encUrl}`;
      if (fbLink) fbLink.href = `https://www.facebook.com/sharer/sharer.php?u=${encUrl}`;
      if (redditLink) redditLink.href = `https://www.reddit.com/submit?url=${encUrl}&title=${encTitle}`;
      if (waLink) waLink.href = `https://wa.me/?text=${encBoth}`;

      container.querySelector(".js-share-copy")?.addEventListener("click", (e) => {
        e.stopPropagation();
        copyText(url, "Link copied to clipboard!");
      });
      container.querySelector(".js-share-native")?.addEventListener("click", async (e) => {
        e.stopPropagation();
        try { await navigator.share({ title, text: title, url }); } catch {}
      });
      container.querySelector(".js-share-insta")?.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (navigator.share) {

      `).join("");
      col.innerHTML = `
        <div class="card shadow-sm h-100 gta-card">
          <div class="card-header gta-navbar text-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">${s} ${loc ? `<small class="opacity-75 fw-normal">(${loc})</small>` : ""}</span>
            <span class="badge bg-gta-pink">${sItems.length} items</span>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 small">
              <thead><tr><th>Category</th><th>Item</th><th>Price</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
      shopsSummary.appendChild(col);
    }

    [searchInput, categoryFilter, shopFilter, locationFilter, exclusiveOnly].forEach(el => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });
    render();

    function openFromHash() {
      const h = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
      if (!h) return;
      const item = ITEMS.find(x => getItemHash(x) === h || String(x.id) === h);
      if (!item) return;
      const gridTabBtn = document.querySelector('[data-bs-target="#gridPane"]');
      if (gridTabBtn) bootstrap.Tab.getOrCreateInstance(gridTabBtn).show();
      const cardCol = document.querySelector(`[data-item-hash="${getItemHash(item)}"]`);
      if (cardCol) cardCol.scrollIntoView({ behavior: "smooth", block: "center" });
      openZoom(item, 0);
    }

    window.addEventListener("hashchange", openFromHash);
    openFromHash();
  </script>
