<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/environment/ciel_paris_bg_aligned.webp" />
    <link href="/fonts/bebas-neue/font.css" rel="stylesheet" />
    <title>Preview 1 — Blueprint Studio 3D</title>
    <style>
      html { font-size: 14px !important; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0b101b;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Barre de test temporaire */
      .preview-toolbar {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        font-size: 12px;
        color: #cbd5e1;
        white-space: nowrap;
      }
      .preview-toolbar a, .preview-toolbar button {
        appearance: none;
        border: 0;
        background: transparent;
        color: #cbd5e1;
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        transition: background 0.15s, color 0.15s;
      }
      .preview-toolbar a:hover, .preview-toolbar button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .preview-toolbar a.active {
        background: #ef4444;
        color: #fff;
      }
      .preview-toolbar .sep {
        width: 1px;
        height: 14px;
        background: rgba(255, 255, 255, 0.16);
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
      }
      #loading-backdrop {
        position: absolute;
        inset: 0;
        background: #0b101b url('/environment/ciel_paris_bg_aligned.webp') repeat-x 0% 50% / auto 100%;
        animation: loading-bg-scroll 60s linear infinite;
        transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), transform 1.35s cubic-bezier(0.2, 0, 0.2, 1);
        pointer-events: none;
      }
      @keyframes loading-bg-scroll {
        from { background-position-x: 0%; }
        to { background-position-x: -100%; }
      }
      #loading-backdrop::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at center, rgba(11, 16, 27, 0.45) 0%, rgba(11, 16, 27, 0.82) 100%),
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 100% 100%, 36px 36px, 36px 36px;
        pointer-events: none;
      }
      #loading-backdrop.exiting {
        opacity: 0;
        transform: scale(1.05);
      }

      #loading-envelope {
        position: relative;
        z-index: 1;
        max-width: 540px;
        width: 100%;
        padding-bottom: 12px;
        clip-path: inset(-40px -40px 0);
      }
      #loading-envelope::after {
        content: '';
        position: absolute;
        z-index: 2;
        bottom: 0;
        left: -12px;
        width: calc(100% + 24px);
        height: 2px;
        background: linear-gradient(90deg, transparent, #ef4444 20%, #f8fafc 50%, #ef4444 80%, transparent);
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.65);
        transform-origin: center center;
        animation: loading-canvas-split 0.55s ease-in-out both;
        pointer-events: none;
      }
      @keyframes loading-canvas-split {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      #loading-envelope.exiting::after {
        animation: loading-canvas-close 1.6s ease-in-out both;
      }
      @keyframes loading-canvas-close {
        0%, 75% { transform: scaleX(1); }
        100% { transform: scaleX(0); }
      }

      #loading-card {
        position: relative;
        z-index: 1;
        background: rgba(15, 23, 42, 0.76);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 26px 28px 22px;
        animation: loading-card-enter 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
        color: #f8fafc;
        text-align: left;
      }
      /* Repères d'angle HUD */
      #loading-card::before,
      #loading-card::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: #ef4444;
        border-style: solid;
        pointer-events: none;
      }
      #loading-card::before {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
        border-top-left-radius: 6px;
      }
      #loading-card::after {
        bottom: -1px;
        right: -1px;
        border-width: 0 2px 2px 0;
        border-bottom-right-radius: 6px;
      }

      @keyframes loading-card-enter {
        from { transform: translateY(calc(100% + 12px)); }
        to { transform: translateY(0); }
      }
      #loading-card.exiting {
        animation: loading-card-exit 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
        pointer-events: none;
      }
      @keyframes loading-card-exit {
        from { transform: translateY(0); }
        to { transform: translateY(calc(100% + 12px)); }
      }

      .hud-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #94a3b8;
        padding-bottom: 14px;
        margin-bottom: 18px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      }
      .hud-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #fca5a5;
        font-weight: 600;
      }
      .hud-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 8px #ef4444;
        animation: pulse-dot 1.4s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.8); }
      }

      #loading-header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
      }
      .avatar-stack {
        position: relative;
        width: 74px;
        height: 74px;
        flex-shrink: 0;
      }
      .avatar-main {
        width: 74px;
        height: 74px;
        border-radius: 10px;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      }
      .avatar-badge {
        position: absolute;
        right: -6px;
        bottom: -6px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #0f172a;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      #loading-title h1 {
        font-family: 'Bebas Neue', system-ui, sans-serif;
        font-size: 38px;
        line-height: 0.95;
        letter-spacing: 0.05em;
        color: #ffffff;
        margin-bottom: 4px;
      }
      #loading-title h2 {
        font-size: 13.5px;
        font-weight: 600;
        color: #f87171;
        margin-bottom: 4px;
      }
      #loading-title .subtitle {
        font-size: 12px;
        color: #cbd5e1;
      }

      .hud-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 4px;
        background: rgba(2, 6, 23, 0.45);
        border: 1px solid rgba(148, 163, 184, 0.14);
        margin-bottom: 18px;
        font-size: 12px;
        color: #cbd5e1;
      }
      .hud-stack {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        color: #e2e8f0;
      }
      .hud-links {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hud-links a {
        color: #fca5a5;
        text-decoration: none;
        font-weight: 600;
      }
      .hud-links a:hover {
        color: #ffffff;
        text-decoration: underline;
      }

      #loading-progress-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #loading-track {
        width: 100%;
        height: 5px;
        background: rgba(148, 163, 184, 0.18);
        border-radius: 2px;
        overflow: hidden;
      }
      #loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #dc2626, #f87171);
        transition: width 0.15s ease;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
      }
      #loading-bar.is-preparing {
        animation: loading-pulse 1s ease-in-out infinite alternate;
      }
      @keyframes loading-pulse {
        from { opacity: 1; }
        to { opacity: 0.4; }
      }
      .hud-telemetry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #94a3b8;
      }
      #loading-item {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #e2e8f0;
      }
      #loading-shaders {
        flex-shrink: 0;
        color: #94a3b8;
      }

      @media (max-width: 520px) {
        #loading-card { padding: 20px; }
        #loading-header { flex-direction: column; align-items: flex-start; gap: 12px; }
        .hud-telemetry { flex-direction: column; align-items: flex-start; gap: 2px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-card, #loading-card.exiting, .hud-dot { animation: none; }
        #loading-card.exiting { visibility: hidden; }
        #loading-envelope::after { display: none; }
      }
    </style>
  </head>
  <body>
    <nav class="preview-toolbar" aria-label="Choix de maquette">
      <a href="/preload-test-1.html" class="active">1 · Blueprint</a>
      <a href="/preload-test-2.html">2 · Éditorial</a>
      <a href="/preload-test-3.html">3 · Bento</a>
      <span class="sep"></span>
      <button type="button" id="btn-replay">Rejouer</button>
      <button type="button" id="btn-exit">Tester sortie</button>
    </nav>

    <div id="loading">
      <div id="loading-backdrop"></div>
      <div id="loading-envelope">
        <div id="loading-card">
          <div class="hud-topbar">
            <span>STUDIO 3D · PARIS 13E</span>
            <span class="hud-status"><span class="hud-dot"></span> DISPONIBLE 2026</span>
          </div>

          <div id="loading-header">
            <div class="avatar-stack">
              <img src="/david_profile.jpeg" alt="David HERELLE" class="avatar-main" />
              <img src="https://avatars.githubusercontent.com/u/309161?v=4" alt="GitHub dinatih" class="avatar-badge" />
            </div>
            <div id="loading-title">
              <h1>DAVID HERELLE</h1>
              <h2>Tech Lead · Architecte Web &amp; Agents IA</h2>
              <div class="subtitle">8+ ans d’expérience (JobTeaser, Tracktor)</div>
            </div>
          </div>

          <div class="hud-meta">
            <span class="hud-stack">Rails · PostgreSQL · React · Three.js</span>
            <div class="hud-links">
              <a href="https://github.com/dinatih" target="_blank" rel="noreferrer">GitHub</a>
              <a href="https://www.linkedin.com/in/dinatih/" target="_blank" rel="noreferrer">LinkedIn</a>
            </div>
          </div>

          <div id="loading-progress-section">
            <div id="loading-track"><div id="loading-bar"></div></div>
            <div class="hud-telemetry">
              <div id="loading-item">Chargement des éléments…</div>
              <div id="loading-shaders" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const bar = document.getElementById('loading-bar');
        const item = document.getElementById('loading-item');
        const shaders = document.getElementById('loading-shaders');
        const card = document.getElementById('loading-card');
        const envelope = document.getElementById('loading-envelope');
        const backdrop = document.getElementById('loading-backdrop');
        let timer;

        function runSimulation() {
          clearInterval(timer);
          card.classList.remove('exiting');
          envelope.classList.remove('exiting');
          backdrop.classList.remove('exiting');
          bar.classList.remove('is-preparing');
          let pct = 0;
          const files = ['lara_rig.glb', 'kitchen_cabinet.glb', 'bermuda_ground.webp', 'ciel_paris_hdr.exr', 'walking_anim.glb'];
          timer = setInterval(() => {
            pct += 4;
            if (pct < 100) {
              bar.style.width = pct + '%';
              const f = files[Math.floor((pct / 100) * files.length)];
              item.textContent = `📦 ${f} (${Math.ceil(pct / 2)}/50)`;
              shaders.textContent = '';
            } else {
              clearInterval(timer);
              bar.style.width = '100%';
              bar.classList.add('is-preparing');
              item.textContent = '⚡ Compilation des shaders GPU…';
              shaders.textContent = 'Shaders : 42';
            }
          }, 90);
        }

        document.getElementById('btn-replay').addEventListener('click', runSimulation);
        document.getElementById('btn-exit').addEventListener('click', () => {
          card.classList.add('exiting');
          envelope.classList.add('exiting');
          backdrop.classList.add('exiting');
        });
        runSimulation();
      })();
    </script>
  </body>
</html>
