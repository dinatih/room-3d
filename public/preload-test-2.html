<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/environment/ciel_paris_bg_aligned.webp" />
    <link href="/fonts/bebas-neue/font.css" rel="stylesheet" />
    <title>Preview 2 — Éditorial Parisien</title>
    <style>
      html { font-size: 14px !important; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #111827;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Barre de test temporaire */
      .preview-toolbar {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        font-size: 12px;
        color: #cbd5e1;
        white-space: nowrap;
      }
      .preview-toolbar a, .preview-toolbar button {
        appearance: none;
        border: 0;
        background: transparent;
        color: #cbd5e1;
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        transition: background 0.15s, color 0.15s;
      }
      .preview-toolbar a:hover, .preview-toolbar button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .preview-toolbar a.active {
        background: #ef4444;
        color: #fff;
      }
      .preview-toolbar .sep {
        width: 1px;
        height: 14px;
        background: rgba(255, 255, 255, 0.16);
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
      }
      #loading-backdrop {
        position: absolute;
        inset: 0;
        background: #111827 url('/environment/ciel_paris_bg_aligned.webp') repeat-x 0% 50% / auto 100%;
        animation: loading-bg-scroll 60s linear infinite;
        transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), transform 1.35s cubic-bezier(0.2, 0, 0.2, 1);
        pointer-events: none;
      }
      @keyframes loading-bg-scroll {
        from { background-position-x: 0%; }
        to { background-position-x: -100%; }
      }
      #loading-backdrop::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(15, 23, 42, 0.18) 0%, rgba(15, 23, 42, 0.56) 100%);
        pointer-events: none;
      }
      #loading-backdrop.exiting {
        opacity: 0;
        transform: scale(1.05);
      }

      #loading-envelope {
        position: relative;
        z-index: 1;
        max-width: 560px;
        width: 100%;
        padding-bottom: 12px;
        clip-path: inset(-40px -40px 0);
      }
      #loading-envelope::after {
        content: '';
        position: absolute;
        z-index: 2;
        bottom: 0;
        left: 16px;
        width: calc(100% - 32px);
        height: 2px;
        background: rgba(255, 255, 255, 0.7);
        transform-origin: center center;
        animation: loading-canvas-split 0.55s ease-in-out both;
        pointer-events: none;
      }
      @keyframes loading-canvas-split {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      #loading-envelope.exiting::after {
        animation: loading-canvas-close 1.6s ease-in-out both;
      }
      @keyframes loading-canvas-close {
        0%, 75% { transform: scaleX(1); }
        100% { transform: scaleX(0); }
      }

      #loading-card {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.80);
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 24px 64px rgba(15, 23, 42, 0.28);
        border-radius: 20px;
        overflow: hidden;
        animation: loading-card-enter 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
        color: #0f172a;
      }
      @keyframes loading-card-enter {
        from { transform: translateY(calc(100% + 12px)); }
        to { transform: translateY(0); }
      }
      #loading-card.exiting {
        animation: loading-card-exit 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
        pointer-events: none;
      }
      @keyframes loading-card-exit {
        from { transform: translateY(0); }
        to { transform: translateY(calc(100% + 12px)); }
      }

      .editorial-main {
        display: grid;
        grid-template-columns: 112px 1fr;
        gap: 22px;
        align-items: center;
        padding: 28px 28px 24px;
      }

      .editorial-portrait {
        position: relative;
        width: 112px;
        height: 112px;
      }
      .editorial-portrait .main-photo {
        width: 112px;
        height: 112px;
        border-radius: 18px;
        object-fit: cover;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      }
      .editorial-portrait .gh-photo {
        position: absolute;
        right: -6px;
        bottom: -6px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: cover;
        border: 2.5px solid #ffffff;
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
      }

      .editorial-kicker {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #047857;
        background: rgba(16, 185, 129, 0.14);
        padding: 3px 10px;
        border-radius: 999px;
        margin-bottom: 10px;
      }
      .editorial-kicker::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
      }

      #loading-title h1 {
        font-family: 'Bebas Neue', system-ui, sans-serif;
        font-size: 40px;
        line-height: 0.92;
        letter-spacing: 0.03em;
        color: #0f172a;
        margin-bottom: 4px;
      }
      #loading-title h2 {
        font-size: 14px;
        font-weight: 600;
        color: #b91c1c;
        margin-bottom: 6px;
      }
      #loading-title .subtitle {
        font-size: 12.5px;
        color: #475569;
        margin-bottom: 12px;
      }

      .editorial-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #475569;
      }
      .editorial-links a {
        color: #0f172a;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid rgba(185, 28, 28, 0.35);
        transition: border-color 0.15s, color 0.15s;
      }
      .editorial-links a:hover {
        color: #b91c1c;
        border-color: #b91c1c;
      }

      #loading-progress-section {
        background: rgba(241, 245, 249, 0.72);
        border-top: 1px solid rgba(15, 23, 42, 0.08);
        padding: 12px 28px 14px;
      }
      #loading-track {
        width: 100%;
        height: 4px;
        background: rgba(15, 23, 42, 0.12);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      #loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #b91c1c, #ef4444);
        border-radius: 999px;
        transition: width 0.15s ease;
      }
      #loading-bar.is-preparing {
        animation: loading-pulse 1s ease-in-out infinite alternate;
      }
      @keyframes loading-pulse {
        from { opacity: 1; }
        to { opacity: 0.4; }
      }
      .progress-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #475569;
      }
      #loading-item {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        color: #1e293b;
      }
      #loading-shaders {
        flex-shrink: 0;
      }

      @media (max-width: 540px) {
        .editorial-main {
          grid-template-columns: 1fr;
          text-align: center;
          padding: 24px 20px 20px;
          gap: 14px;
        }
        .editorial-portrait { margin: 0 auto; }
        .editorial-links { justify-content: center; }
        #loading-progress-section { padding: 12px 20px 14px; }
        .progress-meta { flex-direction: column; gap: 2px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-card, #loading-card.exiting { animation: none; }
        #loading-card.exiting { visibility: hidden; }
        #loading-envelope::after { display: none; }
      }
    </style>
  </head>
  <body>
    <nav class="preview-toolbar" aria-label="Choix de maquette">
      <a href="/preload-test-1.html">1 · Blueprint</a>
      <a href="/preload-test-2.html" class="active">2 · Éditorial</a>
      <a href="/preload-test-3.html">3 · Bento</a>
      <span class="sep"></span>
      <button type="button" id="btn-replay">Rejouer</button>
      <button type="button" id="btn-exit">Tester sortie</button>
    </nav>

    <div id="loading">
      <div id="loading-backdrop"></div>
      <div id="loading-envelope">
        <div id="loading-card">
          <div class="editorial-main">
            <div class="editorial-portrait">
              <img src="/david_profile.jpeg" alt="David HERELLE" class="main-photo" />
              <img src="https://avatars.githubusercontent.com/u/309161?v=4" alt="GitHub dinatih" class="gh-photo" />
            </div>

            <div id="loading-title">
              <span class="editorial-kicker">Disponible · Défi Tech 2026</span>
              <h1>DAVID HERELLE</h1>
              <h2>Tech Lead · Architecte Web &amp; Agents IA</h2>
              <div class="subtitle">8+ ans d’expérience · Rails, React, Three.js</div>
              <div class="editorial-links">
                <span>Paris 13e</span>
                <span>·</span>
                <a href="https://github.com/dinatih" target="_blank" rel="noreferrer">GitHub</a>
                <span>·</span>
                <a href="https://www.linkedin.com/in/dinatih/" target="_blank" rel="noreferrer">LinkedIn</a>
              </div>
            </div>
          </div>

          <div id="loading-progress-section">
            <div id="loading-track"><div id="loading-bar"></div></div>
            <div class="progress-meta">
              <div id="loading-item">Chargement des éléments…</div>
              <div id="loading-shaders" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const bar = document.getElementById('loading-bar');
        const item = document.getElementById('loading-item');
        const shaders = document.getElementById('loading-shaders');
        const card = document.getElementById('loading-card');
        const envelope = document.getElementById('loading-envelope');
        const backdrop = document.getElementById('loading-backdrop');
        let timer;

        function runSimulation() {
          clearInterval(timer);
          card.classList.remove('exiting');
          envelope.classList.remove('exiting');
          backdrop.classList.remove('exiting');
          bar.classList.remove('is-preparing');
          let pct = 0;
          const files = ['lara_rig.glb', 'kitchen_cabinet.glb', 'bermuda_ground.webp', 'ciel_paris_hdr.exr', 'walking_anim.glb'];
          timer = setInterval(() => {
            pct += 4;
            if (pct < 100) {
              bar.style.width = pct + '%';
              const f = files[Math.floor((pct / 100) * files.length)];
              item.textContent = `Chargement : ${f} (${Math.ceil(pct / 2)}/50)`;
              shaders.textContent = '';
            } else {
              clearInterval(timer);
              bar.style.width = '100%';
              bar.classList.add('is-preparing');
              item.textContent = 'Compilation des shaders GPU…';
              shaders.textContent = 'Shaders : 42';
            }
          }, 90);
        }

        document.getElementById('btn-replay').addEventListener('click', runSimulation);
        document.getElementById('btn-exit').addEventListener('click', () => {
          card.classList.add('exiting');
          envelope.classList.add('exiting');
          backdrop.classList.add('exiting');
        });
        runSimulation();
      })();
    </script>
  </body>
</html>
