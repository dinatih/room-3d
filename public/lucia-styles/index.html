    const tabFilter = document.getElementById("tabFilter");
    const exclusiveOnly = document.getElementById("exclusiveOnly");
    const cardsGrid = document.getElementById("cardsGrid");
    const visibleCount = document.getElementById("visibleCount");

    const counts = ITEMS.reduce((acc, x) => { acc[x.category] = (acc[x.category] || 0) + 1; return acc; }, {});
    const shops = [...new Set(ITEMS.map(x => x.shop))].sort();
    const totalAngles = ITEMS.reduce((acc, x) => acc + (x.previews ? x.previews.length : 1), 0);
    document.getElementById("statsBadges").innerHTML = `
      <span class="badge bg-white text-danger">${ITEMS.length} styles (${totalAngles} views)</span>
      <span class="badge bg-white text-dark">${counts["HAIRSTYLE"] || 0} Hairstyles</span>
      <span class="badge bg-white text-dark">${counts["CREATIVE STYLES"] || 0} Creative</span>
      <span class="badge bg-white text-dark">${counts["HAIR COLOR"] || 0} Hair Colors</span>
      <span class="badge bg-white text-dark">${counts["MAKEUP"] || 0} Makeup</span>
      <span class="badge bg-white text-danger">${shops.length} Shops</span>
    `;
    shops.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = `${s} (${ITEMS.filter(x => x.shop === s).length})`;
      shopFilter.appendChild(opt);
    });

    const zoomModalEl = document.getElementById("zoomModal");
    const zoomModal = new bootstrap.Modal(zoomModalEl);
    const shareToast = new bootstrap.Toast(document.getElementById("shareToast"), { delay: 2500 });
    let activeZoomItem = null;
    let activeZoomIdx = 0;

    function slugify(str) {
      return String(str || "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function getItemHash(item) {
      return `${item.id}-${slugify(item.name)}`;
    }

    function getItemUrl(item) {
      const base = `${location.origin}${location.pathname}${location.search}`;
      return item ? `${base}#${getItemHash(item)}` : base;
    }

    function showToast(msg) {
      document.getElementById("shareToastBody").textContent = msg;
      shareToast.show();
    }

    async function copyText(text, msg = "Link copied!") {
      try {
        await navigator.clipboard.writeText(text);
        showToast(msg);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        showToast(msg);
      }
    }

    function buildShareDropdownHtml(btnClass = "btn btn-sm btn-outline-danger") {
      return `
        <button class="${btnClass} dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Share">
          <i class="bi bi-share-fill"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li><button class="dropdown-item small js-share-copy" type="button"><i class="bi bi-link-45deg me-2"></i>Copy link</button></li>
          ${navigator.share ? `<li><button class="dropdown-item small js-share-native" type="button"><i class="bi bi-phone me-2"></i>Share…</button></li>` : ""}
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item small js-share-x" target="_blank" rel="noopener noreferrer"><i class="bi bi-twitter-x me-2"></i>X.com</a></li>
          <li><button class="dropdown-item small js-share-insta" type="button"><i class="bi bi-instagram me-2"></i>Instagram</button></li>
          <li><a class="dropdown-item small js-share-snap" target="_blank" rel="noopener noreferrer"><i class="bi bi-snapchat me-2"></i>Snapchat</a></li>
          <li><a class="dropdown-item small js-share-fb" target="_blank" rel="noopener noreferrer"><i class="bi bi-facebook me-2"></i>Facebook</a></li>
          <li><a class="dropdown-item small js-share-reddit" target="_blank" rel="noopener noreferrer"><i class="bi bi-reddit me-2"></i>Reddit</a></li>
          <li><a class="dropdown-item small js-share-wa" target="_blank" rel="noopener noreferrer"><i class="bi bi-whatsapp me-2"></i>WhatsApp</a></li>
        </ul>
      `;
    }

    function bindShareContainer(container, getShareData) {
      const { url, title } = getShareData();
      const encUrl = encodeURIComponent(url);
      const encTitle = encodeURIComponent(title);
      const encBoth = encodeURIComponent(`${title} — ${url}`);

      const xLink = container.querySelector(".js-share-x");
      const snapLink = container.querySelector(".js-share-snap");
      const fbLink = container.querySelector(".js-share-fb");
      const redditLink = container.querySelector(".js-share-reddit");
      const waLink = container.querySelector(".js-share-wa");

      if (xLink) xLink.href = `https://twitter.com/intent/tweet?text=${encTitle}&url=${encUrl}`;
      if (snapLink) snapLink.href = `https://www.snapchat.com/scan?attachmentUrl=${encUrl}`;
      if (fbLink) fbLink.href = `https://www.facebook.com/sharer/sharer.php?u=${encUrl}`;
      if (redditLink) redditLink.href = `https://www.reddit.com/submit?url=${encUrl}&title=${encTitle}`;
      if (waLink) waLink.href = `https://wa.me/?text=${encBoth}`;

      container.querySelector(".js-share-copy")?.addEventListener("click", (e) => {
        e.stopPropagation();
        copyText(url, "Link copied to clipboard!");
      });
      container.querySelector(".js-share-native")?.addEventListener("click", async (e) => {
        e.stopPropagation();
        try { await navigator.share({ title, text: title, url }); } catch {}
      });
      container.querySelector(".js-share-insta")?.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (navigator.share) {
          try { await navigator.share({ title, text: `${title} ${url}`, url }); return; } catch {}
        }
        await copyText(`${title} — ${url}`, "Link copied for Instagram!");
        window.open("https://www.instagram.com/", "_blank", "noopener,noreferrer");
      });
    }

    const globalShareWrap = document.getElementById("globalShareWrap");
    globalShareWrap.innerHTML = buildShareDropdownHtml("btn btn-sm btn-light text-danger fw-semibold");
    bindShareContainer(globalShareWrap, () => ({
      url: getItemUrl(null),
      title: "GTA 6 — Lucia Styles Catalog"
    }));

    function setZoomImage(idx) {
      if (!activeZoomItem) return;
      const list = activeZoomItem.previews || [activeZoomItem.preview];
      activeZoomIdx = (idx + list.length) % list.length;
      document.getElementById("zoomImg").src = list[activeZoomIdx];
      document.querySelectorAll("#zoomThumbs img").forEach((img, i) => {
        img.classList.toggle("active", i === activeZoomIdx);
      });
    }

    function openZoom(item, startIdx = 0) {
      activeZoomItem = item;
      const list = item.previews || [item.preview];
      document.getElementById("zoomTitle").textContent = `${item.name} — ${item.shop}`;
      document.getElementById("zoomSubtitleFr").textContent = item.name_fr || "";
      const thumbsEl = document.getElementById("zoomThumbs");
      thumbsEl.innerHTML = list.map((src, i) => `
        <img src="${src}" class="zoom-thumb ${i === startIdx ? 'active' : ''}" title="${i === 0 ? 'Main' : 'View ' + (i + 1)}" data-idx="${i}" />
      `).join("");
      thumbsEl.querySelectorAll("img").forEach(img => {
        img.addEventListener("click", () => setZoomImage(Number(img.dataset.idx)));
      });
      document.getElementById("zoomMeta").innerHTML = `
        <span>${item.category} ${item.tab ? "• " + item.tab : ""} ${item.index ? "• " + item.index : ""} • ${list.length} view(s)</span>
        <span class="fw-bold text-danger">${item.price || "—"}</span>
      `;
      const shareUrl = getItemUrl(item);
      const shareTitle = `GTA 6 Lucia — ${item.name} (${item.shop})`;
      const zoomShare = document.getElementById("zoomShare");
      zoomShare.innerHTML = `
        <div class="dropdown dropup">${buildShareDropdownHtml("btn btn-sm btn-danger")}</div>
        <button class="btn btn-sm btn-outline-danger js-share-copy" type="button" title="Copy link"><i class="bi bi-link-45deg"></i> Copy</button>
        <a class="btn btn-sm btn-outline-secondary js-share-x" target="_blank" rel="noopener noreferrer" title="X.com"><i class="bi bi-twitter-x"></i></a>
        <button class="btn btn-sm btn-outline-secondary js-share-insta" type="button" title="Instagram"><i class="bi bi-instagram"></i></button>
        <a class="btn btn-sm btn-outline-secondary js-share-snap" target="_blank" rel="noopener noreferrer" title="Snapchat"><i class="bi bi-snapchat"></i></a>
        <a class="btn btn-sm btn-outline-secondary js-share-fb" target="_blank" rel="noopener noreferrer" title="Facebook"><i class="bi bi-facebook"></i></a>
        <a class="btn btn-sm btn-outline-secondary js-share-reddit" target="_blank" rel="noopener noreferrer" title="Reddit"><i class="bi bi-reddit"></i></a>
        <a class="btn btn-sm btn-outline-secondary js-share-wa" target="_blank" rel="noopener noreferrer" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
      `;
      bindShareContainer(zoomShare, () => ({ url: shareUrl, title: shareTitle }));

      const targetHash = `#${getItemHash(item)}`;
      if (location.hash !== targetHash) {
        history.replaceState(null, "", targetHash);
      }
      setZoomImage(startIdx);
      zoomModal.show();
    }

    zoomModalEl.addEventListener("hidden.bs.modal", () => {
      activeZoomItem = null;
      if (location.hash) {
        history.replaceState(null, "", `${location.pathname}${location.search}`);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!zoomModalEl.classList.contains("show")) return;
      if (e.key === "ArrowRight") setZoomImage(activeZoomIdx + 1);
      if (e.key === "ArrowLeft") setZoomImage(activeZoomIdx - 1);
    });

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;
      const shop = shopFilter.value;
      const tab = tabFilter.value;
      const excl = exclusiveOnly.checked;

      const filtered = ITEMS.filter(x => {
        if (cat && x.category !== cat) return false;
        if (shop && x.shop !== shop) return false;
        if (tab && x.tab !== tab) return false;
        if (excl && !x.exclusive) return false;
        if (q && !(
          x.name.toLowerCase().includes(q) ||
          (x.name_fr || "").toLowerCase().includes(q) ||
          x.shop.toLowerCase().includes(q) ||
          x.category.toLowerCase().includes(q)
        )) return false;
        return true;
      });

      visibleCount.textContent = filtered.length;
      const fBadge = document.getElementById("filterCountBadge");
      if (fBadge) fBadge.textContent = `${filtered.length} / ${ITEMS.length} results`;
      cardsGrid.innerHTML = "";
      for (const item of filtered) {
        const list = item.previews || [item.preview];
        const col = document.createElement("div");
        col.className = "col-6 col-sm-4 col-md-3 col-lg-2";
        col.dataset.itemHash = getItemHash(item);
        const stripHtml = list.length > 1
          ? `<div class="d-flex gap-1 px-2 pt-2 bg-white border-bottom pb-2 justify-content-center">${list.map((src, i) => `<img src="${src}" class="angle-dot ${i === 0 ? 'active' : ''}" data-idx="${i}" title="${i === 0 ? 'Main' : 'View ' + (i + 1)}" loading="lazy" />`).join("")}</div>`
          : "";
        col.innerHTML = `
          <div class="card h-100 card-style border bg-white shadow-sm">
            <div class="position-relative">
              <img src="${list[0]}" class="card-img-top preview-img" loading="lazy" alt="${item.name}" />
              <div class="dropdown position-absolute top-0 start-0 m-1 js-card-share">${buildShareDropdownHtml("btn btn-sm btn-light text-danger border border-danger-subtle py-0 px-1")}</div>
              ${list.length > 1 ? `<span class="badge text-bg-danger position-absolute top-0 end-0 m-1">${list.length} views</span>` : ""}
            </div>
            ${stripHtml}
            <div class="card-body p-2 d-flex flex-column gap-1">
              <div class="d-flex justify-content-between align-items-center gap-1">
                <span class="badge ${catBadgeClass[item.category] || 'text-bg-secondary'}">${item.category}</span>
                ${item.price ? `<span class="badge bg-white text-danger border border-danger">${item.price}</span>` : ""}
              </div>
              <div class="fw-semibold small text-dark text-truncate" title="${item.name}">${item.name}</div>
              <div class="text-body-secondary fst-italic text-truncate" style="font-size: 0.72rem;" title="${item.name_fr || ''}">${item.name_fr || ""}</div>
              <div class="text-danger small fw-medium text-truncate" title="${item.shop}">${item.shop}</div>
              <div class="d-flex flex-wrap gap-1 mt-auto pt-1">
                ${item.tab ? `<span class="badge bg-light text-dark border">${item.tab}</span>` : ""}
                ${item.exclusive ? `<span class="badge text-bg-danger">EXCLUSIVE</span>` : ""}
                ${item.note ? `<span class="badge bg-light text-secondary border text-truncate mw-100" title="${item.note}">${item.note}</span>` : ""}
              </div>
            </div>
          </div>
        `;
        bindShareContainer(col.querySelector(".js-card-share"), () => ({
          url: getItemUrl(item),
          title: `GTA 6 Lucia — ${item.name} (${item.shop})`
        }));
        const mainImg = col.querySelector(".preview-img");
        let currentIdx = 0;
        mainImg.addEventListener("click", () => openZoom(item, currentIdx));
        col.querySelectorAll(".angle-dot").forEach(dot => {
          dot.addEventListener("click", () => {
            currentIdx = Number(dot.dataset.idx);
            mainImg.src = list[currentIdx];
            col.querySelectorAll(".angle-dot").forEach((d, i) => d.classList.toggle("active", i === currentIdx));
          });
        });
        cardsGrid.appendChild(col);
      }
    }

    const shopsSummary = document.getElementById("shopsSummary");
    for (const s of shops) {
      const sItems = ITEMS.filter(x => x.shop === s);
      const col = document.createElement("div");
      col.className = "col-12 col-lg-6";
      const rows = sItems.map(x => `
        <tr>
          <td><span class="badge ${catBadgeClass[x.category] || 'text-bg-secondary'}">${x.category}</span></td>
          <td>
            <div class="fw-medium">${x.name}</div>
            <div class="text-body-secondary fst-italic" style="font-size: 0.75rem;">${x.name_fr || ""}</div>
          </td>
          <td>${x.tab || "—"}</td>
          <td class="text-danger fw-semibold">${x.price || "—"}</td>
        </tr>
      `).join("");
      col.innerHTML = `
        <div class="card shadow-sm h-100 bg-white border-danger border-opacity-25">
          <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">${s}</span>
            <span class="badge bg-white text-danger">${sItems.length} styles</span>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 small">
              <thead><tr><th>Category</th><th>Name</th><th>Tab</th><th>Price</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
      shopsSummary.appendChild(col);
    }

    [searchInput, categoryFilter, shopFilter, tabFilter, exclusiveOnly].forEach(el => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });
    render();

    const demoShare = document.getElementById("demoShare");
    const demoUrl = `${location.origin}${location.pathname}${location.search}#demo`;
    const demoTitle = "GTA 6 — Lucia Styles Catalog (Demo)";
    demoShare.innerHTML = `
      <div class="dropdown dropup">${buildShareDropdownHtml("btn btn-sm btn-danger")}</div>
      <button class="btn btn-sm btn-outline-danger js-share-copy" type="button" title="Copy link"><i class="bi bi-link-45deg"></i> Copy</button>
      <a class="btn btn-sm btn-outline-secondary js-share-x" target="_blank" rel="noopener noreferrer" title="X.com"><i class="bi bi-twitter-x"></i></a>
      <button class="btn btn-sm btn-outline-secondary js-share-insta" type="button" title="Instagram"><i class="bi bi-instagram"></i></button>
      <a class="btn btn-sm btn-outline-secondary js-share-snap" target="_blank" rel="noopener noreferrer" title="Snapchat"><i class="bi bi-snapchat"></i></a>
      <a class="btn btn-sm btn-outline-secondary js-share-fb" target="_blank" rel="noopener noreferrer" title="Facebook"><i class="bi bi-facebook"></i></a>
      <a class="btn btn-sm btn-outline-secondary js-share-reddit" target="_blank" rel="noopener noreferrer" title="Reddit"><i class="bi bi-reddit"></i></a>
      <a class="btn btn-sm btn-outline-secondary js-share-wa" target="_blank" rel="noopener noreferrer" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
    `;
    bindShareContainer(demoShare, () => ({ url: demoUrl, title: demoTitle }));

    function openFromHash() {
      const h = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
      if (!h) return;
      if (h === "demo") {
        const demoTabBtn = document.querySelector('[data-bs-target="#demoPane"]');
        if (demoTabBtn) bootstrap.Tab.getOrCreateInstance(demoTabBtn).show();
        return;
      }
      const item = ITEMS.find(x => getItemHash(x) === h || String(x.id) === h);
      if (!item) return;
      const gridTabBtn = document.querySelector('[data-bs-target="#gridPane"]');
      if (gridTabBtn) bootstrap.Tab.getOrCreateInstance(gridTabBtn).show();
      const cardCol = document.querySelector(`[data-item-hash="${getItemHash(item)}"]`);
      if (cardCol) cardCol.scrollIntoView({ behavior: "smooth", block: "center" });
      openZoom(item, 0);
    }

    window.addEventListener("hashchange", openFromHash);
    openFromHash();
  </script>
  <footer class="container-fluid px-4 pb-4 d-flex flex-column align-items-center gap-2">
    <div class="d-flex flex-column align-items-center rounded bg-white border border-danger border-opacity-25 p-2 shadow-sm">
      <span class="small text-danger fw-semibold">Page visits</span>
      <img
        src="https://dinatih.goatcounter.com/counter/%2Flucia-styles%2F.svg?no_branding=1"
        alt="Page visits counter"
        width="200"
        height="60"
        class="border-0 mw-100"
      />
    </div>
    <a
      href="https://www.youtube.com/watch?v=wNQzecBeJ-w&t=749s"
      target="_blank"
      rel="noopener noreferrer"
      class="small text-body-secondary text-decoration-none opacity-75"
    >Source: YouTube (12:29 – 24:26)</a>
  </footer>
</body>
</html>
