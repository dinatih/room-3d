<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>R3F Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; font-family: sans-serif; color: #ccc; }
    #root { width: 100vw; height: 100vh; }
    #info {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,0.7); border: 1px solid #333;
      border-radius: 6px; padding: 8px 14px; font-size: 12px;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three":             "https://esm.sh/three@0.170.0",
      "react":             "https://esm.sh/react@18",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react-dom/client":  "https://esm.sh/react-dom@18/client",
      "@react-three/fiber":"https://esm.sh/@react-three/fiber@8?deps=three@0.170.0,react@18,react-dom@18"
    }
  }
  </script>
</head>
<body>
  <div id="info">R3F test · Three.js r170 · drag to orbit</div>
  <div id="root"></div>

  <script type="module">
    import { createElement as h, useRef, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import * as THREE from 'three';

    // Rotating box that changes color on click
    function Box({ position, color }) {
      const ref = useRef();
      const [hovered, setHovered] = useState(false);
      const [clicked, setClicked] = useState(false);

      useFrame(() => {
        ref.current.rotation.x += 0.005;
        ref.current.rotation.y += 0.01;
      });

      return h('mesh', {
        ref,
        position,
        scale: clicked ? 1.3 : 1,
        onClick:      () => setClicked(v => !v),
        onPointerOver: () => setHovered(true),
        onPointerOut:  () => setHovered(false),
      },
        h('boxGeometry', { args: [1, 1, 1] }),
        h('meshStandardMaterial', { color: hovered ? '#ffd700' : color })
      );
    }

    function App() {
      return h(Canvas, { camera: { position: [0, 0, 5], fov: 50 } },
        h('ambientLight',      { intensity: 0.6 }),
        h('directionalLight',  { position: [5, 5, 5], intensity: 1 }),
        h(Box, { position: [-1.5, 0, 0], color: '#ff6644' }),
        h(Box, { position: [ 1.5, 0, 0], color: '#4488ff' }),
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
