<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Cyber Sekes — Duo Animation Debug</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06060c;
      --panel: rgba(10,10,20,0.82);
      --border: rgba(255,255,255,0.06);
      --accent: #c084fc;
      --accent2: #67e8f9;
      --red: #f87171;
      --green: #34d399;
      --orange: #fb923c;
      --muted: #6b7280;
      --font: 'Outfit', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #f3f4f6;
      font-family: var(--font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
    }
    #topbar h1 {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    #topbar h1 span { color: var(--accent); }

    .sep { width: 1px; height: 24px; background: var(--border); }

    /* Status pills */
    .pill {
      font-size: 11px;
      font-family: var(--mono);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      white-space: nowrap;
    }
    .pill.ok { border-color: var(--green); color: var(--green); }
    .pill.ok-ref { border-color: var(--orange); color: var(--orange); }
    .pill.loading { border-color: var(--accent); color: var(--accent); animation: pulse 1.2s ease infinite; }
    .pill.err { border-color: var(--red); color: var(--red); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── CONTROLS ── */
    #controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .ctrl-label { font-size: 11px; color: var(--muted); }

    input[type="range"] {
      -webkit-appearance: none;
      width: 90px; height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    button {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: #e5e7eb;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(192,132,252,0.12); border-color: var(--accent); }
    button.active { background: var(--accent); border-color: var(--accent); color: #0a0a14; }

    /* ── TIMELINE ── */
    #timeline-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 20px;
      background: rgba(10,10,20,0.6);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #timeline-bar input[type="range"] { width: 100%; flex: 1; }
    #time-label { font-family: var(--mono); font-size: 11px; color: var(--accent2); white-space: nowrap; }

    /* ── VIEWPORT ── */
    #viewport {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #viewport canvas { width: 100% !important; height: 100% !important; display: block; }

    /* ── LOADING OVERLAY ── */
    #loading {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.5s;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(192,132,252,0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 14px; color: var(--muted); }
    #loading-bar-wrap {
      width: 260px;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    /* ── HUD ── */
    #hud {
      position: absolute;
      top: 12px; left: 12px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      pointer-events: none;
      line-height: 1.7;
    }
    #hud strong { color: var(--accent); }

    /* ── VISIBILITY PANEL ── */
    #vis-panel {
      position: absolute;
      top: 12px; right: 12px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 200px;
      font-size: 12px;
    }
    #vis-panel .title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 10px; }
    #vis-panel .section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--orange); margin: 10px 0 6px; padding-top: 8px; border-top: 1px solid var(--border); }
    .vis-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .vis-row:last-child { margin-bottom: 0; }
    .vis-row label { color: #d1d5db; }

    /* Toggle switch */
    .sw { position: relative; display: inline-block; width: 32px; height: 17px; }
    .sw input { opacity:0; width:0; height:0; }
    .sw-track {
      position: absolute; inset:0;
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: .2s;
      cursor: pointer;
    }
    .sw-track::before {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      left: 3px; bottom: 3px;
      border-radius: 50%;
      background: var(--muted);
      transition: .2s;
    }
    .sw input:checked + .sw-track { background: rgba(192,132,252,0.18); border-color: var(--accent); }
    .sw input:checked + .sw-track::before { transform: translateX(15px); background: var(--accent); }
    /* Orange toggle for CC refs */
    .sw.orange input:checked + .sw-track { background: rgba(251,146,60,0.18); border-color: var(--orange); }
    .sw.orange input:checked + .sw-track::before { background: var(--orange); }

    .opacity-mini {
      display: flex; align-items: center; gap: 6px; margin-top: 4px;
    }
    .opacity-mini input { width: 60px; height: 3px; }
    .opacity-mini span { font-family: var(--mono); font-size: 10px; color: var(--accent2); }

    /* Legend dots */
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .dot-purple { background: var(--accent); }
    .dot-orange { background: var(--orange); }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div id="topbar">
    <h1>Cyber Sekes <span>Duo Anim</span> — Comparaison</h1>
    <div class="sep"></div>
    <!-- Target pills (purple) -->
    <div id="pill-a" class="pill loading">Lara A …</div>
    <div id="pill-b" class="pill loading">X-Bot …</div>
    <div class="sep"></div>
    <!-- CC ref pills (orange) -->
    <div id="pill-ra" class="pill loading">CC Femme …</div>
    <div id="pill-rb" class="pill loading">CC Homme …</div>
    <div class="sep"></div>
    <div id="controls">
      <span class="ctrl-label">Vitesse</span>
      <input type="range" id="sl-speed" min="0" max="2" step="0.05" value="1">
      <span id="speed-val" style="font-family:var(--mono);font-size:11px;color:var(--accent2)">1.0×</span>
      <div class="sep"></div>
      <button id="btn-play" class="active">⏸ Pause</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-layout" title="Overlay / Côte à côte">⇆ Layout</button>
    </div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline-bar">
    <span class="ctrl-label" style="white-space:nowrap">Timeline</span>
    <input type="range" id="sl-time" min="0" max="100" value="0" step="0.1">
    <span id="time-label">0.0 s</span>
  </div>

  <!-- 3D VIEWPORT -->
  <div id="viewport">

    <!-- Loading overlay -->
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-msg">Chargement des modèles…</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div>FPS: <strong id="hud-fps">--</strong></div>
      <div>Anim: <strong id="hud-anim">Cyber sex</strong></div>
      <div>Durée: <strong id="hud-dur">4.3 s</strong></div>
      <div style="margin-top:6px"><span class="dot dot-purple"></span>Retargeté (Lara/X-Bot)</div>
      <div><span class="dot dot-orange"></span>CC original (référence)</div>
    </div>

    <!-- Visibility panel -->
    <div id="vis-panel">
      <div class="title">Visibilité</div>

      <!-- Characters -->
      <div class="vis-row">
        <label><span class="dot dot-purple"></span>Lara A (femme)</label>
        <label class="sw"><input type="checkbox" id="vis-a" checked><span class="sw-track"></span></label>
      </div>
      <div class="opacity-mini">
        <input type="range" id="op-a" min="0" max="1" step="0.05" value="1">
        <span id="op-a-val">1.0</span>
      </div>
      <div class="vis-row" style="margin-top:10px">
        <label><span class="dot dot-purple"></span>X-Bot (homme)</label>
        <label class="sw"><input type="checkbox" id="vis-b" checked><span class="sw-track"></span></label>
      </div>
      <div class="opacity-mini">
        <input type="range" id="op-b" min="0" max="1" step="0.05" value="1">
        <span id="op-b-val">1.0</span>
      </div>

      <!-- CC Originals -->
      <div class="section-title">Références CC (original)</div>
      <div class="vis-row">
        <label><span class="dot dot-orange"></span>CC Femme</label>
        <label class="sw orange"><input type="checkbox" id="vis-ra" checked><span class="sw-track"></span></label>
      </div>
      <div class="opacity-mini">
        <input type="range" id="op-ra" min="0" max="1" step="0.05" value="0.35">
        <span id="op-ra-val">0.35</span>
      </div>
      <div class="vis-row" style="margin-top:10px">
        <label><span class="dot dot-orange"></span>CC Homme</label>
        <label class="sw orange"><input type="checkbox" id="vis-rb" checked><span class="sw-track"></span></label>
      </div>
      <div class="opacity-mini">
        <input type="range" id="op-rb" min="0" max="1" step="0.05" value="0.35">
        <span id="op-rb-val">0.35</span>
      </div>

      <!-- Misc -->
      <div class="section-title" style="color:var(--muted)">Divers</div>
      <div class="vis-row">
        <label>Squelettes</label>
        <label class="sw"><input type="checkbox" id="vis-skel"><span class="sw-track"></span></label>
      </div>
      <div class="vis-row">
        <label>Grille</label>
        <label class="sw"><input type="checkbox" id="vis-grid" checked><span class="sw-track"></span></label>
      </div>
    </div>

  </div><!-- /viewport -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── CONFIG ──────────────────────────────────────────────────────────────
    // Lara & X-Bot models
    const CHAR_A      = 'media/sandbox/lara_native.glb';
    const CHAR_B      = 'media/sandbox/Xbot_official.glb';
    // CC originaux extraits du zip (anim native, en arrière-plan)
    const CC_REF_A    = 'media/sandbox/cyber_char_a.glb';   // femme CC
    const CC_REF_B    = 'media/sandbox/cyber_char_b.glb';   // homme CC

    const ANIM_NAME_A = 'Cyber sex A';
    const ANIM_NAME_B = 'Cyber sex B';
    const TARGET_H    = 173; // normaliser hauteur à ~173 cm

    // ── SCENE ───────────────────────────────────────────────────────────────
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060c);
    scene.fog = new THREE.FogExp2(0x06060c, 0.0018);

    const W = container.clientWidth, H = container.clientHeight;
    const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 3000);
    camera.position.set(0, 120, 380);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 90, 0);
    controls.maxPolarAngle = Math.PI / 2 + 0.1;
    controls.update();

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    scene.add(new THREE.HemisphereLight(0xd4b8ff, 0x223344, 0.8));

    const sun = new THREE.DirectionalLight(0xfff5e0, 1.6);
    sun.position.set(60, 200, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 600;
    sun.shadow.camera.left = sun.shadow.camera.bottom = -200;
    sun.shadow.camera.right = sun.shadow.camera.top = 200;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8b5cf6, 0.7);
    fill.position.set(-80, 80, -80);
    scene.add(fill);

    const rim = new THREE.PointLight(0x67e8f9, 1.2, 600);
    rim.position.set(0, 200, -150);
    scene.add(rim);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.MeshStandardMaterial({ color: 0x0a0a14, roughness: 0.9, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(600, 60, 0x1e1b4b, 0x0f0d2a);
    grid.material.opacity = 0.5;
    grid.material.transparent = true;
    scene.add(grid);

    // ── STATE ───────────────────────────────────────────────────────────────
    let isPlaying = true;
    let playbackSpeed = 1.0;
    let layout = 'side'; // 'overlay' | 'side'
    const clock = new THREE.Clock();
    let animDuration = 0;
    let currentTime = 0;

    // Lara retargetées (a, b)
    const models   = { a: null, b: null };
    const mixers   = { a: null, b: null };
    const actions  = { a: null, b: null };
    const skels    = { a: null, b: null };
    const wrappers = { a: null, b: null };

    // CC originaux en référence (ra, rb)
    const refModels   = { ra: null, rb: null };
    const refMixers   = { ra: null, rb: null };
    const refActions  = { ra: null, rb: null };
    const refSkels    = { ra: null, rb: null };
    const refWrappers = { ra: null, rb: null };
    const rawClips    = { ra: null, rb: null };

    // ── UTILS ───────────────────────────────────────────────────────────────
    function setLoadMsg(msg, pct) {
      document.getElementById('loading-msg').textContent = msg;
      document.getElementById('loading-bar').style.width = pct + '%';
    }

    function normalizeHeight(model, target = TARGET_H) {
      model.scale.set(1, 1, 1);
      model.position.set(0, 0, 0);
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const h = box.getSize(new THREE.Vector3()).y;
      if (h > 0) {
        model.scale.setScalar(target / h);
        model.updateMatrixWorld(true);
        const b2 = new THREE.Box3().setFromObject(model);
        model.position.y = -b2.min.y;
      }
    }

    function setMeshOpacity(model, opacity) {
      model.traverse(c => {
        if (c.isMesh && c.material) {
          const mats = Array.isArray(c.material) ? c.material : [c.material];
          mats.forEach(m => {
            m.transparent = opacity < 1;
            m.opacity = opacity;
            m.depthWrite = opacity >= 0.99; // disable depthWrite for semi-transparent to avoid Z fighting
          });
        }
      });
    }

    function getCharacterGenderFromBoneName(name) {
      // Suffixes under _100 (e.g. _07, _09, _034) are female. Suffixes starting at _0100 (e.g. _0106) are male.
      const match = name.match(/_0?(\d+)/);
      if (match) {
        const val = parseInt(match[1], 10);
        return val >= 100 ? 'male' : 'female';
      }
      return null;
    }

    function getBoneBindWorldQuaternion(bone, model) {
      let skinnedMesh = null;
      model.traverse(c => {
        if (!skinnedMesh && c.isSkinnedMesh && c.skeleton) {
          if (c.skeleton.bones.indexOf(bone) !== -1) {
            skinnedMesh = c;
          }
        }
      });

      if (skinnedMesh) {
        const idx = skinnedMesh.skeleton.bones.indexOf(bone);
        const invBind = skinnedMesh.skeleton.boneInverses[idx];
        const bindMatrix = invBind.clone().invert();
        
        if (skinnedMesh.bindMatrix) {
          bindMatrix.premultiply(skinnedMesh.bindMatrix);
        }
        
        const q = new THREE.Quaternion();
        const pos = new THREE.Vector3();
        const scale = new THREE.Vector3();
        bindMatrix.decompose(pos, q, scale);
        return q;
      }
      
      return bone.getWorldQuaternion(new THREE.Quaternion());
    }

    // ── LOAD LARA (retargetée) ───────────────────────────────────────────────
    async function loadChar(key, path, label, pill) {
      const loader = new GLTFLoader();
      setLoadMsg(`Chargement de ${label}…`, key === 'a' ? 15 : 45);
      const gltf = await new Promise((res, rej) => loader.load(path, res, undefined, rej));
      const model = gltf.scene;
      model.name = label;

      model.traverse(c => {
        if (c.isMesh) {
          c.castShadow = c.receiveShadow = true;
          c.frustumCulled = false;
          const mats = Array.isArray(c.material) ? c.material : [c.material];
          mats.forEach(m => {
            if (m) {
              m.depthWrite = true;
              m.depthTest  = true;
              if (m.transparent && m.opacity >= 0.99) {
                m.transparent = false;
              }
            }
          });
        }
      });

      normalizeHeight(model);

      const wrapper = new THREE.Group();
      wrapper.add(model);
      scene.add(wrapper);

      const skel = new THREE.SkeletonHelper(model);
      skel.visible = false;
      scene.add(skel);

      // Cache rest pose properties
      model.updateMatrixWorld(true);
      model.traverse(c => {
        if (c.isBone) {
          c.restWorldQuaternion = c.getWorldQuaternion(new THREE.Quaternion());
          c.restLocalQuaternion = c.quaternion.clone();
          c.parentRestWorldQuaternion = c.parent && c.parent.isBone
            ? c.parent.getWorldQuaternion(new THREE.Quaternion())
            : new THREE.Quaternion();
          c.defaultPosition = c.position.clone();
        }
      });

      const mixer = new THREE.AnimationMixer(model);

      models[key]  = model;
      mixers[key]  = mixer;
      actions[key] = null; // will be created via retargeting
      skels[key]   = skel;
      wrappers[key] = wrapper;

      pill.textContent = `${label} ✓`;
      pill.className = 'pill ok';
    }

    // ── LOAD CC REF (modèle original) ───────────────────────────────────────
    async function loadRef(key, path, label, pill) {
      const loader = new GLTFLoader();
      setLoadMsg(`Chargement référence ${label}…`, key === 'ra' ? 60 : 80);
      const gltf = await new Promise((res, rej) => loader.load(path, res, undefined, rej));
      const model = gltf.scene;
      model.name = label;

      // Appliquer semi-transparence par défaut (0.35)
      model.traverse(c => {
        if (c.isMesh) {
          c.frustumCulled = false;
          c.castShadow = false;
          c.receiveShadow = false;
          const mats = Array.isArray(c.material) ? c.material : [c.material];
          mats.forEach(m => {
            if (m) {
              m.depthWrite = false; // semi-transparent → pas de depthWrite
              m.depthTest  = true;
              m.transparent = true;
              m.opacity = 0.35;
            }
          });
        }
      });

      // Hide meshes of the opposite gender
      model.traverse(c => {
        if (c.isSkinnedMesh) {
          let hasMaleBones = false;
          let hasFemaleBones = false;
          if (c.skeleton && c.skeleton.bones) {
            for (const bone of c.skeleton.bones) {
              const gender = getCharacterGenderFromBoneName(bone.name);
              if (gender === 'male') hasMaleBones = true;
              if (gender === 'female') hasFemaleBones = true;
            }
          }
          if (key === 'ra' && hasMaleBones && !hasFemaleBones) {
            c.visible = false;
          }
          if (key === 'rb' && hasFemaleBones && !hasMaleBones) {
            c.visible = false;
          }
        }
      });

      normalizeHeight(model);

      const wrapper = new THREE.Group();
      wrapper.add(model);
      // Placer les CC légèrement en arrière (Z décalé) pour éviter Z-fighting
      wrapper.position.z = -30;
      scene.add(wrapper);

      const skel = new THREE.SkeletonHelper(model);
      skel.visible = false;
      scene.add(skel);

      // Cache rest pose properties
      model.updateMatrixWorld(true);
      model.traverse(c => {
        if (c.isBone) {
          c.restWorldQuaternion = c.getWorldQuaternion(new THREE.Quaternion());
          c.restLocalQuaternion = c.quaternion.clone();
          c.parentRestWorldQuaternion = c.parent && c.parent.isBone
            ? c.parent.getWorldQuaternion(new THREE.Quaternion())
            : new THREE.Quaternion();
          c.defaultPosition = c.position.clone();
        }
      });

      const mixer = new THREE.AnimationMixer(model);
      let action = null;

      console.log(`[${key}] CC ref animations:`, gltf.animations.map(a => a.name));

      if (gltf.animations.length > 0) {
        // Prendre la première (et unique) animation du CC exporté
        const clip = gltf.animations[0];
        rawClips[key] = clip; // Store raw clip for dynamic retargeting
        animDuration = Math.max(animDuration, clip.duration);
        action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.clampWhenFinished = false;
        if (isPlaying) action.play();
        console.log(`[${key}] CC clip=${clip.name}  dur=${clip.duration.toFixed(2)}s  tracks=${clip.tracks.length}`);
      } else {
        console.warn(`[${key}] CC ref : AUCUNE animation !`);
      }

      refModels[key]   = model;
      refMixers[key]   = mixer;
      refActions[key]  = action;
      refSkels[key]    = skel;
      refWrappers[key] = wrapper;

      pill.textContent = `${label} ✓`;
      pill.className = 'pill ok-ref';
    }

    // ── DYNAMIC RETARGETING ──────────────────────────────────────────────────
    // ── DYNAMIC RETARGETING ──────────────────────────────────────────────────
    const CC_TO_LARA = {
      'CC_Base_Hip':        'mixamorig_root_hips',
      'CC_Base_Waist':      'mixamorig_spine_lower',
      'CC_Base_Spine01':    'mixamorig_spine_upper',
      'CC_Base_Spine02':    'mixamorig_spine_upper',
      'CC_Base_Head':       'mixamorig_head_neck_upper',
      'CC_Base_NeckTwist01': 'mixamorig_head_neck_lower',
      'CC_Base_NeckTwist02': 'mixamorig_head_neck_upper',
      'CC_Base_L_Thigh':    'mixamorig_leg_left_thigh',
      'CC_Base_L_Calf':     'mixamorig_leg_left_knee',
      'CC_Base_L_Foot':     'mixamorig_leg_left_ankle',
      'CC_Base_L_ToeBase':  'mixamorig_leg_left_toes',
      'CC_Base_R_Thigh':    'mixamorig_leg_right_thigh',
      'CC_Base_R_Calf':     'mixamorig_leg_right_knee',
      'CC_Base_R_Foot':     'mixamorig_leg_right_ankle',
      'CC_Base_R_ToeBase':  'mixamorig_leg_right_toes',
      'CC_Base_L_Clavicle': 'mixamorig_arm_left_shoulder_1',
      'CC_Base_L_Upperarm': 'mixamorig_arm_left_shoulder_2',
      'CC_Base_L_Forearm':  'mixamorig_arm_left_elbow',
      'CC_Base_L_Hand':     'mixamorig_arm_left_wrist',
      'CC_Base_R_Clavicle': 'mixamorig_arm_right_shoulder_1',
      'CC_Base_R_Upperarm': 'mixamorig_arm_right_shoulder_2',
      'CC_Base_R_Forearm':  'mixamorig_arm_right_elbow',
      'CC_Base_R_Hand':     'mixamorig_arm_right_wrist',
    };

    const CC_TO_XBOT = {
      'CC_Base_Hip':        'mixamorigHips',
      'CC_Base_Waist':      'mixamorigSpine',
      'CC_Base_Spine01':    'mixamorigSpine1',
      'CC_Base_Spine02':    'mixamorigSpine2',
      'CC_Base_Head':       'mixamorigHead',
      'CC_Base_NeckTwist01': 'mixamorigNeck',
      'CC_Base_NeckTwist02': 'mixamorigHead',
      'CC_Base_L_Thigh':    'mixamorigLeftUpLeg',
      'CC_Base_L_Calf':     'mixamorigLeftLeg',
      'CC_Base_L_Foot':     'mixamorigLeftFoot',
      'CC_Base_L_ToeBase':  'mixamorigLeftToeBase',
      'CC_Base_R_Thigh':    'mixamorigRightUpLeg',
      'CC_Base_R_Calf':     'mixamorigRightLeg',
      'CC_Base_R_Foot':     'mixamorigRightFoot',
      'CC_Base_R_ToeBase':  'mixamorigRightToeBase',
      'CC_Base_L_Clavicle': 'mixamorigLeftShoulder',
      'CC_Base_L_Upperarm': 'mixamorigLeftArm',
      'CC_Base_L_Forearm':  'mixamorigLeftForeArm',
      'CC_Base_L_Hand':     'mixamorigLeftHand',
      'CC_Base_R_Clavicle': 'mixamorigRightShoulder',
      'CC_Base_R_Upperarm': 'mixamorigRightArm',
      'CC_Base_R_Forearm':  'mixamorigRightForeArm',
      'CC_Base_R_Hand':     'mixamorigRightHand',
    };

    function retargetCCClipToTarget(ccClip, ccModel, targetModel, boneMap, hipsTargetBoneName, targetGender) {
      const tracks = [];

      function stripCCPrefixSuffix(name) {
        return name.replace(/_\d+$/, '');
      }

      // Read the world quaternions of all bones in true bind pose
      const ccBones = {};
      ccModel.traverse(c => {
        if (c.isBone) {
          const base = stripCCPrefixSuffix(c.name);
          const gender = getCharacterGenderFromBoneName(c.name);
          if (gender !== targetGender) return;

          ccBones[base] = {
            bone: c,
            restWorldQ: getBoneBindWorldQuaternion(c, ccModel),
            parentWorldQ: c.parent && c.parent.isBone 
              ? getBoneBindWorldQuaternion(c.parent, ccModel) 
              : new THREE.Quaternion()
          };
        }
      });

      const targetBones = {};
      targetModel.traverse(c => {
        if (c.isBone) {
          targetBones[c.name] = {
            bone: c,
            restWorldQ: getBoneBindWorldQuaternion(c, targetModel),
            parentWorldQ: c.parent && c.parent.isBone 
              ? getBoneBindWorldQuaternion(c.parent, targetModel) 
              : new THREE.Quaternion()
          };
        }
      });

      // Retarget tracks
      for (const track of ccClip.tracks) {
        const [boneFull, prop] = track.name.split('.');
        if (prop !== 'quaternion' && prop !== 'position') continue;

        const gender = getCharacterGenderFromBoneName(boneFull);
        if (gender !== targetGender) continue;

        const baseName = stripCCPrefixSuffix(boneFull);
        const targetBoneName = boneMap[baseName];
        if (!targetBoneName) continue;

        const srcMeta = ccBones[baseName];
        const tgtMeta = targetBones[targetBoneName];
        if (!srcMeta || !tgtMeta) continue;

        const clone = track.clone();
        clone.name = `${targetBoneName}.${prop}`;

        if (prop === 'quaternion') {
          const B_src = srcMeta.restWorldQ;
          const P_src = srcMeta.parentWorldQ;
          const B_tgt = tgtMeta.restWorldQ;
          const P_tgt = tgtMeta.parentWorldQ;

          const P_tgt_inv = P_tgt.clone().invert();
          const B_src_inv = B_src.clone().invert();

          for (let i = 0; i < clone.values.length; i += 4) {
            const q = new THREE.Quaternion(clone.values[i], clone.values[i+1], clone.values[i+2], clone.values[i+3]);
            
            // P_tgt_inv * P_src * q * B_src_inv * B_tgt
            const resQ = P_tgt_inv.clone()
              .multiply(P_src)
              .multiply(q)
              .multiply(B_src_inv)
              .multiply(B_tgt);

            clone.values[i] = resQ.x;
            clone.values[i+1] = resQ.y;
            clone.values[i+2] = resQ.z;
            clone.values[i+3] = resQ.w;
          }
          tracks.push(clone);
        } else if (prop === 'position' && targetBoneName === hipsTargetBoneName) {
          const scaleFactor = ccModel.scale.x / targetModel.scale.x;
          for (let i = 0; i < clone.values.length; i += 3) {
            clone.values[i]   *= scaleFactor;
            clone.values[i+1] *= scaleFactor;
            clone.values[i+2] *= scaleFactor;
          }
          tracks.push(clone);
        }
      }

      // If no hips position track was created, add a constant one to match height
      const hasHipsPos = tracks.some(t => t.name === `${hipsTargetBoneName}.position`);
      if (!hasHipsPos && ccBones['CC_Base_Hip'] && targetBones[hipsTargetBoneName]) {
        const srcHips = ccBones['CC_Base_Hip'].bone;
        const scaleFactor = ccModel.scale.x / targetModel.scale.x;
        const pos = srcHips.position.clone().multiplyScalar(scaleFactor);
        const times = new Float32Array([0, ccClip.duration]);
        const values = new Float32Array([pos.x, pos.y, pos.z, pos.x, pos.y, pos.z]);
        const posTrack = new THREE.VectorKeyframeTrack(`${hipsTargetBoneName}.position`, times, values);
        tracks.push(posTrack);
        console.log(`[retarget] Created constant position track for hips:`, pos);
      }

      return new THREE.AnimationClip(`${ccClip.name}_retargeted`, ccClip.duration, tracks);
    }

    // ── INIT ────────────────────────────────────────────────────────────────
    async function init() {
      try {
        await loadChar('a', CHAR_A, 'Lara A', document.getElementById('pill-a'));
        await loadChar('b', CHAR_B, 'X-Bot', document.getElementById('pill-b'));
        await loadRef('ra', CC_REF_A, 'CC Femme', document.getElementById('pill-ra'));
        await loadRef('rb', CC_REF_B, 'CC Homme', document.getElementById('pill-rb'));

        // Retarget animations dynamically
        if (rawClips.ra && refModels.ra && models.a) {
          const retargetedA = retargetCCClipToTarget(rawClips.ra, refModels.ra, models.a, CC_TO_LARA, 'mixamorig_root_hips', 'female');
          const actionA = mixers.a.clipAction(retargetedA);
          actionA.setLoop(THREE.LoopRepeat, Infinity);
          actionA.clampWhenFinished = false;
          if (isPlaying) actionA.play();
          actions.a = actionA;
          console.log("Retargeted Lara A animation successfully!", retargetedA);
        }
        
        if (rawClips.rb && refModels.rb && models.b) {
          const retargetedB = retargetCCClipToTarget(rawClips.rb, refModels.rb, models.b, CC_TO_XBOT, 'mixamorigHips', 'male');
          const actionB = mixers.b.clipAction(retargetedB);
          actionB.setLoop(THREE.LoopRepeat, Infinity);
          actionB.clampWhenFinished = false;
          if (isPlaying) actionB.play();
          actions.b = actionB;
          console.log("Retargeted X-Bot animation successfully!", retargetedB);
        }

        setLoadMsg('Prêt !', 100);
        document.getElementById('hud-dur').textContent = animDuration.toFixed(1) + ' s';
        applyLayout();
        setTimeout(() => {
          document.getElementById('loading').style.opacity = '0';
          setTimeout(() => document.getElementById('loading').remove(), 500);
        }, 300);
        window.mixers = mixers;
        window.actions = actions;
        window.models = models;
        window.scene = scene;
        window.refModels = refModels;
      } catch(e) {
        console.error(e);
        document.getElementById('loading-msg').textContent = 'Erreur : ' + e.message;
      }
    }

    // ── LAYOUT ──────────────────────────────────────────────────────────────
    function applyLayout() {
      if (!wrappers.a || !wrappers.b) return;

      if (layout === 'overlay') {
        // Tout au centre, CC légèrement en arrière
        wrappers.a.position.x    = 0;
        wrappers.b.position.x    = 0;
        if (refWrappers.ra) { refWrappers.ra.position.x = 0; refWrappers.ra.position.z = -30; }
        if (refWrappers.rb) { refWrappers.rb.position.x = 0; refWrappers.rb.position.z = -30; }
        controls.target.set(0, 90, 0);
        camera.position.set(0, 120, 320);
      } else {
        // Côte à côte : Lara A gauche, CC Femme derrière elle ; X-Bot droite, CC Homme derrière lui
        wrappers.a.position.x    = -70;
        wrappers.b.position.x    =  70;
        if (refWrappers.ra) { refWrappers.ra.position.x = -70; refWrappers.ra.position.z = -30; }
        if (refWrappers.rb) { refWrappers.rb.position.x =  70; refWrappers.rb.position.z = -30; }
        controls.target.set(0, 90, 0);
        camera.position.set(0, 120, 420);
      }
      controls.update();
    }

    // ── UI ──────────────────────────────────────────────────────────────────
    const btnPlay = document.getElementById('btn-play');
    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      btnPlay.classList.toggle('active', isPlaying);
      ['a','b'].forEach(k => {
        if (!actions[k]) return;
        if (isPlaying) { actions[k].paused = false; actions[k].play(); }
        else actions[k].paused = true;
      });
      ['ra','rb'].forEach(k => {
        if (!refActions[k]) return;
        if (isPlaying) { refActions[k].paused = false; refActions[k].play(); }
        else refActions[k].paused = true;
      });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      ['a','b'].forEach(k => {
        if (!actions[k]) return;
        actions[k].stop();
        actions[k].play();
      });
      ['ra','rb'].forEach(k => {
        if (!refActions[k]) return;
        refActions[k].stop();
        refActions[k].play();
      });
      currentTime = 0;
    });

    document.getElementById('btn-layout').addEventListener('click', () => {
      layout = layout === 'overlay' ? 'side' : 'overlay';
      applyLayout();
    });

    const slSpeed = document.getElementById('sl-speed');
    const speedVal = document.getElementById('speed-val');
    slSpeed.addEventListener('input', () => {
      playbackSpeed = parseFloat(slSpeed.value);
      speedVal.textContent = playbackSpeed.toFixed(2) + '×';
      ['a','b'].forEach(k => { if (actions[k]) actions[k].timeScale = playbackSpeed; });
      ['ra','rb'].forEach(k => { if (refActions[k]) refActions[k].timeScale = playbackSpeed; });
    });

    // Timeline scrubbing
    const slTime = document.getElementById('sl-time');
    const timeLabel = document.getElementById('time-label');
    let scrubbing = false;
    slTime.addEventListener('mousedown', () => { scrubbing = true; });
    slTime.addEventListener('mouseup',   () => { scrubbing = false; });
    slTime.addEventListener('input', () => {
      const t = (parseFloat(slTime.value) / 100) * animDuration;
      [...['a','b']].forEach(k => {
        if (!actions[k]) return;
        actions[k].time = t;
        if (mixers[k]) mixers[k].update(0);
      });
      ['ra','rb'].forEach(k => {
        if (!refActions[k]) return;
        refActions[k].time = t;
        if (refMixers[k]) refMixers[k].update(0);
      });
      timeLabel.textContent = t.toFixed(2) + ' s';
    });

    // Lara visibility + opacity
    ['a','b'].forEach(k => {
      document.getElementById(`vis-${k}`).addEventListener('change', e => {
        if (wrappers[k]) wrappers[k].visible = e.target.checked;
        if (skels[k]) skels[k].visible = e.target.checked && document.getElementById('vis-skel').checked;
      });
      document.getElementById(`op-${k}`).addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        document.getElementById(`op-${k}-val`).textContent = v.toFixed(2);
        if (models[k]) setMeshOpacity(models[k], v);
      });
    });

    // CC ref visibility + opacity
    ['ra','rb'].forEach(k => {
      document.getElementById(`vis-${k}`).addEventListener('change', e => {
        if (refWrappers[k]) refWrappers[k].visible = e.target.checked;
        if (refSkels[k]) refSkels[k].visible = e.target.checked && document.getElementById('vis-skel').checked;
      });
      document.getElementById(`op-${k}`).addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        document.getElementById(`op-${k}-val`).textContent = v.toFixed(2);
        if (refModels[k]) setMeshOpacity(refModels[k], v);
      });
    });

    document.getElementById('vis-skel').addEventListener('change', e => {
      ['a','b'].forEach(k => {
        if (skels[k]) skels[k].visible = e.target.checked && wrappers[k]?.visible;
      });
      ['ra','rb'].forEach(k => {
        if (refSkels[k]) refSkels[k].visible = e.target.checked && refWrappers[k]?.visible;
      });
    });
    document.getElementById('vis-grid').addEventListener('change', e => {
      grid.visible = e.target.checked;
    });

    // ── RENDER LOOP ─────────────────────────────────────────────────────────
    let fpsFrames = 0, lastFps = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (isPlaying) {
        ['a','b'].forEach(k => { if (mixers[k]) mixers[k].update(dt); });
        ['ra','rb'].forEach(k => { if (refMixers[k]) refMixers[k].update(dt); });

        // sync timeline slider
        if (!scrubbing && animDuration > 0) {
          const ref = actions.a || refActions.ra;
          if (ref) {
            currentTime = ref.time % animDuration;
            const pct = (currentTime / animDuration) * 100;
            slTime.value = pct;
            timeLabel.textContent = currentTime.toFixed(2) + ' s';
          }
        }
      }

      controls.update();
      renderer.render(scene, camera);

      fpsFrames++;
      const now = performance.now();
      if (now - lastFps >= 1000) {
        document.getElementById('hud-fps').textContent = fpsFrames;
        fpsFrames = 0;
        lastFps = now;
      }
    }

    window.addEventListener('resize', () => {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    init().then(animate);
  </script>
